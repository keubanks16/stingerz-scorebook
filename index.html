      const other = pas.filter((p) => !p.loc && !p.imp).map((p) => (E.RESULTS[p.r] || {}).n || p.r).join(', ');
      // Imported chart balls, summarized as counts per spot (they have no contact type or distance).
      const impCounts = {};
      for (const p of pas) if (p.imp) { const k = [SPRAY_ZONES[p.zone].name, BT_NAME[p.bt] && BT_NAME[p.bt].toLowerCase(), SPRAY_RES[p.res] && SPRAY_RES[p.res].n.toLowerCase()].filter(Boolean).join(', '); impCounts[k] = (impCounts[k] || 0) + 1; }
      const imp = Object.entries(impCounts).sort((x, y) => y[1] - x[1]).map(([k, n]) => `- ${k}: ${n}`).join('\n');
      const prompt = `You are a baseball scouting assistant helping a high school coach. Using only the data below, write a short scouting report on ${sel ? 'this opposing hitter' : 'this opposing lineup as a whole'}: where to position the infield and the outfield, and one pitching note if the data supports it. Use 3 to 5 bullet points that start with "- ". Plain text, no headings, no preamble. If the sample is small, say so in the first bullet.\n\nOpponent: ${O.name}\n${sel ? 'Hitter: ' + hitterLabel(sel) + (sel.bats ? ', bats ' + sel.bats : '') : 'Whole lineup'}\nPlate appearances: ${line.PA}; ${line.H} hits in ${line.AB} at-bats; ${line.BB} walks or HBP; ${line.K} strikeouts.\nBalls in play from games we scored (field zone from the catcher's view, contact type, result, distance):\n${bip || '(none charted)'}\n${other ? 'Plate appearances without a charted location: ' + other + '\n' : ''}${imp ? 'Balls in play from an imported season spray chart (spot, contact type: count; results are not on the chart):\n' + imp + '\n' : ''}Direction split: left ${pct(t.L, t.n)}%, center ${pct(t.C, t.n)}%, right ${pct(t.R, t.n)}% of ${t.n} balls in play.`;
      const ctl = new AbortController();
      UI.ai[key] = { busy: true, text: '', ctl };
      render();
      try {
        const res = await Caps.sample(prompt, { signal: ctl.signal, onText: ({ text }) => { UI.ai[key].text = text; const out = document.getElementById('ai-out'); if (out) out.textContent = text; } });
        UI.ai[key] = { text: res.text, err: res.truncated ? 'The report was cut short.' : '' };
      } catch (e) {

        const keep = (e && e.text) || '';
        if (HIDE_CODES.includes(code) && Caps.sample && !Caps.sample.worker) { Caps.sample = null; UI.ai[key] = {}; }
        else if (code === 'cancelled') UI.ai[key] = { text: keep };
        else UI.ai[key] = { text: code === 'refused' ? '' : keep, err: aiErrorText(e, 'report') };
      }
      render();
    },

  // ---------- in-app streaming: camera phone (WHIP) and family player (WHEP) ----------
  const ICE = [{ urls: 'stun:stun.cloudflare.com:3478' }];
  function iceDone(pc, ms) {
    return new Promise((res) => {
      if (pc.iceGatheringState === 'complete') return res();
      const t = setTimeout(res, ms);
      pc.addEventListener('icegatheringstatechange', () => { if (pc.iceGatheringState === 'complete') { clearTimeout(t); res(); } });
    });
  }
  async function sdpExchange(pc, url) {
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await iceDone(pc, 2500);
    const r = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/sdp' }, body: pc.localDescription.sdp });
    if (!r.ok) throw { code: 'whip', status: r.status };
    const loc = r.headers.get('Location');
    const answer = await r.text();
    await pc.setRemoteDescription({ type: 'answer', sdp: answer });
    return loc ? new URL(loc, url).href : null;
  }
  function endSession(url) { if (url) fetch(url, { method: 'DELETE' }).catch(() => {}); }

  // Family player
  const Player = { pc: null, session: null, url: null, video: null, retry: 0 };
  function playerStop() {
    clearTimeout(Player.retry);
    if (Player.pc) { try { Player.pc.close(); } catch (e) { /* closed */ } }
    endSession(Player.session);
    Player.pc = null; Player.session = null; Player.url = null; Player.video = null;
  }
  function playerMsg(t) { const m = $('#dock-msg'); if (m) { m.textContent = t; m.hidden = !t; } }
  async function playerStart(url, video) {
    playerStop();
    Player.url = url; Player.video = video;
    const pc = new RTCPeerConnection({ iceServers: ICE, bundlePolicy: 'max-bundle' });
    Player.pc = pc;
    pc.addTransceiver('video', { direction: 'recvonly' });
    pc.addTransceiver('audio', { direction: 'recvonly' });
    const ms = new MediaStream();
    video.srcObject = ms;
    pc.ontrack = (e) => { ms.addTrack(e.track); video.play().catch(() => {}); };
    pc.onconnectionstatechange = () => {
      if (Player.pc !== pc) return;
      if (pc.connectionState === 'connected') playerMsg('');
      else if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') { playerMsg('Reconnecting to the camera…'); playerRetry(url, video, 3000); }
    };
    try { Player.session = await sdpExchange(pc, url); }
    catch (e) { if (Player.pc === pc) { playerMsg('Waiting for the camera to start…'); playerRetry(url, video, 5000); } }
  }
  function playerRetry(url, video, ms) {
    clearTimeout(Player.retry);
    Player.retry = setTimeout(() => { if (Player.url === url && document.body.contains(video)) playerStart(url, video); }, ms);
  }

  // Recordings on this phone (IndexedDB, saved in 10-second pieces)
  const RecDB = {
    db: null,
    open() {

            (n) => ytJob(rid, { pct: Math.min(99, Math.floor(((start + n) / total) * 100)) }));
          if (r.status === 308) { offset = ytNext(r); fails = 0; ytJob(rid, { pct: Math.min(99, Math.floor((offset / total) * 100)) }); continue; }
          if (r.status === 200 || r.status === 201) { video = ytVideo(r); if (!video) throw { code: 'yt_failed', message: 'YouTube didn’t return the video.' }; break; }
          if (r.status === 401) throw { code: 'yt_auth' };
          if (r.status === 404 || r.status === 410) { expired = true; break; }
          if (r.status === 0 || r.status >= 500) {
            if (++fails > 6) throw { code: 'yt_network' };
            await sleep(Math.min(30000, 1000 * 2 ** fails));
            const q = await ytXhr('PUT', meta.ytUrl, Object.assign({ 'Content-Range': 'bytes */' + total }, auth()));
            if (q.status === 308) offset = ytNext(q);
            else if (q.status === 200 || q.status === 201) video = ytVideo(q);
            else if (q.status === 401) throw { code: 'yt_auth' };
            continue;
          }
          throw { code: 'yt_failed', message: ytApiMsg(r) };
        }
        if (expired) { if (restarted) throw { code: 'yt_failed', message: 'The upload session expired.' }; restarted = true; meta.ytUrl = null; }
      }
      meta.yt = { id: video.id, at: Date.now() };
      delete meta.ytUrl; delete meta.ytTotal;
      await RecDB.putMeta(meta);
      ytJob(rid, { state: 'done', pct: 100, err: '' });
      toast('Uploaded to YouTube');
      const y = ytCfg();
      if (y && y.attach && meta.gid && Data.games[meta.gid] && !Data.games[meta.gid].video) await ytSetReplay(meta.gid, video.id);
    } catch (e) {
      if (e && e.code === 'yt_auth') { YT.token = null; ytJob(rid, { state: 'paused', err: 'YouTube sign-in expired. Tap Continue upload.' }); }
      else { try { await RecDB.putMeta(meta); } catch (e2) { /* keep going */ } ytJob(rid, { state: 'error', err: ytErrText(e) }); }
    }
    if (!wasLive && !Cam.wantLive) camWake(false);
    await loadRecs();
  }
  async function ytSetReplay(gid, id) {
    try {
      await FB.F.updateDoc(FB.F.doc(FB.fs, 'games', gid), { video: 'https://youtu.be/' + id, updatedAt: Date.now() });
      toast('Replay added to the game page');
    } catch (e) {
      toast(e && e.code === 'permission-denied' ? 'Couldn’t add the replay. Check that the latest security rules are published.' : 'Couldn’t add the replay link.');
    }
  }

  Object.assign(A, {
    async camOpen() {
      const g = liveGame();
      if (!g) { toast('Start the game first, then stream it.'); return; }
      if (!loadAiCfg()) { toast('Connect your Cloudflare Worker first, under Team.'); return; }
      Cam.open = true; Cam.gid = g.id; Cam.err = ''; Cam.confirmEnd = false;
      if (ytCfg()) ytLoad().catch(() => {});
      if (!Cam.wantLive) Cam.state = 'starting';
      camEl().hidden = false;
      document.body.classList.add('cam-on');
      camRender();
      if (Cam.wantLive) return;
      try { await camMedia(); Cam.state = 'preview'; }
      catch (e) { Cam.state = 'preview'; Cam.err = aiErrorText({ code: 'camera' }); }
      if (Recs.list === null) loadRecs();
      camRender();
    },
    camClose() {
      if (Cam.wantLive) return;
      if (Cam.stream) Cam.stream.getTracks().forEach((t) => t.stop());
      Cam.stream = null; Cam.open = false; Cam.state = 'off';
      const el = $('#cam'); if (el) { el.hidden = true; $('#cam-bar').innerHTML = ''; }
      document.body.classList.remove('cam-on');
      render();
    },
    camMic() { Cam.mic = !Cam.mic; if (Cam.stream) Cam.stream.getAudioTracks().forEach((t) => { t.enabled = Cam.mic; }); camRender(); },
    async camFlip() {
      Cam.facing = Cam.facing === 'environment' ? 'user' : 'environment';
      try { await camMedia(); } catch (e) { Cam.err = aiErrorText({ code: 'camera' }); }
      camRender();
    },
    async camGo() {
      const cfg = loadAiCfg();
      const g = Data.games[Cam.gid];
      if (!cfg || !g || !Cam.stream) return;
      Cam.err = ''; Cam.state = 'connecting'; Cam.wantLive = true; camRender();
      if (!Cam.startedAt) Cam.sessionRids = [];
      try {
        const saved = camSaved();
        if (saved && saved.gid === g.id && Data.stream && Data.stream.live && Data.stream.uid === saved.uid) {
          Object.assign(Cam, { uid: saved.uid, whip: saved.whip, whep: saved.whep });
        } else {
          const d = await workerCall(cfg, 'live-start', { name: Data.team.name + ' ' + camGameName(g) });
          Object.assign(Cam, { uid: d.uid, whip: d.whip, whep: d.whep });
          camSave({ gid: g.id, uid: d.uid, whip: d.whip, whep: d.whep });
        }
        await publish();
        Cam.startedAt = Cam.startedAt || Date.now();
        Data.stream = { gid: g.id, uid: Cam.uid, whep: Cam.whep, live: true, startedAt: Cam.startedAt };
        Saver.put('team/stream', Data.stream);
        camWake(true);
        await recStart();
        clearInterval(Cam.timer);
        Cam.timer = setInterval(camRender, 1000);
      } catch (e) {
        Cam.wantLive = false; Cam.state = 'preview';
        Cam.err = aiErrorText(e, 'stream') || 'Could not start the stream.';
      }
      camRender();
    },
    async camResume() {
      Cam.err = '';
      try { await camMedia(); } catch (e) { Cam.err = aiErrorText({ code: 'camera' }); camRender(); return; }
      Cam.state = 'reconnecting'; camRender();
      camWake(true);
      try { await publish(); } catch (e) { camRetry(4000); }
      await recStart();
    },
    async camEnd() {
      if (!Cam.confirmEnd) { Cam.confirmEnd = true; camRender(); setTimeout(() => { Cam.confirmEnd = false; camRender(); }, 4000); return; }
      // Ask Google for upload permission inside this tap, so the upload can start by itself.
      const y = ytCfg();
      const tokP = y && y.auto !== false ? ytToken().then(() => null, (e) => e) : null;
      Cam.confirmEnd = false; Cam.wantLive = false;
      clearTimeout(Cam.retry); clearInterval(Cam.timer);
      if (Cam.pc) { try { Cam.pc.close(); } catch (e) { /* closed */ } }
      endSession(Cam.session); Cam.pc = null; Cam.session = null;
      const recDone = recStop();
      const cfg = loadAiCfg();
      if (cfg && Cam.uid) workerCall(cfg, 'live-end', { uid: Cam.uid }).catch(() => {});
      if (Data.stream && Data.stream.uid === Cam.uid) { Data.stream = Object.assign({}, Data.stream, { live: false, endedAt: Date.now() }); Saver.put('team/stream', Data.stream); }
      camSave(null);
      Cam.uid = null; Cam.whip = null; Cam.whep = null; Cam.startedAt = 0;
      camWake(false);
      if (Cam.stream) Cam.stream.getTracks().forEach((t) => t.stop());
      Cam.stream = null;
      Cam.state = 'ended';
      camRender();
      const rids = (Cam.sessionRids || []).slice();
      Cam.sessionRids = [];
      await recDone;
      await loadRecs();
      if (tokP) {
        const err = await tokP;
        if (err) { const t = ytErrText(err); if (t) toast(t); return; }
        for (const rid of rids) await ytUpload(rid);
      }
    },
    async recPrepare(d) {
      const r = Recs.list && Recs.list.find((x) => x.rid === d.rid);
      if (!r) return;
      Recs.busy[r.rid] = true; render(); camRender();
      try {
        const parts = await RecDB.chunks(r.rid);
        const blob = new Blob(parts.map((c) => c.blob), { type: r.type || 'video/mp4' });
        const ext = /webm/.test(r.type || '') ? 'webm' : 'mp4';
        Recs.files[r.rid] = new File([blob], ('GS ' + (r.title || 'game')).replace(/[^\w .@-]+/g, '').trim() + '.' + ext, { type: r.type || 'video/mp4' });
      } catch (e) { toast('Could not open that recording.'); }
      delete Recs.busy[r.rid];
      render(); camRender();
    },
    async recSave(d) {
      const f = Recs.files[d.rid];
      if (!f) return;
      if (navigator.canShare && navigator.canShare({ files: [f] })) {
        try { await navigator.share({ files: [f], title: f.name }); } catch (e) { /* the viewer closed the share sheet */ }
        return;
      }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(f); a.download = f.name;
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 5000);
    },
    recDelete(d) {
      confirmSheet('Delete this video from the phone?', 'Only delete it after you’ve saved it to Photos or uploaded it. This can’t be undone.', 'Delete video', async () => {
        try { await RecDB.remove(d.rid); } catch (e) { toast('Could not delete it.'); }
        delete Recs.files[d.rid];
        await loadRecs();
        toast('Video deleted from this phone');
      }, true);
    },
    ytStart(d) {
      const p = ytToken();
      p.then(() => ytUpload(d.rid), (e) => { const t = ytErrText(e); if (t) toast(t); });
    },
    async ytReplay(d) {
      const r = Recs.list && Recs.list.find((x) => x.rid === d.rid);
      if (r && r.yt && r.gid) { await ytSetReplay(r.gid, r.yt.id); render(); if (Cam.open) camRender(); }
    },
    ytSetup() { const y = Data.team.yt || {}; openSheet({ type: 'yt', clientId: y.clientId || '', auto: y.auto !== false, attach: !!y.attach }); },
    ytAuto(d) { UI.sheet.auto = d.v === 'on'; renderSheet(); },
    ytAttach(d) { UI.sheet.attach = d.v === 'on'; renderSheet(); },
    ytSave() {
      const sh = UI.sheet;
      const id = String(sh.clientId || '').trim();
      if (!/^[\w.-]+\.apps\.googleusercontent\.com$/.test(id)) { sh.err = 'Paste the OAuth client ID from Google Cloud. It ends in .apps.googleusercontent.com.'; return renderSheet(); }
      Data.team.yt = { clientId: id, auto: !!sh.auto, attach: !!sh.attach };
      saveTeam();
      YT.client = null;
      ytLoad().catch(() => {});
      closeSheet(); render(); toast('YouTube uploads saved');
    },
    ytClear() { delete Data.team.yt; saveTeam(); YT.client = null; YT.token = null; closeSheet(); render(); toast('YouTube uploads turned off'); },
    dockUnmute() { const v = $('#dock-video'); if (v) { v.muted = false; v.play().catch(() => {}); } const b = $('#dock-unmute'); if (b) b.hidden = true; }
  });

  function doImport(file) {
    const reader = new FileReader();
    reader.onload = () => {
      let d;
      try { d = JSON.parse(reader.result); } catch (e) { toast("That file isn't a GS Baseball backup."); return; }
      if (!d || d.app !== 'gs-baseball' || !Array.isArray(d.games)) { toast("That file isn't a GS Baseball backup."); return; }
      confirmSheet('Import this backup?', `It has ${d.games.length} game${d.games.length === 1 ? '' : 's'} and ${(d.team && d.team.players || []).length} players. Games with the same ID are replaced, and the roster is replaced by the one in the backup.`, 'Import', () => {
        Data.team = normTeam(d.team);
        saveTeam();
        for (const g of d.games) { if (!g || !g.id) continue; Data.games[g.id] = normGame(g); saveGame(Data.games[g.id]); }
        for (const o of d.opponents || []) { if (o && o.name) saveRoster(normRoster(o)); }
        render();
        toast('Backup imported');
      });
    };
    reader.readAsText(file);
  }

  // ---------- signal ----------
  window.addEventListener('online', () => { syncPill(); pingNotify(); });
  window.addEventListener('offline', () => syncPill());
  setInterval(() => { if (Saver.q.size || navigator.onLine === false) syncPill(); }, 3000);

  // ---------- events ----------
  document.addEventListener('click', (ev) => {
    const pl = ev.target.closest('a[data-paylink]');
    if (pl) { Fees.pending = { fee: pl.dataset.fee, pid: pl.dataset.pid, method: pl.dataset.paylink, at: Date.now() }; return; }
    const el = ev.target.closest('[data-act]');
    if (!el) return;
    if (el.disabled) return;
    const fn = A[el.dataset.act];
    if (!fn) return;
    if (el.tagName === 'A') ev.preventDefault();
    fn(el.dataset, el, ev);
  });
  document.addEventListener('input', (ev) => {
    const el = ev.target;
    if (el.dataset && el.dataset.bind && UI.sheet) setPath(UI.sheet, el.dataset.bind, el.value);
  });
  document.addEventListener('change', (ev) => {
    const el = ev.target;
    if (el.id === 'import-file' && el.files && el.files[0]) { doImport(el.files[0]); el.value = ''; return; }
    if (el.id === 'chat-file' && el.files && el.files[0]) { const f = el.files[0]; el.value = ''; chatPickPhoto(f); return; }
    if (el.dataset && el.dataset.scan && el.files && el.files.length) { const files = Array.from(el.files); el.value = ''; runScan(files); return; }
    if (el.dataset && el.dataset.spray && el.files && el.files.length) { const files = Array.from(el.files); el.value = ''; runSprayRead(files); return; }
    if (el.dataset && el.dataset.bind && UI.sheet) { setPath(UI.sheet, el.dataset.bind, el.value); if (UI.sheet.type === 'spray' && el.dataset.bind.startsWith('read.')) { const m = /^read\.players\.(\d+)\./.exec(el.dataset.bind); if (m && UI.sheet.read.players[+m[1]]) UI.sheet.read.players[+m[1]].picked = true; renderSheet(); } }
  });
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape' && ViewerId) { viewerClose(); return; }
    if (ev.key === 'Escape' && UI.sheet) closeSheet();
    if (ev.key === 'Enter' && !ev.shiftKey && ev.target && ev.target.id === 'chat-input' && !('ontouchstart' in window)) { ev.preventDefault(); chatSend(); }
  });
  document.addEventListener('submit', (ev) => { if (ev.target && ev.target.id === 'chat-bar') { ev.preventDefault(); chatSend(); } });
  document.addEventListener('input', (ev) => { if (ev.target && ev.target.id === 'chat-input') chatGrow(); });

  // ---------- boot ----------
  function subscribe(db) {
    const subs = [];
    subs.push(db.doc('team/stream').onSnapshot((snap) => {
      if (!Saver.busy('team/stream')) Data.stream = snap.exists ? clone(snap.data()) : null;
      scheduleRender();
    }, () => {}));
    subs.push(db.doc('team/main').onSnapshot((snap) => {
      if (!Saver.busy('team/main')) Data.team = normTeam(snap.exists ? clone(snap.data()) : null);
      Data.loaded.team = true;
      maybeReady();
    }, onDbError));
    subs.push(db.collection('games').onSnapshot((snap) => {
      const next = {};
      for (const doc of snap.docs) if (doc.exists) next[doc.id] = normGame(clone(doc.data()));
      for (const id in Data.games) if (Saver.busy('games/' + id)) next[id] = Data.games[id];
      for (const id of Object.keys(next)) if (Saver.deleting.has('games/' + id)) delete next[id];
      Data.games = next;
      Data.loaded.games = true;
      maybeReady();
    }, onDbError));
    subs.push(db.collection('opponents').onSnapshot((snap) => {
      const next = {};
      for (const doc of snap.docs) if (doc.exists && !Saver.deleting.has('opponents/' + doc.id)) next[doc.id] = normRoster(clone(doc.data()));
      for (const k in Data.opponents) if (Saver.busy('opponents/' + k)) next[k] = Data.opponents[k];
      Data.opponents = next;
      Data.loaded.opps = true;
      maybeReady();
    }, onDbError));
    return subs;
  }
  function onDbError(err) {
    if (err && err.code === 'permission_denied') {
      if (Backend.kind === 'fb' && Access.canView) toast("Games couldn't load. Check that the security rules are published in Firebase.");
    } else if (err && err.code === 'revoked') toast('Access to this team changed. Reload to continue.');
    else toast('Live updates paused. Reload the page to reconnect.');
  }
  // Puts back changes made on this phone that never reached the server (the app was closed or
  // restarted with no signal). A copy only wins if it's newer than what the server has.
  function restoreUnsynced() {
    const m = Unsynced.all();
    const paths = Object.keys(m);
    if (!paths.length) return;
    if (!Access.isAdmin) { Unsynced.save({}); return; }
    let n = 0;
    for (const path of paths) {
      const x = m[path] || {};
      const [col, id] = path.split('/');
      const data = x.data;
      if (!data || !id || (col !== 'games' && col !== 'opponents')) { Unsynced.drop(path); continue; }
      const cur = col === 'games' ? Data.games[id] : Data.opponents[id];
      const newer = cur ? (Number(data.updatedAt) || 0) > (Number(cur.updatedAt) || 0) : Date.now() - (x.at || 0) < 86400000;
      if (!newer) { Unsynced.drop(path); continue; }
      if (col === 'games') { Data.games[id] = normGame(data); Saver.put(path, Data.games[id]); } else { Data.opponents[id] = normRoster(data); Saver.put(path, Data.opponents[id]); }
      n++;
    }
    if (n) { scheduleRender(); toast(n === 1 ? 'Picked up a change that hadn\u2019t synced yet.' : 'Picked up ' + n + ' changes that hadn\u2019t synced yet.'); }
  }
  function maybeReady() {
    if (Data.loaded.team && Data.loaded.games && Data.loaded.opps) UI.ready = true;
    if (UI.ready && Backend.kind === 'fb' && Access.evaluated && !restoreUnsynced.done) { restoreUnsynced.done = true; restoreUnsynced(); }
    scheduleRender();
    if (UI.sheet && UI.sheet.type === 'playerCard') renderSheet();
  }
  async function boot() {
    render();
    const C = window.claude;
    if (!C || typeof C.use !== 'function') {
      UI.standalone = true;
      const cfg = loadAiCfg();
      if (cfg) Caps.sample = makeWorkerAI(cfg);
      // Keeps a copy of the Hub on this phone so it opens with no signal (also handles notifications).
      if ('serviceWorker' in navigator && window.isSecureContext) navigator.serviceWorker.register('firebase-messaging-sw.js').catch(() => {});
      const fbCfg = window.GS_FIREBASE;
      if (fbCfg && fbCfg.apiKey && fbCfg.projectId) { await bootFirebase(fbCfg); return; }
      Backend.loadLocal();
      UI.ready = true;
      render();
      return;
    }
    let db = null;
    try { db = await C.use('db'); } catch (e) { db = null; }
    if (!db) {
      Backend.loadLocal();
      UI.ready = true;
      render();
    } else {
      Backend.kind = 'db';
      Backend.db = db;
      // Decide who scores before the first frame: the owner always can, anyone else only
      // when the platform says they may write. Everyone else follows along read-only.
      try {
        const user = await C.use('user');
        if (user) {
          const [owner, can] = await Promise.all([user.isOwner(), user.can('data.write')]);
          UI.canWrite = can;
          UI.readOnly = !(owner || can === true);
        }
      } catch (e) { /* keep editing; a refused write decides */ }
      subscribe(db);
    }
    C.use('sample').then((s) => { Caps.sample = s; scheduleRender(); }).catch(() => {});
    C.use('downloads').then((d) => { Caps.downloads = d; }).catch(() => {});
  }
  boot();
})();
</script>
