<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html{background:#0B2753}:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;min-height:100vh;min-height:100dvh}img{max-width:100%}[hidden]{display:none!important}</style>
<title>GS Baseball Hub</title>
<meta name="theme-color" content="#0B2753">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GS Hub">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=Graduate&display=swap">
<style>
/* Layout: phone-first team hub (scorebook, video, chat). Navy brand bar on top, one scrolling column (max 760px), fixed tab bar at the bottom.
   Chamfered "varsity" corners, cut like the GS letterforms, mark the scoreboard and the primary actions. */
:root {
  --ground: #E8ECF2;
  --surface: #FFFFFF;
  --surface-2: #F2F5F9;
  --ink: #0B1C3D;
  --ink-2: #4A5874;
  --ink-3: #75829B;
  --line: #D4DBE6;
  --navy: #0B2753;
  --carolina: #6DA0D6;
  --accent: #245FA8;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCE8F6;
  --says-ink: #8A5A00; --paid-ink: #136B40; --due-ink: #B12E23;
  --board: #0B2753;
  --board-2: #12336A;
  --board-ink: #FFFFFF;
  --board-dim: #7F9AC4;
  --ball: #18834F;
  --strike: #C3392D;
  --warn: #B87A0A;
  --good: #18834F;
  --bad: #C3392D;
  --grass: #4A9558;
  --grass-2: #3E8049;
  --dirt: #C8946A;
  --chalk: #FFFFFF;
  --hit: #6DA0D6;
  --heat: #FF6B3D;
  --shadow: 0 1px 2px rgba(11, 28, 61, .06), 0 6px 18px rgba(11, 28, 61, .06);
  --scrim: rgba(4, 18, 45, .45);
  --on-signal: #FFFFFF;
  --c1: #0B2753; --c1-ink: #FFFFFF; --c2: #245FA8; --c2-ink: #FFFFFF; --c3: #6DA0D6; --c3-ink: #0B2753; --c4: #A9B6CA; --c4-ink: #0B1C3D;
  --font-display: "Graduate", "Rockwell", "Roboto Slab", Georgia, serif;
  --font-body: "Barlow Semi Condensed", "Arial Narrow", "Helvetica Neue", system-ui, sans-serif;
  --cut: 10px;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #04122D; --surface: #0A1D40; --surface-2: #0E2550; --ink: #E7EEF9; --ink-2: #A6B7D3; --ink-3: #7487A8; --line: #1B3364;
    --accent: #7FB0E6; --accent-ink: #04122D; --accent-soft: #15315F; --says-ink: #F2C94C; --paid-ink: #7FD3A4; --due-ink: #FF9C93;
    --board: #020A1C; --board-2: #0B1D42; --board-ink: #FFFFFF; --board-dim: #6F8BB8;
    --ball: #3DBE7C; --strike: #F06A5C; --warn: #E8B04A; --good: #3DBE7C; --bad: #F06A5C;
    --grass: #2F6B3B; --grass-2: #275A31; --dirt: #9E7452; --chalk: #F2F5FA; --hit: #8FBDF0; --heat: #FF7A4D;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25); --scrim: rgba(0, 4, 14, .6);
    --on-signal: #04122D;
    --c1: #2E5A9E; --c1-ink: #FFFFFF; --c2: #6DA0D6; --c2-ink: #04122D; --c3: #B9D5F2; --c3-ink: #04122D; --c4: #4B5E80; --c4-ink: #FFFFFF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #04122D; --surface: #0A1D40; --surface-2: #0E2550; --ink: #E7EEF9; --ink-2: #A6B7D3; --ink-3: #7487A8; --line: #1B3364;
  --accent: #7FB0E6; --accent-ink: #04122D; --accent-soft: #15315F; --says-ink: #F2C94C; --paid-ink: #7FD3A4; --due-ink: #FF9C93;
  --board: #020A1C; --board-2: #0B1D42; --board-ink: #FFFFFF; --board-dim: #6F8BB8;
  --ball: #3DBE7C; --strike: #F06A5C; --warn: #E8B04A; --good: #3DBE7C; --bad: #F06A5C;
  --grass: #2F6B3B; --grass-2: #275A31; --dirt: #9E7452; --chalk: #F2F5FA; --hit: #8FBDF0; --heat: #FF7A4D;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25); --scrim: rgba(0, 4, 14, .6);
  --on-signal: #04122D;
  --c1: #2E5A9E; --c1-ink: #FFFFFF; --c2: #6DA0D6; --c2-ink: #04122D; --c3: #B9D5F2; --c3-ink: #04122D; --c4: #4B5E80; --c4-ink: #FFFFFF;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--ground); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.4; -webkit-tap-highlight-color: transparent; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, table { font-variant-numeric: tabular-nums; }

/* ---------- brand bar ---------- */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--navy); color: #FFFFFF; }
.bar-in { max-width: 760px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
.mark { height: 34px; width: auto; display: block; }
.bar-title { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.bar-title b { font-family: var(--font-display); font-weight: 400; font-size: 19px; letter-spacing: .02em; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-title span { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #9EBBE2; font-weight: 600; }
.pill { font-size: 12px; font-weight: 600; letter-spacing: .04em; padding: 4px 10px; border-radius: 99px; background: rgba(255, 255, 255, .1); color: #CFE0F5; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #7FD3A4; }
.pill[data-s="saving"]::before { background: #F2C94C; }
.pill[data-s="error"]::before { background: #FF8A7A; }
.pill[data-s="local"]::before { background: #9EBBE2; }
.pill[data-s="follow"]::before { background: #FF6B5B; animation: pulse 1.6s infinite; }
.pill[data-s="offline"] { background: rgba(242, 201, 76, .18); color: #FCE7A6; cursor: pointer; }
.pill[data-s="offline"]::before { background: #F2C94C; }
@keyframes pulse { 50% { opacity: .35; } }

/* ---------- page column ---------- */
main { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 16px calc(96px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 18px; }
h2.sec { margin: 4px 0 -6px; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.muted { color: var(--ink-2); }
.small { font-size: 14px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }

/* ---------- buttons ---------- */
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 10px 14px; border-radius: 8px; font-weight: 600; font-size: 15px; line-height: 1.2; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; border-radius: 0; clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut)); outline-offset: -4px; letter-spacing: .02em; }
.btn.danger { color: var(--bad); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent); padding-inline: 6px; }
.btn.sm { min-height: 36px; padding: 6px 10px; font-size: 14px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.block { width: 100%; }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 7px 12px; border-radius: 7px; font-weight: 600; font-size: 14px; color: var(--ink-2); min-height: 34px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }

/* ---------- scoreboard (chamfered) ---------- */
.board { background: var(--board); color: var(--board-ink); clip-path: polygon(var(--cut) 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, var(--cut) 100%, 0 calc(100% - var(--cut)), 0 var(--cut)); padding: 14px 16px; position: relative; }
.board .lbl { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--board-dim); font-weight: 700; }
.linescore-wrap { overflow-x: auto; }
.linescore { border-collapse: collapse; width: 100%; }
.linescore th, .linescore td { text-align: center; padding: 5px 3px; font-size: 15px; min-width: 18px; }
.linescore thead th { color: var(--board-dim); font-weight: 600; font-size: 12px; }
.linescore td.tm { text-align: left; font-weight: 700; white-space: nowrap; max-width: min(140px, 26vw); overflow: hidden; text-overflow: ellipsis; padding-right: 8px; }
.linescore td.r { font-family: var(--font-display); font-size: 19px; color: var(--carolina); }
@media (max-width: 420px) { .board { padding: 12px; } .linescore th, .linescore td { padding: 4px 2px; font-size: 14px; } }
.linescore th.tot, .linescore td.tot { border-left: 1px solid var(--board-2); }
.linescore td.x { color: var(--board-dim); }

/* ---------- season summary ---------- */
.season { display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; align-items: center; }
.season .rec { font-family: var(--font-display); font-size: 40px; line-height: 1; color: var(--board-ink); }
.season .rec small { font-size: 18px; color: var(--board-dim); }
.season .facts { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 15px; color: #C9D8EE; }
.season .facts b { color: #FFFFFF; font-weight: 600; }
.season .lbl { grid-column: 1 / -1; }

/* ---------- game rows ---------- */
.list { display: flex; flex-direction: column; gap: 8px; }
.game-row { display: grid; grid-template-columns: 48px 1fr auto; gap: 12px; align-items: center; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
.game-row:hover { border-color: var(--accent); }
.gr-date { display: flex; flex-direction: column; align-items: center; line-height: 1.05; color: var(--ink-2); font-size: 11px; font-weight: 700; letter-spacing: .08em; }
.gr-date .d { font-family: var(--font-display); font-size: 22px; color: var(--ink); letter-spacing: 0; }
.gr-opp { font-weight: 700; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gr-meta { font-size: 14px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gr-res { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; }
.chip { display: inline-flex; align-items: center; justify-content: center; min-width: 26px; height: 24px; padding: 0 7px; border-radius: 6px; font-size: 13px; font-weight: 700; letter-spacing: .04em; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
.chip.w { background: var(--good); color: var(--on-signal); border-color: transparent; }
.chip.l { background: var(--bad); color: var(--on-signal); border-color: transparent; }
.chip.live { background: var(--strike); color: var(--on-signal); border-color: transparent; }
.chip.sample { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

.banner { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 12px 14px; border-radius: var(--radius); background: var(--accent-soft); color: var(--ink); font-size: 15px; }
.banner .grow { min-width: 200px; }
.empty { text-align: center; padding: 28px 18px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty img { height: 64px; width: auto; }
.empty h3 { margin: 0; font-size: 20px; }
.empty p { margin: 0; color: var(--ink-2); max-width: 40ch; }

/* ---------- tables ---------- */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
table.st { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 15px; }
table.st th, table.st td { padding: 9px 8px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
table.st th { font-size: 12px; letter-spacing: .06em; color: var(--ink-3); font-weight: 700; background: var(--surface); position: sticky; top: 0; }
table.st th button { border: 0; background: none; padding: 0; font: inherit; color: inherit; letter-spacing: inherit; }
table.st th.on { color: var(--accent); }
table.st th:first-child, table.st td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); z-index: 1; max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
table.st tr.tot td { font-weight: 700; background: var(--surface-2); }
table.st tr.tot td:first-child { background: var(--surface-2); }
table.st tbody tr[data-act] { cursor: pointer; }
table.st tbody tr[data-act]:hover td { background: var(--surface-2); }
table.st tr:last-child td { border-bottom: 0; }
.pnum { color: var(--ink-3); font-size: 13px; margin-right: 4px; }

/* ---------- live scoring ---------- */
.live-board { display: grid; grid-template-columns: 1fr auto; gap: 10px 16px; align-items: center; }
.lb-teams { display: grid; grid-template-columns: 14px 1fr auto; gap: 2px 8px; align-items: center; min-width: 0; }
.lb-teams .bat { color: var(--carolina); font-size: 12px; }
.lb-teams .nm { font-weight: 700; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lb-teams .sc { font-family: var(--font-display); font-size: 30px; line-height: 1.05; color: var(--carolina); text-align: right; min-width: 1.4em; }
.lb-side { display: flex; flex-direction: column; align-items: center; gap: 6px; border-left: 1px solid var(--board-2); padding-left: 16px; }
.lb-inn { font-family: var(--font-display); font-size: 28px; line-height: 1; display: flex; align-items: center; gap: 4px; }
.lb-inn svg { width: 14px; height: 14px; fill: var(--carolina); }
.lights { grid-column: 1 / -1; display: flex; gap: 18px; flex-wrap: wrap; border-top: 1px solid var(--board-2); padding-top: 10px; }
.light-set { display: flex; align-items: center; gap: 6px; }
.light-set .lbl { margin-right: 2px; }
.lamp { width: 13px; height: 13px; border-radius: 50%; background: var(--board-2); }
.lamp.on.b { background: #3DBE7C; box-shadow: 0 0 8px #3DBE7C; }
.lamp.on.s, .lamp.on.o { background: #FF6B5B; box-shadow: 0 0 8px #FF6B5B; }

.matchup { display: grid; grid-template-columns: 120px 1fr; gap: 12px; align-items: center; }
.diamond { width: 120px; height: 104px; display: block; }
.diamond .base { fill: var(--surface); stroke: var(--ink-3); stroke-width: 1.5; }
.diamond .base.on { fill: var(--carolina); stroke: var(--navy); }
.diamond text { font-family: var(--font-body); font-weight: 700; font-size: 10px; fill: var(--ink); text-anchor: middle; }
.diamond .path { fill: none; stroke: var(--line); stroke-width: 1.5; }
.diamond-btn { border: 0; background: none; padding: 0; border-radius: 8px; }
.mu { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.mu-row { min-width: 0; }
.mu-row .lbl { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; }
.mu-name { font-weight: 700; font-size: 19px; line-height: 1.15; display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.mu-name button { border: 0; background: none; padding: 0; text-align: left; font-weight: 700; color: var(--ink); text-decoration: underline dotted var(--ink-3); text-underline-offset: 3px; }
.mu-sub { font-size: 14px; color: var(--ink-2); }
.pc-bar { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; margin-top: 4px; border: 1px solid var(--line); }
.pc-bar i { display: block; height: 100%; background: var(--good); }
.pc-bar i.warn { background: var(--warn); }
.pc-bar i.over { background: var(--bad); }

.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.pad button { border: 0; min-height: 64px; border-radius: 10px; font-weight: 700; font-size: 17px; line-height: 1.1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--on-signal); }
.pad button small { font-weight: 600; font-size: 12px; opacity: .85; letter-spacing: .04em; }
.pad .k-ball { background: var(--ball); }
.pad .k-strike { background: var(--strike); }
.pad .k-foul { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.pad .k-play { grid-column: span 2; background: var(--accent); color: var(--accent-ink); border-radius: 0; clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut)); outline-offset: -4px; font-size: 19px; }
.pad button:active { transform: translateY(1px); filter: brightness(.95); }
.tools { display: flex; gap: 8px; flex-wrap: wrap; }
.tools .btn { flex: 1 1 auto; }
.plays { display: flex; flex-direction: column; }
.play { padding: 10px 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 38px 1fr; gap: 10px; align-items: start; font-size: 15px; }
.play:last-child { border-bottom: 0; }
.play .tag { font-size: 12px; font-weight: 700; color: var(--ink-3); padding-top: 2px; }
.play .scr { display: block; margin-top: 2px; font-weight: 700; font-size: 14px; color: var(--accent); }
.inning-head { margin-top: 12px; padding: 6px 0; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; color: var(--ink-3); border-bottom: 2px solid var(--line); }
.follow-note { display: flex; gap: 10px; align-items: center; font-size: 15px; color: var(--ink-2); }

/* ---------- field / spray ---------- */
.field { width: 100%; max-width: 480px; display: block; margin: 0 auto; touch-action: manipulation; }
.field .foul-g { fill: var(--grass-2); }
.field .fair { fill: var(--grass); }
.field .dirt { fill: var(--dirt); }
.field .igrass { fill: var(--grass); }
.field .chalk { stroke: var(--chalk); stroke-width: .45; fill: none; }
.field .bag { fill: var(--chalk); }
.field .track { stroke: var(--dirt); stroke-width: 2.6; fill: none; opacity: .85; }
.field .dot-hit { fill: var(--hit); stroke: #FFFFFF; stroke-width: .5; }
.field .dot-out { fill: none; stroke: #FFFFFF; stroke-width: .7; }
.field .dot-reach { fill: #F2C94C; stroke: #FFFFFF; stroke-width: .5; }
.field .heat circle { fill: var(--heat); }
.field .marker { fill: #FFFFFF; stroke: var(--navy); stroke-width: .8; }
.field .marker-ring { fill: none; stroke: #FFFFFF; stroke-width: .5; opacity: .8; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; font-size: 13px; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
.legend .lh { background: var(--hit); }
.legend .lo { border: 1.5px solid var(--ink-2); }
.legend .lr { background: #F2C94C; }
.legend .li { background: var(--navy); border: 1.5px solid var(--carolina); }
.field .dot-imp { fill: var(--navy); stroke: #FFFFFF; stroke-width: .5; }
.field .dot-count { fill: #FFFFFF; font-family: var(--font-body); font-weight: 700; text-anchor: middle; pointer-events: none; }
.sp-key { font-size: 13px; color: var(--ink-2); text-align: center; line-height: 1.5; }
.sp-key b { font-weight: 700; }
.sp-key .k-pu { color: #1B9A5A; }
.sp-key .k-gb { color: var(--bad); }
.sp-key .k-ld { color: #C08A0A; }

/* tournament fees */
.fee { padding: 14px; display: grid; gap: 10px; }
.fee-top { display: flex; align-items: flex-start; gap: 8px; }
.fee-top b { font-size: 19px; color: var(--ink); display: block; }
.fee-top .small { color: var(--ink-2); display: block; }
.due { font-size: 13px; font-weight: 700; padding: 4px 9px; border-radius: 99px; background: rgba(242, 201, 76, .2); color: var(--says-ink); white-space: nowrap; }
.amt { display: flex; align-items: baseline; gap: 8px; }
.amt b { font-family: var(--font-display); font-size: 38px; line-height: 1; color: var(--ink); font-weight: 400; }
.amt span { color: var(--ink-2); font-size: 16px; }

/* baseball instincts */
.iq-hero { background: var(--navy); color: #FFFFFF; border-radius: var(--radius); padding: 18px 16px; display: flex; gap: 14px; align-items: center; clip-path: polygon(0 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%); }
.iq-hero img { width: 64px; height: auto; flex: none; }

.iq-hero p b { color: #FFFFFF; }
.iq-kicker { font-size: 12px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--carolina); }
.iq-check { padding: 6px 14px; display: grid; }

.iq-num { flex: none; width: 30px; height: 30px; display: grid; place-items: center; background: var(--navy); color: var(--carolina); font-family: var(--font-display); font-size: 17px; clip-path: polygon(0 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%); }
.iq-tiles { display: grid; gap: 10px; }
.iq-tile { display: grid; grid-template-columns: 48px 1fr auto; gap: 12px; align-items: center; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; box-shadow: var(--shadow); color: var(--ink); font: inherit; cursor: pointer; }
.iq-tile:hover { border-color: var(--accent); }
.iq-tile-ico { width: 48px; height: 48px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }

.iq-tile-txt b { display: block; font-size: 18px; }
.iq-tile-txt span { display: block; font-size: 14px; color: var(--ink-2); line-height: 1.3; margin-top: 2px; }
.iq-count { font-size: 13px; font-weight: 700; color: var(--ink-3); white-space: nowrap; }
.iq-stars { display: inline-flex; gap: 1px; font-size: 20px; line-height: 1; }

.iq-words { padding: 4px 14px; display: grid; }

.iq-words > div:first-child { border-top: 0; }
.iq-words b { font-size: 16px; color: var(--ink); }

.iq-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.iq-prog-txt { font-size: 13px; font-weight: 700; color: var(--ink-2); letter-spacing: .04em; }
.iq-prog { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-bottom: 12px; }
.iq-prog i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.iq-card { padding: 14px; display: grid; gap: 12px; }
.iq-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.iq-chip { font-size: 13px; font-weight: 700; padding: 4px 9px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
.iq-chip.outs { background: var(--navy); color: #FFFFFF; border-color: transparent; }
.iq-chip.you { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.iq-card .field { border-radius: 10px; }
.iq-q { margin: 0; font-size: 20px; line-height: 1.25; color: var(--ink); }
.iq-choices { display: grid; gap: 8px; }
.iq-choice { min-height: 52px; padding: 10px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-size: 17px; font-weight: 700; text-align: left; cursor: pointer; }
.iq-choice:hover:not(:disabled) { border-color: var(--accent); }

.iq-fb { border-radius: 12px; padding: 12px 14px; display: grid; gap: 4px; border-left: 5px solid; }

.iq-streak { text-align: center; font-family: var(--font-display); font-size: 18px; color: var(--accent); margin-top: 10px; }
.iq-done { padding: 22px 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }

.field .iq-fielder { fill: rgba(255, 255, 255, .55); stroke: var(--navy); stroke-width: .35; }

.field .iq-you-lbl { font-family: var(--font-body); font-weight: 700; font-size: 3.4px; letter-spacing: .06em; fill: #FFFFFF; text-anchor: middle; paint-order: stroke; stroke: var(--navy); stroke-width: .9px; stroke-linejoin: round; }
.field .iq-arrow { fill: none; stroke: #FFE066; stroke-width: 1.05; stroke-linecap: round; stroke-linejoin: round; animation: iqfade .45s ease-out; }

@keyframes iqfade { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .field .iq-arrow, .field .iq-arrow-bg { animation: none; } }
/* imported spray charts */
.sp-opp { font-family: var(--font-display); font-size: 19px; line-height: 1.15; color: var(--ink); }
.sp-top { display: flex; align-items: center; gap: 14px; background: var(--surface-2); border-radius: var(--radius); padding: 12px 14px; }
.sp-count { text-align: center; flex: none; }
.sp-count b { display: block; font-family: var(--font-display); font-size: 24px; line-height: 1; color: var(--accent); }
.sp-count span { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.sp-list { display: grid; gap: 0; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.sp-row { display: grid; grid-template-columns: 128px 1fr; gap: 12px; align-items: center; padding: 10px 12px; border-top: 1px solid var(--line); }

.stackbar .s1 { background: var(--c1); color: var(--c1-ink); }
.stackbar .s2 { background: var(--c2); color: var(--c2-ink); }
.stackbar .s3 { background: var(--c3); color: var(--c3-ink); }
.stackbar .s4 { background: var(--c4); color: var(--c4-ink); }
.tip { border-left: 3px solid var(--accent); padding: 4px 0 4px 12px; display: flex; flex-direction: column; gap: 6px; font-size: 15px; }

.picker { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }

.hitter { display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; width: 100%; }

/* ---------- roster ---------- */
.brand-card { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; padding: 16px; }
.brand-card .logo-tile { background: var(--navy); padding: 12px 14px; clip-path: polygon(var(--cut) 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, var(--cut) 100%, 0 calc(100% - var(--cut)), 0 var(--cut)); }
.brand-card img { height: 56px; width: auto; display: block; }
.brand-card h3 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 24px; line-height: 1.1; }
.roster { display: flex; flex-direction: column; }
.player { display: grid; grid-template-columns: 48px 1fr auto; gap: 12px; align-items: center; padding: 10px 14px; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; width: 100%; }

.player .nm { font-weight: 700; font-size: 17px; }

/* ---------- bottom tabs ---------- */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs-in { max-width: 760px; margin: 0 auto; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; }
.tabs button { border: 0; background: none; padding: 8px 2px 9px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 12px; font-weight: 600; color: var(--ink-3); position: relative; min-height: 56px; }
.tabs button svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabs button[aria-current="page"] { color: var(--accent); }
.tabs button[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 28%; right: 28%; height: 3px; background: var(--accent); border-radius: 0 0 3px 3px; }
.tabs .dot { position: absolute; top: 8px; right: calc(50% - 18px); width: 9px; height: 9px; border-radius: 50%; background: var(--strike); border: 2px solid var(--surface); }

/* ---------- sheets ---------- */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 600px; max-height: 92vh; max-height: 92dvh; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; animation: rise .18s ease-out; }
@keyframes rise { from { transform: translateY(24px); opacity: .6; } }
@media (min-width: 700px) { .scrim { align-items: center; } .sheet { border-radius: 16px; max-height: 88vh; } }
.sheet > * { flex-shrink: 0; }
.sheet .seg { align-self: flex-start; }
.sheet-head { display: flex; align-items: center; gap: 10px; }
.sheet-head h3 { margin: 0; font-size: 20px; flex: 1; min-width: 0; }
.x { border: 0; background: var(--surface-2); width: 36px; height: 36px; border-radius: 50%; font-size: 20px; line-height: 1; color: var(--ink-2); flex: 0 0 auto; }
.field-lbl { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; color: var(--ink-3); margin-bottom: 4px; display: block; }
.input { width: 100%; border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 10px 12px; min-height: 44px; font-size: 16px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: 70px 1fr 74px; gap: 8px; align-items: center; }
.res-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.res-grid button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; min-height: 48px; padding: 6px 4px; font-weight: 700; font-size: 14px; line-height: 1.1; }

.res-grid button:hover { border-color: var(--accent); }
.res-lbl { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; color: var(--ink-3); margin: 4px 0 -6px; }
.runner-row { display: grid; grid-template-columns: 1fr; gap: 6px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.runner-row:last-child { border-bottom: 0; }
.runner-row .who { font-weight: 700; }
.runner-row .who small { color: var(--ink-3); font-weight: 600; margin-left: 6px; }
.dest { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }

.dest button[aria-pressed="true"] { background: var(--navy); color: #FFFFFF; border-color: var(--navy); }
.dest button.out[aria-pressed="true"] { background: var(--bad); border-color: var(--bad); }
.dest button:disabled { opacity: .3; }
.warn-text { color: var(--bad); font-size: 14px; font-weight: 600; }
.order { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.order-row { display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; align-items: center; padding: 6px 8px; border-bottom: 1px solid var(--line); background: var(--surface); }

.order-row .acts { display: flex; gap: 4px; }
.icon-btn { border: 1px solid var(--line); background: var(--surface-2); width: 34px; height: 34px; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; font-size: 16px; color: var(--ink-2); }
.bench { display: flex; flex-wrap: wrap; gap: 6px; }

.opp-row { display: grid; grid-template-columns: 24px 64px 1fr 64px 34px; gap: 6px; align-items: center; }

.opp-row .input { padding: 8px; min-height: 40px; }

.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }
.scan-btn { position: relative; align-self: flex-start; }
.scan { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--accent-soft); font-size: 15px; }
.spin { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; flex: 0 0 auto; }
@keyframes spin { to { transform: rotate(360deg); } }
.ros-row { display: grid; grid-template-columns: 64px 1fr 64px 34px; gap: 6px; align-items: center; }
.ros-row .input { padding: 8px; min-height: 40px; }
body.gated .tabs { display: none; }
.gate { padding: 32px 18px; margin-top: 8vh; }
.gate .logo-tile { background: var(--navy); padding: 12px 14px; clip-path: polygon(var(--cut) 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, var(--cut) 100%, 0 calc(100% - var(--cut)), 0 var(--cut)); }
.gate .logo-tile img { height: 56px; width: auto; display: block; }
.gate p { max-width: 42ch; }
.video-dock { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 0; display: flex; flex-direction: column; gap: 8px; }

  const RESULTS = {
    '1B': { n: 'Single', v: 'singled', hit: 1, tb: 1, ab: 1, bip: 1 },

    'FO': { n: 'Fly out', v: 'flied out', out: 1, ab: 1, bip: 1, bt: 'F' },
    'LO': { n: 'Line out', v: 'lined out', out: 1, ab: 1, bip: 1, bt: 'L' },

  // ---------- Tournament fees ----------
  // fees/{id}: a tournament fee (amount in cents, who owes it). fees/{id}/pay/{playerId}: that

  // Keeps the fee data in sync with who's signed in and what they're allowed to see.

    const runners = card.on && card.on.length ? (card.on.length === 3 ? 'Bases loaded' : 'Runner' + (card.on.length > 1 ? 's' : '') + ' on ' + card.on.map((b) => ORDN(b)).join(' & ')) : 'Bases empty';
    return `<div class="iq-chips"><span class="iq-chip outs">${card.outs} out${card.outs === 1 ? '' : 's'}</span><span class="iq-chip">${esc(runners)}</span><span class="iq-chip you">You: ${esc(IQ_POS_NAME[card.you] || card.you)}</span></div>`;
  }
  function iqDeal() {
    const R = UI.iq;
    const card = IQ_CARDS.find((c) => c.id === R.order[R.i]);
    const idx = card.a.map((_, i) => i);
    R.choices = card.a[0] === '1st base' && card.a[3] === 'Home' ? idx : iqShuffle(idx);
  }
  function renderIQ() {
    const R = UI.iq;
    if (R && R.mode) return R.i >= R.order.length ? iqResultsHTML(R) : iqQuestionHTML(R);
    const best = iqBest();
    const tile = (mode, name, sub, icon, count) => {
      const b = best[mode];
      return `<button class="iq-tile" data-act="iqStart" data-mode="${mode}"><span class="iq-tile-ico"><svg viewBox="0 0 24 24">${icon}</svg></span><span class="iq-tile-txt"><b>${esc(name)}</b><span>${esc(sub)}</span></span><span class="iq-tile-side">${b != null ? iqStarHTML(iqStars(b), 3) : `<span class="iq-count">${count}</span>`}</span></button>`;
    };
    const counts = {};
    for (const c of IQ_CARDS) counts[c.g] = (counts[c.g] || 0) + 1;
    let h = `<section class="iq-hero"><img src="${LOGO}" alt=""><div><div class="iq-kicker">${esc(Data.team.name || 'GS Baseball')}</div><h2>Baseball Instincts</h2><p>Great players know what to do <b>before</b> the ball is hit.</p></div></section>`;
    h += `<h2 class="sec">Before every pitch</h2><section class="card iq-check">${['How many outs?', 'Where are the runners?', 'If it comes to me, where do I throw?', 'Get low and get ready!'].map((t, i) => `<div><span class="iq-num">${i + 1}</span><span>${esc(t)}</span></div>`).join('')}</section>`;
    h += `<h2 class="sec">Practice</h2><div class="iq-tiles">${Object.entries(IQ_GROUPS).map(([k, g]) => tile(k, g.name, g.sub, g.icon, counts[k] + ' plays')).join('')}${tile('all', 'All-Star challenge', '10 plays from everything. Can you get 3 stars?', '<path d="m12 3 2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/>', '10 plays')}</div>`;
    h += `<h2 class="sec">Know these words</h2><section class="card iq-words">${IQ_WORDS.map(([w, d]) => `<div><b>${esc(w)}</b><span>${esc(d)}</span></div>`).join('')}</section>`;
    return h;
  }
  function iqQuestionHTML(R) {
    const card = IQ_CARDS.find((c) => c.id === R.order[R.i]);
    const done = R.picked != null;
    const right = done && R.picked === card.c;
    const g = R.mode === 'all' ? { name: 'All-Star challenge' } : IQ_GROUPS[R.mode];
    let h = `<div class="iq-top"><button class="btn ghost sm" data-act="iqQuit">‹ Instincts</button><span class="grow"></span><span class="iq-prog-txt">${esc(g.name)} · ${R.i + 1} of ${R.order.length}</span></div>
      <div class="iq-prog"><i style="width:${((R.i + (done ? 1 : 0)) * 100 / R.order.length).toFixed(1)}%"></i></div>
      <section class="card iq-card">${iqChips(card)}${iqField(card, done)}<h3 class="iq-q">${esc(card.q)}</h3>
      <div class="iq-choices">${R.choices.map((ci) => {
        const cls = !done ? '' : ci === card.c ? ' right' : ci === R.picked ? ' wrong' : ' dim';
        return `<button class="iq-choice${cls}" data-act="iqPick" data-i="${ci}" ${done ? 'disabled' : ''}>${esc(card.a[ci])}</button>`;
      }).join('')}</div>`;
    if (done) {
      h += `<div class="iq-fb ${right ? 'right' : 'wrong'}" id="iq-fb"><b>${right ? ['Nice!', 'You got it!', 'That’s it!', 'Heads-up play!'][R.i % 4] : 'Not quite.'}</b>${right ? '' : `<span class="iq-ans">The play: ${esc(card.a[card.c])}.</span>`}<p>${esc(card.why)}</p></div>
        <button class="btn primary block" data-act="iqNext">${R.i + 1 >= R.order.length ? 'See my score' : 'Next play'}</button>`;
    }
    return h + '</section>' + (R.streak >= 3 && done && right ? `<div class="iq-streak">${R.streak} in a row!</div>` : '');
  }
  function iqResultsHTML(R) {
    const p = pct(R.score, R.order.length), stars = iqStars(p);
    const msg = p === 100 ? 'Perfect! You’ve got All-Star instincts.' : p >= 80 ? 'Great job! You’re thinking like a ballplayer.' : p >= 50 ? 'Good work! Play again to get even sharper.' : 'Keep practicing! Every great player started right here.';
    const missed = R.missed.map((id) => IQ_CARDS.find((c) => c.id === id)).filter(Boolean);
    return `<section class="card iq-done"><img src="${LOGO}" alt="">${iqStarHTML(stars, 3)}<div class="iq-score">${R.score} <small>of ${R.order.length}</small></div><p>${esc(msg)}</p>
      <div class="row" style="justify-content:center"><button class="btn primary" data-act="iqStart" data-mode="${esc(R.mode)}">Play again</button><button class="btn" data-act="iqQuit">Back to Instincts</button></div></section>
      ${missed.length ? `<h2 class="sec">Remember these</h2><section class="card iq-words">${missed.map((c) => `<div><span class="iq-mq">${esc(c.q)}</span><b class="iq-ma">${esc(c.a[c.c])}</b><span>${esc(c.why)}</span></div>`).join('')}</section>` : ''}`;
  }

  // ---------- renders ----------
  function render() {
    $('#team-name').textContent = Data.team.name || 'GS Baseball';
    syncPill();
    for (const b of document.querySelectorAll('#tabs button')) {
      if (b.dataset.tab === UI.tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    }
    $('#live-dot').hidden = !Object.values(Data.games).some((g) => g.status === 'live');
    if (UI.tab === 'chat' && Backend.kind !== 'fb' && UI.ready) UI.tab = 'games';
    $('#chat-tab').hidden = !chatAllowed();
    $('#chat-dot').hidden = !(UI.tab !== 'chat' && chatUnread());
    const chatOn = UI.tab === 'chat' && chatAllowed();
    $('#chat-bar').hidden = !chatOn;
    $('#chat-pic').hidden = !(chatOn && workerUrl());
    document.body.classList.toggle('chat-on', chatOn);
    const nearBottom = chatOn && (Chat.forceBottom || window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 140);
    const v = $('#view');
    const gated = Backend.kind === 'fb' && Access.evaluated && !Access.canView;
    document.body.classList.toggle('gated', gated);
    if (gated) { $('#chat-bar').hidden = true; v.innerHTML = renderGate(); renderDock(); return; }
    if (!UI.ready) { v.innerHTML = `<div class="loading"><img src="${LOGO}" alt=""><div>Loading your team…</div></div>`; return; }
    let h = '';
    try {
      if (UI.tab === 'games') h = renderGames();
      else if (UI.tab === 'live') h = renderLive();
      else if (UI.tab === 'stats') h = renderStats();
      else if (UI.tab === 'scout') h = renderScout();
      else if (UI.tab === 'chat') h = renderChat();
      else if (UI.tab === 'iq') h = renderIQ();
      else h = renderTeam();
    } catch (err) {
      console.error(err);
      h = `<div class="card empty"><h3>Something went wrong showing this screen</h3><p>${esc(err && err.message)}</p></div>`;
    }
    v.innerHTML = h;
    if (chatOn) {
      if (nearBottom && Chat.loaded) { Chat.forceBottom = false; window.scrollTo(0, document.documentElement.scrollHeight); }
      chatMarkSeen();
    }
    try { renderDock(); } catch (err) { console.error(err); }
    if (Cam.open) camBug();
  }

  function sampleBanner() {
    if (!hasSample() || !canEdit()) return '';
    return `<div class="banner"><span class="grow">You're looking at <b>sample games and players</b> so you can see how everything works. Clear them when you're ready to add your own team.</span><button class="btn sm" data-act="clearSample">Clear sample data</button></div>`;
  }

  function gameRow(g, startBtn) {
    const d = parseDate(g.date);
    const opp = (g.home ? 'vs ' : '@ ') + g.opponent;
    let res = '';
    if (g.status === 'final') { const r = result(g); res = `<span class="chip ${r.chip}">${r.letter}</span><span class="num">${r.us}–${r.them}</span>`; }
    else if (g.status === 'live') { const s = st(g); const r = result(g); res = `<span class="chip live">LIVE</span><span class="num">${r.us}–${r.them}</span><span class="small muted">${s.half ? '▼' : '▲'}${s.inning}</span>`; }
    else res = `<span class="small muted">${esc(fmtTime(g.time) || 'TBD')}</span>`;
    const meta = [fmtTime(g.time), g.location].filter(Boolean).join(' · ') || (g.home ? 'Home' : 'Away');
    if (startBtn) res = `<button class="btn sm primary" data-act="lineup" data-id="${esc(g.id)}" data-start="1">Start</button>`;
    return `<${startBtn ? 'div' : 'button'} class="game-row" ${startBtn ? 'style="cursor:default"' : `data-act="openGame" data-id="${esc(g.id)}"`}>
      <span class="gr-date"><span>${d.toLocaleDateString(undefined, { weekday: 'short' }).toUpperCase()}</span><span class="d">${d.getDate()}</span><span>${d.toLocaleDateString(undefined, { month: 'short' }).toUpperCase()}</span></span>
      <span style="min-width:0"><span class="gr-opp" style="display:block">${esc(opp)} ${g.sample ? '<span class="chip sample">Sample</span>' : ''}</span><span class="gr-meta" style="display:block">${esc(meta)}</span></span>
      <span class="gr-res">${res}</span></${startBtn ? 'div' : 'button'}>`;
  }

  function renderGames() {
    if (UI.gameId && Data.games[UI.gameId]) return renderGameDetail(Data.games[UI.gameId]);
    UI.gameId = null;
    const games = gamesList();
    const live = games.filter((g) => g.status === 'live');
    const upcoming = games.filter((g) => g.status === 'scheduled');
    const finals = games.filter((g) => g.status === 'final').reverse();
    let w = 0, l = 0, t = 0, rf = 0, ra = 0;
    for (const g of finals) { const r = result(g); rf += r.us; ra += r.them; if (r.us > r.them) w++; else if (r.us < r.them) l++; else t++; }
    let h = sampleBanner() + feeBanner();
    const next = upcoming[0];
    h += `<section class="board season"><span class="lbl">Season record</span>
      <span class="rec num">${w}<small>–</small>${l}${t ? '<small>–</small>' + t : ''}</span>
      <span class="facts"><span>Runs <b class="num">${rf}</b> for · <b class="num">${ra}</b> against</span>${next ? `<span>Next: <b>${esc(longDate(next.date))}</b> ${next.home ? 'vs' : '@'} <b>${esc(next.opponent)}</b></span>` : `<span>${finals.length} game${finals.length === 1 ? '' : 's'} played</span>`}</span></section>`;
    if (canEdit()) h += `<button class="btn primary block" data-act="newGame">+ New game</button>`;
    if (!games.length) {
      h += `<div class="card empty"><img src="${LOGO}" alt=""><h3>No games yet</h3><p>Add your first game, set the lineup, and score it pitch by pitch. Stats, spray charts and scouting fill in as you go.</p></div>`;
      return h;
    }
    if (live.length) h += `<h2 class="sec">Live now</h2><div class="list">${live.map(gameRow).join('')}</div>`;
    if (upcoming.length) h += `<h2 class="sec">Upcoming</h2><div class="list">${upcoming.map(gameRow).join('')}</div>`;
    if (finals.length) h += `<h2 class="sec">Results</h2><div class="list">${finals.map(gameRow).join('')}</div>`;
    return h;
  }

  function lineScore(g, s) {
    const names = sideNames(g);
    let cols = Math.max(g.innings, s.runs.away.length, s.runs.home.length);
    const fresh = s.halfEvents === 0 && s.outs === 0;
    if (g.status === 'final' && fresh && s.half === 0 && s.inning > g.innings) cols = Math.max(g.innings, s.inning - 1);
    const homeX = g.status === 'final' && fresh && s.half === 1;
    let head = '<th></th>';
    for (let i = 1; i <= cols; i++) head += `<th>${i}</th>`;
    head += '<th class="tot">R</th><th>H</th><th>E</th>';
    const row = (side) => {
      let r = `<td class="tm">${esc(names[side])}</td>`;
      for (let i = 0; i < cols; i++) {
        let v = s.runs[side][i];
        if (side === 'home' && homeX && i === s.inning - 1) { r += '<td class="x">X</td>'; continue; }
        r += `<td>${v == null || g.status === 'scheduled' ? '' : v}</td>`;
      }
      r += `<td class="tot r">${g.status === 'scheduled' ? '' : s.score[side]}</td><td>${g.status === 'scheduled' ? '' : s.hits[side]}</td><td>${g.status === 'scheduled' ? '' : s.errs[side]}</td>`;
      return `<tr>${r}</tr>`;
    };
    return `<div class="linescore-wrap"><table class="linescore num"><thead><tr>${head}</tr></thead><tbody>${row('away')}${row('home')}</tbody></table></div>`;
  }

  function batRows(g, s, side) {
    const t = E.emptyBat();
    const rows = s.batOrder[side].filter((ref) => s.bat[ref] && s.bat[ref].PA > 0).map((ref) => {
      const b = s.bat[ref];
      E.addInto(t, b);
      const nm = playerById(ref) ? `<span class="pnum">${esc(refNum(ref))}</span>${esc(refName(g, ref))}` : esc(refName(g, ref));
      return `<tr><td>${nm}</td><td>${b.AB}</td><td>${b.R}</td><td>${b.H}</td><td>${b.RBI}</td><td>${b.BB}</td><td>${b.K}</td></tr>`;
    });
    if (!rows.length) return '<p class="muted small">No plate appearances yet.</p>';
    return `<div class="tbl-wrap"><table class="st"><thead><tr><th>Batter</th><th>AB</th><th>R</th><th>H</th><th>RBI</th><th>BB</th><th>K</th></tr></thead><tbody>${rows.join('')}<tr class="tot"><td>Totals</td><td>${t.AB}</td><td>${t.R}</td><td>${t.H}</td><td>${t.RBI}</td><td>${t.BB}</td><td>${t.K}</td></tr></tbody></table></div>`;
  }
  function pitRows(g, s) {
    const names = sideNames(g);
    const rows = [];
    for (const side of [s.us, s.them]) {
      for (const ref of s.pitOrder[side]) {
        const p = s.pit[ref];
        if (!p || (!p.PC && !p.BF)) continue;
        rows.push(`<tr><td>${esc(refName(g, ref))} <span class="pnum">${esc(side === s.us ? '' : names[side])}</span></td><td>${E.fmtIP(p.OUTS)}</td><td>${p.H}</td><td>${p.R}</td><td>${p.ER}</td><td>${p.BB}</td><td>${p.K}</td><td>${p.PC}</td></tr>`);
      }
    }
    if (!rows.length) return '<p class="muted small">No pitches recorded yet.</p>';
    return `<div class="tbl-wrap"><table class="st"><thead><tr><th>Pitcher</th><th>IP</th><th>H</th><th>R</th><th>ER</th><th>BB</th><th>K</th><th>PC</th></tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
  }

  function playItems(g, s) {
    const names = sideNames(g);
    const groups = [];
    let cur = { inn: 1, half: 0, items: [] };
    groups.push(cur);
    const sc = { away: 0, home: 0 };
    const nm = (r) => refName(g, r);
    for (const L of s.log) {
      if (L.k === 'half') { cur = { inn: L.inn, half: L.half, items: [] }; groups.push(cur); continue; }
      let tag = '', text = '', runs = 0, side = null;
      if (L.k === 'pa') { tag = L.pa.r; text = E.describe(L.pa, nm); runs = L.pa.runs; side = L.pa.side; }
      else if (L.k === 'run') { tag = L.why === 'ADV' ? 'RUN' : L.why; text = L.moves.length ? E.describeRun(L, nm) : 'Runners held.'; runs = L.runs; side = L.side; }
      else if (L.k === 'pc') { tag = 'PC'; text = `Pitching change: ${refName(g, L.ref)} now pitching for ${names[L.side]}.`; }
      else if (L.k === 'sub') { tag = 'SUB'; text = `${refName(g, L.ref)} bats in the ${ORDN(L.slot + 1)} spot for ${refName(g, L.prev)}.`; }
      if (runs && side) sc[side] += runs;
      cur.items.push({ tag, text, score: runs ? `${names.away.slice(0, 12)} ${sc.away}, ${names.home.slice(0, 12)} ${sc.home}` : '' , inn: cur.inn, half: cur.half });
    }
    return groups;
  }

  function renderPlays(g, s) {
    const names = sideNames(g);
    const groups = playItems(g, s).filter((x) => x.items.length);
    if (!groups.length) return '<p class="muted small">No plays yet.</p>';
    return groups.map((gr) => `<div class="inning-head">${gr.half ? 'Bottom' : 'Top'} ${ORDN(gr.inn)} · ${esc(names[gr.half ? 'home' : 'away'])} batting</div><div class="plays">` +
      gr.items.map((it) => `<div class="play"><span class="tag">${esc(it.tag)}</span><span>${esc(it.text)}${it.score ? `<span class="scr">${esc(it.score)}</span>` : ''}</span></div>`).join('') + '</div>').join('');
  }

  function renderGameDetail(g) {
    const s = st(g);
    let status = g.status === 'final' ? 'Final' : g.status === 'live' ? 'Live · ' + innLabel(s) : 'Scheduled' + (g.time ? ' · ' + fmtTime(g.time) : '');
    let h = `<div class="row"><button class="btn ghost" data-act="back">‹ All games</button><span class="grow"></span>${g.sample ? '<span class="chip sample">Sample</span>' : ''}</div>`;
    h += `<section class="board stack"><span class="lbl">${esc(status)} · ${esc(longDate(g.date))}${g.location ? ' · ' + esc(g.location) : ''}</span>${lineScore(g, s)}</section>`;
    if (canEdit()) {
      const a = [];
      if (g.status === 'scheduled') a.push(`<button class="btn primary" data-act="lineup" data-id="${g.id}" data-start="1">Set lineup &amp; start</button>`);
      if (g.status === 'live') a.push(`<button class="btn primary" data-act="resume" data-id="${g.id}">Resume scoring</button>`, `<button class="btn" data-act="lineup" data-id="${g.id}">Lineups</button>`, `<button class="btn" data-act="finish" data-id="${g.id}">Finish game</button>`);
      if (g.status === 'final') a.push(`<button class="btn" data-act="reopen" data-id="${g.id}">Reopen scoring</button>`, `<button class="btn" data-act="lineup" data-id="${g.id}">Lineups</button>`);
      a.push(`<button class="btn" data-act="editGame" data-id="${g.id}">Edit details</button>`, `<button class="btn danger" data-act="deleteGame" data-id="${g.id}">Delete</button>`);
      h += `<div class="row">${a.join('')}</div>`;
    }
    if (g.status === 'scheduled' && !g.events.length) {
      h += `<div class="card empty"><h3>${esc(g.home ? 'vs ' : '@ ')}${esc(g.opponent)}</h3><p>${esc(longDate(g.date))}${g.time ? ' at ' + esc(fmtTime(g.time)) : ''}. Set both lineups, then score the game from the Live tab.</p></div>`;
      return h;
    }
    const tabs = [['box', 'Box score'], ['plays', 'Plays'], ['spray', 'Spray chart']];
    h += `<div><div class="seg" role="group">${tabs.map(([k, l]) => `<button data-act="gameTab" data-k="${k}" aria-pressed="${UI.gameTab === k}">${l}</button>`).join('')}</div></div>`;
    const names = sideNames(g);
    if (UI.gameTab === 'plays') h += `<div class="card" style="padding:4px 14px 12px">${renderPlays(g, s)}</div>`;
    else if (UI.gameTab === 'spray') {
      const side = UI.sprayWho === 'us' ? s.us : s.them;
      const pts = s.pas.filter((p) => p.side === side && p.loc).map((p) => ({ loc: p.loc, r: p.r, label: refName(g, p.ref) }));
      h += `<div class="card stack" style="padding:14px"><div class="seg">${[['us', Data.team.name], ['them', g.opponent]].map(([k, l]) => `<button data-act="sprayWho" data-k="${k}" aria-pressed="${UI.sprayWho === k}">${esc(l)}</button>`).join('')}</div>
        ${fieldSVG({ points: pts, label: 'Spray chart for ' + (UI.sprayWho === 'us' ? Data.team.name : g.opponent) })}${legend()}
        <p class="small muted" style="margin:0">${pts.length} charted ball${pts.length === 1 ? '' : 's'} in play. Each dot marks where a ball was fielded or landed.</p></div>`;
    } else {
      h += `<h2 class="sec">${esc(names.away)} batting</h2>${batRows(g, s, 'away')}<h2 class="sec">${esc(names.home)} batting</h2>${batRows(g, s, 'home')}<h2 class="sec">Pitching</h2>${pitRows(g, s)}`;
    }
    return h;
  }

  // ----- live -----
  function lamps(n, total, cls) { let h = ''; for (let i = 0; i < total; i++) h += `<span class="lamp ${cls}${i < n ? ' on' : ''}"></span>`; return h; }
  function todayLine(b) {
    if (!b || !b.PA) return 'First trip to the plate today';
    const extra = [];
    if (b.HR) extra.push(b.HR > 1 ? b.HR + ' HR' : 'HR');
    if (b['2B']) extra.push(b['2B'] > 1 ? b['2B'] + ' 2B' : '2B');
    if (b.BB) extra.push(b.BB > 1 ? b.BB + ' BB' : 'BB');
    if (b.RBI) extra.push(b.RBI + ' RBI');
    if (b.K) extra.push(b.K > 1 ? b.K + ' K' : 'K');
    return `${b.H}-for-${b.AB} today${extra.length ? ', ' + extra.join(', ') : ''}`;
  }
  // ----- live video -----
  function videoEmbed(raw) {
    const t = String(raw || '').trim();
    if (!t) return null;
    const yt = (id) => ({ kind: 'yt', src: 'https://www.youtube.com/embed/' + id + '?autoplay=1&mute=1&playsinline=1&rel=0', watch: 'https://www.youtube.com/watch?v=' + id });
    const ch = (id) => ({ kind: 'yt', channel: true, src: 'https://www.youtube.com/embed/live_stream?channel=' + id + '&autoplay=1&mute=1&playsinline=1', watch: 'https://www.youtube.com/channel/' + id + '/live' });
    let m = t.match(/^(UC[\w-]{22})$/);
    if (m) return ch(m[1]);
    let u;
    try { u = new URL(/^https?:\/\//i.test(t) ? t : 'https://' + t); } catch (e) { return null; }
    const host = u.hostname.replace(/^(www\.|m\.)/, '');
    if (host === 'youtu.be') { const id = u.pathname.slice(1, 12); return /^[\w-]{11}$/.test(id) ? yt(id) : null; }
    if (host === 'youtube.com' || host === 'youtube-nocookie.com') {
      const v = u.searchParams.get('v');
      if (v && /^[\w-]{11}$/.test(v)) return yt(v);
      if ((m = u.pathname.match(/^\/(?:live|embed|shorts)\/([\w-]{11})(?:[/?]|$)/))) return yt(m[1]);

      const s = st(g);
      const oname = (g.opponent || 'Opponent').trim();
      const okey = oname.toLowerCase();
      if (!opps.has(okey)) opps.set(okey, { key: okey, name: oname, hitters: new Map(), games: 0, last: g.date });
      const O = opps.get(okey);
      const R = rosterFor(oname);
      O.games++;
      O.last = g.date;

        if (pa.side !== s.them) continue;
        const o = oppEntry(g, pa.ref) || { id: pa.ref };
        const hk = o.num ? '#' + String(o.num).trim() : o.name ? o.name.trim().toLowerCase() : 'slot' + (pa.slot + 1);

  // One imported hitter's dots as balls in play (imp) that sit beside the ones from scored games.
  function importedPas(sp1, legacy, date) {

  // Our own hitters: balls in play charted in games we scored, plus any imported spray chart.
  function teamSpray() {

    for (const g of gamesList()) {

  // The nine spots an imported chart can put a ball, in this app's field coordinates (home at 50,76).
  const SPRAY_ZONES = {

    SS: { at: [43.66, 53.89], dir: 'L', name: 'shortstop' },

    LF: { at: [30, 41.36], dir: 'L', name: 'left field' },
    CF: { at: [50, 32], dir: 'C', name: 'center field' },

  const SPRAY_RES = { h: { cls: 'dot-hit', n: 'Hit' }, o: { cls: 'dot-out', n: 'Out' }, e: { cls: 'dot-reach', n: 'Reached on error' } };

  // Spots with more than 10 imported balls become one bubble with the count (bubble = false keeps
  // every ball, which the heat map needs).
  function sprayPoints(pas, spread, bubble) {
    const out = [], groups = {};
    for (const p of pas) {
      if (p.imp) (groups[p.zone] = groups[p.zone] || []).push(p);
      else if (p.loc) out.push({ loc: p.loc, r: p.r });
    }
    for (const z in groups) {
      const g = groups[z].slice().sort((a, b) => 'GLFP'.indexOf(a.bt) - 'GLFP'.indexOf(b.bt) || 'eoh'.indexOf(a.res) - 'eoh'.indexOf(b.res));
      const c = SPRAY_ZONES[z].at, step = (spread || 1) * Math.min(2, 7.5 / Math.sqrt(g.length));
      if (bubble !== false && g.length > 10) {
        const kinds = {};
        for (const p of g) { const k = BT_NAME[p.bt] || (SPRAY_RES[p.res] && SPRAY_RES[p.res].n) || 'Ball in play'; kinds[k] = (kinds[k] || 0) + 1; }
        out.push({ loc: c, imp: 1, count: g.length, title: g.length + ' balls to ' + SPRAY_ZONES[z].name + ' (imported chart): ' + Object.entries(kinds).map(([k, n]) => n + ' ' + k.toLowerCase()).join(', ') });

        <label><span class="field-lbl">Cash App $cashtag</span>${inp('cashapp', sh.cashapp, 'placeholder="$yourcashtag" autocomplete="off" autocapitalize="off" spellcheck="false"')}</label>
        ${sh.err ? `<div class="warn-text">${esc(sh.err)}</div>` : ''}

    feeWho() {

        <div class="card" style="padding:4px 14px;box-shadow:none"><div class="who"><span class="nm"><b>You</b><span>Owner · always</span></span><span class="tg on lock" aria-hidden="true"><i></i></span></div>
        ${list.map((m) => `<button class="who" data-act="feeWhoToggle" data-uid="${esc(m.uid)}" aria-pressed="${m.fees === true}"><span class="nm"><b>${esc(memberLabel(m))}</b><span>${m.role === 'admin' ? 'Coach' : m.role === 'camera' ? 'Camera operator' : 'Family'}</span></span><span class="tg${m.fees === true ? ' on' : ''}" aria-hidden="true"><i></i></span></button>`).join('')}</div>

    payClaim(sh) {

      const ways = [['venmo', 'Venmo'], ['cashapp', 'Cash App']].filter(([k]) => c[k]);
      return head(sh.back ? 'Did you finish paying?' : 'How did you pay?') + `<p style="margin:0">${esc(f.name)} · ${esc(fmtMoney(f.amount))} for ${esc(playerName(sh.pid))}</p>
        <div class="stack">${ways.map(([k, l]) => `<button class="btn ${sh.method === k || ways.length === 1 ? 'primary' : ''} full" data-act="payClaimSave" data-m="${k}">Yes, I paid with ${l}</button>`).join('')}
        <button class="btn full" data-act="close">${sh.back ? 'Not yet' : 'Cancel'}</button></div>
        <p class="small muted" style="margin:0">A coach checks for your payment and confirms it.</p>`;
    },
    payRow(sh) {
      const f = Fees.list[sh.fee];
      if (!f) return head('Fee') + '<p class="muted">This fee was removed.</p>';
      const pay = payOf(f.id, sh.pid);
      const p = playerById(sh.pid);
      const when = (x) => { const t = x && x.at && typeof x.at.toMillis === 'function' ? x.at.toMillis() : Number(x && x.at) || 0; return t ? new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : ''; };
      let h = head(esc(p ? (p.num ? '#' + p.num + ' ' : '') + p.name : 'Former player')) + `<div class="small muted" style="margin-top:-8px">${esc(f.name)} · ${esc(fmtMoney(f.amount))}</div>`;
      if (pay && pay.status === 'paid') {
        h += `<p style="margin:0"><span class="fee-chip st-paid">Paid · ${esc(PAY_NAME[pay.method] || '')}</span> ${esc(when(pay))}${pay.note ? ' · ' + esc(pay.note) : ''}</p>`;
        h += `<div class="row"><button class="btn danger" data-act="payUnmark">Mark not paid</button></div>`;
        return h + '<div class="row"><button class="btn" data-act="close">Close</button></div>';
      }
      if (pay && pay.status === 'claimed') h += `<p style="margin:0"><span class="fee-chip st-says">Says paid · ${esc(PAY_NAME[pay.method] || '')}</span> ${esc(when(pay))}</p><p class="small muted" style="margin:0">Check your ${esc(PAY_NAME[pay.method] || '')} for ${esc(fmtMoney(f.amount))}, then confirm.</p>
        <div class="row"><button class="btn primary" data-act="payConfirm" data-fee="${esc(f.id)}" data-pid="${esc(sh.pid)}">Confirm paid</button><button class="btn" data-act="payUnmark">Not received</button></div>`;
      else {
        h += `<div><span class="field-lbl">Mark paid with</span>${segB('payMarkHow', sh.how || '', [['venmo', 'Venmo'], ['cashapp', 'Cash App']])}</div>
          <label><span class="field-lbl">Note (optional)</span>${inp('note', sh.note || '', 'placeholder="Paid Oct 12" autocomplete="off"')}</label>
          <div class="row"><button class="btn primary" data-act="payMark" ${sh.how ? '' : 'disabled'}>Mark paid</button>${workerUrl() ? `<button class="btn" data-act="feeRemindOne" ${Fees.busy === 'remind' ? 'disabled' : ''}>Send a reminder</button>` : ''}</div>`;
      }
      return h;
    },
    confirm(sh) {
      return head(esc(sh.title)) + `<p style="margin:0">${esc(sh.text)}</p><div class="row"><button class="btn ${sh.danger ? 'danger' : 'primary'}" data-act="confirmYes">${esc(sh.yes || 'Confirm')}</button><button class="btn" data-act="close">Cancel</button></div>`;
    },
    game(sh) {
      const opps = [...new Set(Object.values(Data.games).map((g) => g.opponent))];
      return head(sh.id ? 'Edit game' : 'New game') + `
        <label><span class="field-lbl">Opponent</span>${inp('f.opponent', sh.f.opponent, 'list="opp-list" autocomplete="off" placeholder="Team name"')}<datalist id="opp-list">${opps.map((o) => `<option value="${esc(o)}">`).join('')}</datalist></label>
        <div class="grid2"><label><span class="field-lbl">Date</span>${inp('f.date', sh.f.date, 'type="date"')}</label><label><span class="field-lbl">Time</span>${inp('f.time', sh.f.time, 'type="time"')}</label></div>
        <div><span class="field-lbl">We are</span>${segB('gameHome', sh.f.home ? 'home' : 'away', [['home', 'Home'], ['away', 'Away']])}</div>

        <label><span class="field-lbl">Video link for this game (optional)</span>${inp('f.video', sh.f.video || '', 'type="url" inputmode="url" autocapitalize="off" spellcheck="false" placeholder="YouTube link to this game\u2019s stream"')}<span class="small muted" style="display:block;margin-top:4px">Leave empty to use the team\u2019s channel. Use this for Unlisted streams or the replay.</span></label>
        ${sh.err ? `<div class="warn-text">${esc(sh.err)}</div>` : ''}
        <div class="row"><button class="btn primary" data-act="saveGame">${sh.id ? 'Save' : 'Add game'}</button>${sh.id ? '' : '<button class="btn" data-act="saveGame" data-then="lineup">Add &amp; set lineup</button>'}</div>`;
    },
    lineup(sh) {
      const order = sh.order.map((id, i) => {
        const p = playerById(id);
        return `<div class="order-row"><span class="slot">${i + 1}</span><span style="min-width:0"><b>${esc(p ? (p.num ? '#' + p.num + ' ' : '') + p.name : 'Removed player')}</b> <span class="muted small">${esc(p ? p.pos || '' : '')}</span></span>${sh.locked ? '' : `<span class="acts"><button class="icon-btn" data-act="luMove" data-i="${i}" data-d="-1" aria-label="Move up" ${i ? '' : 'disabled'}>↑</button><button class="icon-btn" data-act="luMove" data-i="${i}" data-d="1" aria-label="Move down" ${i < sh.order.length - 1 ? '' : 'disabled'}>↓</button><button class="icon-btn" data-act="luRemove" data-i="${i}" aria-label="Remove">×</button></span>`}</div>`;
      }).join('');
      const bench = sortedRoster().filter((p) => !sh.order.includes(p.id));
      const pitchers = sortedRoster().sort((a, b) => (/P/.test(b.pos || '') ? 1 : 0) - (/P/.test(a.pos || '') ? 1 : 0));
      const opp = sh.opp.map((o, i) => `<div class="opp-row"><span class="slot">${i + 1}</span>${inp(`opp.${i}.num`, o.num, 'placeholder="#" inputmode="numeric" aria-label="Number"')}${inp(`opp.${i}.name`, o.name, 'placeholder="Name (optional)" aria-label="Name"')}${sel(`opp.${i}.bats`, o.bats, BATS, 'aria-label="Bats"')}${sh.locked ? '<span></span>' : `<button class="icon-btn" data-act="oppRemove" data-i="${i}" aria-label="Remove batter">×</button>`}</div>`).join('');
      return head(esc(sh.title)) + `
        <div><span class="field-lbl">${esc(Data.team.name)} batting order</span>
        ${sh.order.length ? `<div class="order">${order}</div>` : '<p class="muted small" style="margin:0">Tap players below to add them in batting order.</p>'}
        ${sh.locked ? '<p class="small muted">The game has started. Use Sub on the Live screen to change the order.</p>' : bench.length ? `<div class="bench" style="margin-top:8px">${bench.map((p) => `<button data-act="luAdd" data-id="${esc(p.id)}">+ ${esc((p.num ? '#' + p.num + ' ' : '') + shortName(p.name))}</button>`).join('')}</div>` : ''}
        ${!Data.team.players.length ? '<p class="warn-text">Add players on the Team tab first.</p>' : ''}</div>
        <label><span class="field-lbl">Starting pitcher</span>${sel('ourPitcher', sh.ourPitcher, [['', 'Choose a pitcher']].concat(pitchers.map((p) => [p.id, (p.num ? '#' + p.num + ' ' : '') + p.name])), sh.locked ? 'disabled' : '')}</label>
        <div><span class="field-lbl">${esc(sh.oppName)} batting order</span>${lineupRosterTools(sh)}<div class="stack" style="gap:6px">${opp}</div>
        ${sh.locked ? '' : '<button class="btn ghost sm" data-act="oppAdd">+ Add batter</button>'}
        <p class="small muted" style="margin:4px 0 0">Jersey numbers are enough. Scouting tracks each hitter by number across games.</p></div>
        <label><span class="field-lbl">${esc(sh.oppName)} starting pitcher</span>${inp('oppPitcher', sh.oppPitcher, `placeholder="#19 or a name" ${sh.locked ? 'disabled' : ''}`)}</label>
        ${sh.err ? `<div class="warn-text">${esc(sh.err)}</div>` : ''}
        <div class="row"><button class="btn primary" data-act="saveLineup">${sh.start ? 'Start game' : 'Save lineups'}</button><button class="btn" data-act="close">Cancel</button></div>`;
    },
    play(sh) {
      const g = liveGame();
      const s = st(g);
      if (sh.step === 2) return runnersStep(sh, g, s);
      const groups = [
        ['Hits', [['1B', 'Single'], ['2B', 'Double'], ['3B', 'Triple'], ['HR', 'Home run']], 'hit'],
        ['Outs', [['GO', 'Ground out'], ['FO', 'Fly out'], ['LO', 'Line out'], ['PO', 'Pop out'], ['DP', 'Double play'], ['SF', 'Sac fly'], ['SAC', 'Sac bunt']], ''],
        ['Reached', [['E', 'Error'], ['FC', "Fielder's choice"]], '']
      ];
      return head('Ball in play') + `<div class="mu-sub" style="margin-top:-8px">${esc(refName(g, s.batter, true))} · ${s.balls}-${s.strikes} count · ${s.outs} out${s.outs === 1 ? '' : 's'}</div>
        ${fieldSVG({ tap: true, marker: sh.loc, label: 'Tap where the ball was fielded' })}
        <div class="row small muted" style="justify-content:space-between"><span>${sh.loc ? 'Marked: ' + esc(E.zoneName(sh.loc)) + ' · ' + E.geo(sh.loc).ft + ' ft' : 'Tap where the ball was fielded or landed.'}</span>${sh.loc ? '<button class="btn ghost sm" data-act="clearLoc">Clear</button>' : ''}</div>
        <div><span class="field-lbl">Contact</span>${segB('playBt', sh.bt || '', [['G', 'Ground'], ['L', 'Line'], ['F', 'Fly'], ['P', 'Pop']])}</div>
        ${groups.map(([lbl, items, cls]) => `<div class="res-lbl">${lbl}</div><div class="res-grid">${items.map(([r, l]) => `<button class="${cls}" data-act="playResult" data-r="${r}">${esc(l)}</button>`).join('')}</div>`).join('')}`;
    },
    runners(sh) {
      const g = liveGame();
      const s = st(g);
      const rows = [3, 2, 1].filter((b) => s.bases[b]).map((b) => destRow(g, s.bases[b].ref, b, sh.adv[b], 'runDest')).join('');
      const v = validateAdv(s, sh.adv, null);
      const moved = [1, 2, 3].some((b) => s.bases[b] && sh.adv[b] !== b);
      const whys = [['SB', 'Stolen base'], ['WP', 'Wild pitch'], ['PB', 'Passed ball'], ['BK', 'Balk'], ['E', 'Error'], ['CS', 'Caught stealing'], ['PO', 'Picked off'], ['ADV', 'Other']];
      return head('Move runners') + `<div>${rows || '<p class="muted">Nobody on base.</p>'}</div>
        <div><span class="field-lbl">How</span><div class="seg">${whys.map(([k, l]) => `<button data-act="runWhy" data-v="${k}" aria-pressed="${sh.why === k}">${l}</button>`).join('')}</div></div>
        ${v ? `<div class="warn-text">${esc(v)}</div>` : ''}
        <div class="row"><button class="btn primary" data-act="saveRunners" ${v || !moved ? 'disabled' : ''}>Record</button><button class="btn" data-act="close">Cancel</button></div>`;
    },
    pitcher(sh) {
      const g = liveGame();
      const pitchers = sortedRoster().sort((a, b) => (/P/.test(b.pos || '') ? 1 : 0) - (/P/.test(a.pos || '') ? 1 : 0));
      return head('Pitching change') + `
        <label><span class="field-lbl">${esc(Data.team.name)} pitcher</span>${sel('ours', sh.ours, [['', 'Choose a pitcher']].concat(pitchers.map((p) => [p.id, (p.num ? '#' + p.num + ' ' : '') + p.name])))}</label>
        <label><span class="field-lbl">${esc(g.opponent)} pitcher</span>${inp('theirs', sh.theirs, 'placeholder="#22 or a name"')}</label>
        <div class="row"><button class="btn primary" data-act="savePitcher">Save</button><button class="btn" data-act="close">Cancel</button></div>`;
    },
    sub(sh) {
      const g = liveGame();
      const s = st(g);
      const side = sh.side === 'us' ? s.us : s.them;
      const lu = s.lineups[side];
      const slots = lu.map((ref, i) => [i, ORDN(i + 1) + ' · ' + refName(g, ref)]);
      let who;
      if (sh.side === 'us') {
        const bench = sortedRoster().filter((p) => !lu.includes(p.id));
        who = `<label><span class="field-lbl">New player</span>${sel('pid', sh.pid, [['', 'Choose a player']].concat(bench.map((p) => [p.id, (p.num ? '#' + p.num + ' ' : '') + p.name])))}</label>`;
      } else {
        who = `<div class="grid3"><label><span class="field-lbl">#</span>${inp('num', sh.num, 'inputmode="numeric"')}</label><label><span class="field-lbl">Name</span>${inp('name', sh.name, 'placeholder="Optional"')}</label><label><span class="field-lbl">Bats</span>${sel('bats', sh.bats, BATS)}</label></div>`;
      }
      return head('Substitution') + `<div>${segB('subSide', sh.side, [['us', Data.team.name], ['them', g.opponent]])}</div>
        <label><span class="field-lbl">Batting spot</span>${sel('slot', sh.slot, slots)}</label>${who}
        ${sh.err ? `<div class="warn-text">${esc(sh.err)}</div>` : ''}
        <div class="row"><button class="btn primary" data-act="saveSub">Make substitution</button><button class="btn" data-act="close">Cancel</button></div>`;
    },
    opp(sh) {
      return head('Edit hitter') + `<div class="grid3"><label><span class="field-lbl">#</span>${inp('num', sh.num, 'inputmode="numeric"')}</label><label><span class="field-lbl">Name</span>${inp('name', sh.name, 'placeholder="Optional"')}</label><label><span class="field-lbl">Bats</span>${sel('bats', sh.bats, BATS)}</label></div>
        <p class="small muted" style="margin:0">Scouting groups this hitter by jersey number across games.</p>
        <div class="row"><button class="btn primary" data-act="saveOpp">Save</button><button class="btn" data-act="close">Cancel</button></div>`;
    },
    player(sh) {
      return head(sh.id ? 'Edit player' : 'Add player') + `
        <div class="grid3" style="grid-template-columns:80px 1fr"><label><span class="field-lbl">#</span>${inp('f.num', sh.f.num, 'inputmode="numeric"')}</label><label><span class="field-lbl">Name</span>${inp('f.name', sh.f.name, 'placeholder="First Last" autocomplete="off"')}</label></div>
        <div class="grid3" style="grid-template-columns:1fr 1fr 1fr"><label><span class="field-lbl">Position</span>${inp('f.pos', sh.f.pos, 'placeholder="SS, P"')}</label><label><span class="field-lbl">Bats</span>${sel('f.bats', sh.f.bats, BATS)}</label><label><span class="field-lbl">Throws</span>${sel('f.throws', sh.f.throws, [['', '—'], ['R', 'R'], ['L', 'L']])}</label></div>
        ${sh.err ? `<div class="warn-text">${esc(sh.err)}</div>` : ''}
        <div class="row"><button class="btn primary" data-act="savePlayer">${sh.id ? 'Save' : 'Add player'}</button>${sh.id ? `<button class="btn" data-act="playerCard" data-id="${esc(sh.id)}">Stats</button><button class="btn danger" data-act="deletePlayer">Remove</button>` : ''}</div>`;
    },
    roster(sh) {
      const names = [...new Set(Object.values(Data.games).map((g) => g.opponent).concat(Object.values(Data.opponents).map((o) => o.name)))].sort();
      const rows = sh.players.map((p, i) => `<div class="ros-row">${inp(`players.${i}.num`, p.num, 'placeholder="#" inputmode="numeric" aria-label="Number"')}${inp(`players.${i}.name`, p.name, 'placeholder="Name" aria-label="Name"')}${sel(`players.${i}.bats`, p.bats, BATS, 'aria-label="Bats"')}<button class="icon-btn" data-act="rosterRemove" data-i="${i}" aria-label="Remove player">×</button></div>`).join('');
      return head(sh.key ? esc(sh.name) + ' roster' : 'Opponent roster') + `
        ${sh.key ? '' : `<label><span class="field-lbl">Opponent</span>${inp('name', sh.name, 'list="ros-opps" autocomplete="off" placeholder="Team name"')}<datalist id="ros-opps">${names.map((n) => `<option value="${esc(n)}">`).join('')}</datalist></label>`}
        ${scanBlock(sh)}
        <div><span class="field-lbl">Players (${sh.players.filter((p) => rosterKey(p)).length})</span><div class="stack" style="gap:6px">${rows || '<p class="muted small" style="margin:0">No players yet.</p>'}</div>
        <button class="btn ghost sm" data-act="rosterAdd">+ Add player</button></div>
        ${sh.key ? sprayRosterBox(sh.key) : ''}
        ${sh.err ? `<div class="warn-text">${esc(sh.err)}</div>` : ''}
        <div class="row"><button class="btn primary" data-act="saveRosterSheet">Save roster</button>${sh.key ? '<button class="btn danger" data-act="deleteRoster">Delete roster</button>' : '<button class="btn" data-act="close">Cancel</button>'}</div>`;
    },
    spray(sh) {
      const names = [...new Set(Object.values(Data.games).map((g) => g.opponent).concat(Object.values(Data.opponents).map((o) => o.name)))].filter(Boolean).sort();
      const us = sh.who === 'us';
      const teamName = Data.team.name || 'Our team';
      let h = head('Import a spray chart');
      if (sh.step !== 'review') {
        if (!sh.fixed) h += `<div><span class="field-lbl">Whose chart?</span>${segB('sprayFor', us ? 'us' : 'opp', [['us', teamName], ['opp', 'An opponent']])}</div>`;
        if (!us) h += sh.fixed
          ? `<div><span class="field-lbl">Opponent</span><div class="sp-opp">${esc(sh.name)}</div></div>`
          : `<label><span class="field-lbl">Opponent</span>${inp('name', sh.name, 'list="sp-opps" autocomplete="off" placeholder="Team name"')}<datalist id="sp-opps">${names.map((n) => `<option value="${esc(n)}">`).join('')}</datalist></label>`;
        h += us
          ? `<p class="small muted" style="margin:0">Use screenshots of a spray chart report that shows each hitter's name and the dots where their balls in play went. GS Baseball reads every hitter, matches them to your roster, and adds the balls to your players' spray charts on the Stats tab. You check everything before it's saved.</p>`
          : `<p class="small muted" style="margin:0">Use screenshots of a spray chart report that shows each hitter's name and the dots where their balls in play went. GS Baseball reads every hitter, matches them to this team's roster, and adds the balls to the Scout tab. You check everything before it's saved.</p>`;
        if (sh.busy) h += `<div class="scan"><span class="spin" aria-hidden="true"></span><span class="grow">Reading every hitter's chart. This can take a minute.${sh.busy.note ? ' ' + esc(sh.busy.note) : ''}</span><button class="btn sm" data-act="sprayStop">Stop</button></div>`;
        else h += `<div><label class="btn primary scan-btn">${CAMERA}<span>Choose spray chart screenshots</span><input class="vh" type="file" accept="image/*" multiple data-spray="1"></label></div>`;
        if (sh.err) h += `<div class="warn-text">${esc(sh.err)}</div>`;
        return h;
      }
      const R = us ? null : rosterFor(sh.name);
      const pool = us ? sortedRoster() : R ? R.players : [];
      const named = pool.filter((p) => rosterKey(p)).map((p) => [p.id, (p.num ? '#' + p.num + ' ' : '') + (p.name || 'No name')]);
      const opts = us ? [['skip', 'Don’t import']].concat(named, [['', 'Add to your roster']]) : [['', 'Add as a new player']].concat(named, [['skip', 'Don’t import']]);
      const ps = sh.read.players;
      const total = ps.reduce((t, p) => t + sprayTotal(p.dots), 0);
      const off = ps.filter((p) => p.bip != null && p.bip !== sprayTotal(p.dots)).length;
      h += `<div class="sp-top"><div class="grow" style="min-width:0"><div class="sp-opp">${esc(us ? teamName : sh.name)}</div>${sh.read.title ? `<div class="small muted">${esc(sh.read.title)}</div>` : ''}</div><div class="sp-count"><b>${ps.length}</b><span>hitters</span></div><div class="sp-count"><b>${total}</b><span>balls in play</span></div></div>
        <div class="sp-key">${sh.read.legend ? 'Colors read from the chart\u2019s own key.' : 'Colors read as <b class="k-pu">green = pop up</b> · <b class="k-gb">red = ground ball</b> · <b class="k-ld">gold = line drive</b>'}</div>
        ${sprayReadNotes(sh.read)}
        ${off ? `<div class="warn-text">${off} hitter${off === 1 ? '’s' : 's’'} dots don’t add up to the chart’s total. Check ${off === 1 ? 'it' : 'them'} against the screenshot below.</div>` : ps.some((p) => p.bip != null) ? `<div class="small" style="color:var(--good);font-weight:600">Every hitter’s dots add up to the chart’s totals.</div>` : '<div class="small muted">This chart doesn’t print totals to check against, so compare a few hitters with your screenshot before saving.</div>'}
        <div class="sp-list">${ps.map((p, i) => {
          const n = sprayTotal(p.dots), d = sprayDirs(p.dots);
          const bad = p.bip != null && p.bip !== n;

  // Shrinks a photo to fit maxSide pixels and re-saves it as JPEG (also turns iPhone HEIC photos into JPEG).
  async function toJpegSized(file, maxSide, quality) {
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej({ code: 'decode' }); i.src = url; });
      const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.naturalWidth * scale));
      c.height = Math.max(1, Math.round(img.naturalHeight * scale));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const blob = await new Promise((res, rej) => c.toBlob((b) => (b ? res(b) : rej({ code: 'decode' })), 'image/jpeg', quality));
      return { blob, w: c.width, h: c.height };
    } finally { URL.revokeObjectURL(url); }

    } else if (after.half !== before.half) toast('Three outs. Side retired.');
    else if (ev.t === 'sub') toast('Substitution made');
    else if (ev.t === 'run' && after.runs !== before.runs && after.score.away + after.score.home > before.score.away + before.score.home) toast('Run scores');
    render();
  }
  function undo() {
    const g = liveGame();
    if (!g || !g.events.length) return;
    const ev = g.events.pop();
    saveGame(g);
    const what = ev.t === 'p' ? EV_LABEL[ev.r] : ev.t === 'pa' ? (E.RESULTS[ev.r] || {}).n : ev.t === 'run' ? 'runner move' : ev.t === 'pc' ? 'pitching change' : 'substitution';
    toast('Undid ' + String(what || 'last entry').toLowerCase());
    render();
  }

      const sel = UI.scoutKey === '*' ? null : O.hitters.get(UI.scoutKey);

      const t = tendencies(pas, sel ? sel.bats : '');
