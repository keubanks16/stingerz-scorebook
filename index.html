<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html{background:#0B2753}:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;min-height:100vh;min-height:100dvh}img{max-width:100%}[hidden]{display:none!important}</style>
<title>GS Baseball Hub</title>
<meta name="theme-color" content="#0B2753">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GS Hub">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=Graduate&display=swap">
<style>
/* Layout: phone-first team hub (scorebook, video, chat). Navy brand bar on top, one scrolling column (max 760px), fixed tab bar at the bottom.
   Chamfered "varsity" corners, cut like the GS letterforms, mark the scoreboard and the primary actions. */
:root {
  --ground: #E8ECF2;
  --surface: #FFFFFF;
  --surface-2: #F2F5F9;
  --ink: #0B1C3D;
  --ink-2: #4A5874;
  --ink-3: #75829B;
  --line: #D4DBE6;
  --navy: #0B2753;
  --carolina: #6DA0D6;
  --accent: #245FA8;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCE8F6;
  --board: #0B2753;
  --board-2: #12336A;
  --board-ink: #FFFFFF;
  --board-dim: #7F9AC4;
  --ball: #18834F;
  --strike: #C3392D;
  --warn: #B87A0A;
  --good: #18834F;
  --bad: #C3392D;
  --grass: #4A9558;
  --grass-2: #3E8049;
  --dirt: #C8946A;
  --chalk: #FFFFFF;
  --hit: #6DA0D6;
  --heat: #FF6B3D;
  --shadow: 0 1px 2px rgba(11, 28, 61, .06), 0 6px 18px rgba(11, 28, 61, .06);
  --scrim: rgba(4, 18, 45, .45);
  --on-signal: #FFFFFF;
  --c1: #0B2753; --c1-ink: #FFFFFF; --c2: #245FA8; --c2-ink: #FFFFFF; --c3: #6DA0D6; --c3-ink: #0B2753; --c4: #A9B6CA; --c4-ink: #0B1C3D;
  --font-display: "Graduate", "Rockwell", "Roboto Slab", Georgia, serif;
  --font-body: "Barlow Semi Condensed", "Arial Narrow", "Helvetica Neue", system-ui, sans-serif;
  --cut: 10px;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #04122D; --surface: #0A1D40; --surface-2: #0E2550; --ink: #E7EEF9; --ink-2: #A6B7D3; --ink-3: #7487A8; --line: #1B3364;
    --accent: #7FB0E6; --accent-ink: #04122D; --accent-soft: #15315F;
    --board: #020A1C; --board-2: #0B1D42; --board-ink: #FFFFFF; --board-dim: #6F8BB8;
    --ball: #3DBE7C; --strike: #F06A5C; --warn: #E8B04A; --good: #3DBE7C; --bad: #F06A5C;
    --grass: #2F6B3B; --grass-2: #275A31; --dirt: #9E7452; --chalk: #F2F5FA; --hit: #8FBDF0; --heat: #FF7A4D;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25); --scrim: rgba(0, 4, 14, .6);
    --on-signal: #04122D;
    --c1: #2E5A9E; --c1-ink: #FFFFFF; --c2: #6DA0D6; --c2-ink: #04122D; --c3: #B9D5F2; --c3-ink: #04122D; --c4: #4B5E80; --c4-ink: #FFFFFF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #04122D; --surface: #0A1D40; --surface-2: #0E2550; --ink: #E7EEF9; --ink-2: #A6B7D3; --ink-3: #7487A8; --line: #1B3364;
  --accent: #7FB0E6; --accent-ink: #04122D; --accent-soft: #15315F;
  --board: #020A1C; --board-2: #0B1D42; --board-ink: #FFFFFF; --board-dim: #6F8BB8;
  --ball: #3DBE7C; --strike: #F06A5C; --warn: #E8B04A; --good: #3DBE7C; --bad: #F06A5C;
  --grass: #2F6B3B; --grass-2: #275A31; --dirt: #9E7452; --chalk: #F2F5FA; --hit: #8FBDF0; --heat: #FF7A4D;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25); --scrim: rgba(0, 4, 14, .6);
  --on-signal: #04122D;
  --c1: #2E5A9E; --c1-ink: #FFFFFF; --c2: #6DA0D6; --c2-ink: #04122D; --c3: #B9D5F2; --c3-ink: #04122D; --c4: #4B5E80; --c4-ink: #FFFFFF;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--ground); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.4; -webkit-tap-highlight-color: transparent; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, table { font-variant-numeric: tabular-nums; }

/* ---------- brand bar ---------- */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--navy); color: #FFFFFF; }
.bar-in { max-width: 760px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
.mark { height: 34px; width: auto; display: block; }
.bar-title { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.bar-title b { font-family: var(--font-display); font-weight: 400; font-size: 19px; letter-spacing: .02em; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-title span { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #9EBBE2; font-weight: 600; }
.pill { font-size: 12px; font-weight: 600; letter-spacing: .04em; padding: 4px 10px; border-radius: 99px; background: rgba(255, 255, 255, .1); color: #CFE0F5; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #7FD3A4; }
.pill[data-s="saving"]::before { background: #F2C94C; }
.pill[data-s="error"]::before { background: #FF8A7A; }
.pill[data-s="local"]::before { background: #9EBBE2; }
.pill[data-s="follow"]::before { background: #FF6B5B; animation: pulse 1.6s infinite; }
@keyframes pulse { 50% { opacity: .35; } }

/* ---------- page column ---------- */
main { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 16px calc(96px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 18px; }
h2.sec { margin: 4px 0 -6px; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.muted { color: var(--ink-2); }
.small { font-size: 14px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }

/* ---------- buttons ---------- */
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 10px 14px; border-radius: 8px; font-weight: 600; font-size: 15px; line-height: 1.2; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; border-radius: 0; clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut)); outline-offset: -4px; letter-spacing: .02em; }
.btn.danger { color: var(--bad); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent); padding-inline: 6px; }
.btn.sm { min-height: 36px; padding: 6px 10px; font-size: 14px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.block { width: 100%; }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 7px 12px; border-radius: 7px; font-weight: 600; font-size: 14px; color: var(--ink-2); min-height: 34px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }

/* ---------- scoreboard (chamfered) ---------- */
.board { background: var(--board); color: var(--board-ink); clip-path: polygon(var(--cut) 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, var(--cut) 100%, 0 calc(100% - var(--cut)), 0 var(--cut)); padding: 14px 16px; position: relative; }
.board .lbl { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--board-dim); font-weight: 700; }
.linescore-wrap { overflow-x: auto; }
.linescore { border-collapse: collapse; width: 100%; }
.linescore th, .linescore td { text-align: center; padding: 5px 3px; font-size: 15px; min-width: 18px; }
.linescore thead th { color: var(--board-dim); font-weight: 600; font-size: 12px; }
.linescore td.tm { text-align: left; font-weight: 700; white-space: nowrap; max-width: min(140px, 26vw); overflow: hidden; text-overflow: ellipsis; padding-right: 8px; }
.linescore td.r { font-family: var(--font-display); font-size: 19px; color: var(--carolina); }
@media (max-width: 420px) { .board { padding: 12px; } .linescore th, .linescore td { padding: 4px 2px; font-size: 14px; } }
.linescore th.tot, .linescore td.tot { border-left: 1px solid var(--board-2); }
.linescore td.x { color: var(--board-dim); }

/* ---------- season summary ---------- */
.season { display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; align-items: center; }
.season .rec { font-family: var(--font-display); font-size: 40px; line-height: 1; color: var(--board-ink); }
.season .rec small { font-size: 18px; color: var(--board-dim); }
.season .facts { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 15px; color: #C9D8EE; }
.season .facts b { color: #FFFFFF; font-weight: 600; }
.season .lbl { grid-column: 1 / -1; }

/* ---------- game rows ---------- */
.list { display: flex; flex-direction: column; gap: 8px; }
.game-row { display: grid; grid-template-columns: 48px 1fr auto; gap: 12px; align-items: center; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
.game-row:hover { border-color: var(--accent); }
.gr-date { display: flex; flex-direction: column; align-items: center; line-height: 1.05; color: var(--ink-2); font-size: 11px; font-weight: 700; letter-spacing: .08em; }
.gr-date .d { font-family: var(--font-display); font-size: 22px; color: var(--ink); letter-spacing: 0; }
.gr-opp { font-weight: 700; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gr-meta { font-size: 14px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gr-res { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; }
.chip { display: inline-flex; align-items: center; justify-content: center; min-width: 26px; height: 24px; padding: 0 7px; border-radius: 6px; font-size: 13px; font-weight: 700; letter-spacing: .04em; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
.chip.w { background: var(--good); color: var(--on-signal); border-color: transparent; }
.chip.l { background: var(--bad); color: var(--on-signal); border-color: transparent; }
.chip.live { background: var(--strike); color: var(--on-signal); border-color: transparent; }
.chip.sample { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

.banner { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 12px 14px; border-radius: var(--radius); background: var(--accent-soft); color: var(--ink); font-size: 15px; }
.banner .grow { min-width: 200px; }
.empty { text-align: center; padding: 28px 18px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty img { height: 64px; width: auto; }
.empty h3 { margin: 0; font-size: 20px; }
.empty p { margin: 0; color: var(--ink-2); max-width: 40ch; }

/* ---------- tables ---------- */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
table.st { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 15px; }
table.st th, table.st td { padding: 9px 8px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
table.st th { font-size: 12px; letter-spacing: .06em; color: var(--ink-3); font-weight: 700; background: var(--surface); position: sticky; top: 0; }
table.st th button { border: 0; background: none; padding: 0; font: inherit; color: inherit; letter-spacing: inherit; }
table.st th.on { color: var(--accent); }
table.st th:first-child, table.st td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); z-index: 1; max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
table.st tr.tot td { font-weight: 700; background: var(--surface-2); }
table.st tr.tot td:first-child { background: var(--surface-2); }
table.st tbody tr[data-act] { cursor: pointer; }
table.st tbody tr[data-act]:hover td { background: var(--surface-2); }
table.st tr:last-child td { border-bottom: 0; }
.pnum { color: var(--ink-3); font-size: 13px; margin-right: 4px; }

/* ---------- live scoring ---------- */
.live-board { display: grid; grid-template-columns: 1fr auto; gap: 10px 16px; align-items: center; }
.lb-teams { display: grid; grid-template-columns: 14px 1fr auto; gap: 2px 8px; align-items: center; min-width: 0; }
.lb-teams .bat { color: var(--carolina); font-size: 12px; }
.lb-teams .nm { font-weight: 700; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lb-teams .sc { font-family: var(--font-display); font-size: 30px; line-height: 1.05; color: var(--carolina); text-align: right; min-width: 1.4em; }
.lb-side { display: flex; flex-direction: column; align-items: center; gap: 6px; border-left: 1px solid var(--board-2); padding-left: 16px; }
.lb-inn { font-family: var(--font-display); font-size: 28px; line-height: 1; display: flex; align-items: center; gap: 4px; }
.lb-inn svg { width: 14px; height: 14px; fill: var(--carolina); }
.lights { grid-column: 1 / -1; display: flex; gap: 18px; flex-wrap: wrap; border-top: 1px solid var(--board-2); padding-top: 10px; }
.light-set { display: flex; align-items: center; gap: 6px; }
.light-set .lbl { margin-right: 2px; }
.lamp { width: 13px; height: 13px; border-radius: 50%; background: var(--board-2); }
.lamp.on.b { background: #3DBE7C; box-shadow: 0 0 8px #3DBE7C; }
.lamp.on.s, .lamp.on.o { background: #FF6B5B; box-shadow: 0 0 8px #FF6B5B; }

.matchup { display: grid; grid-template-columns: 120px 1fr; gap: 12px; align-items: center; }
.diamond { width: 120px; height: 104px; display: block; }
.diamond .base { fill: var(--surface); stroke: var(--ink-3); stroke-width: 1.5; }
.diamond .base.on { fill: var(--carolina); stroke: var(--navy); }
.diamond text { font-family: var(--font-body); font-weight: 700; font-size: 10px; fill: var(--ink); text-anchor: middle; }
.diamond .path { fill: none; stroke: var(--line); stroke-width: 1.5; }
.diamond-btn { border: 0; background: none; padding: 0; border-radius: 8px; }
.mu { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.mu-row { min-width: 0; }
.mu-row .lbl { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); font-weight: 700; }
.mu-name { font-weight: 700; font-size: 19px; line-height: 1.15; display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.mu-name button { border: 0; background: none; padding: 0; text-align: left; font-weight: 700; color: var(--ink); text-decoration: underline dotted var(--ink-3); text-underline-offset: 3px; }
.mu-sub { font-size: 14px; color: var(--ink-2); }
.pc-bar { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; margin-top: 4px; border: 1px solid var(--line); }
.pc-bar i { display: block; height: 100%; background: var(--good); }
.pc-bar i.warn { background: var(--warn); }
.pc-bar i.over { background: var(--bad); }

.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.pad button { border: 0; min-height: 64px; border-radius: 10px; font-weight: 700; font-size: 17px; line-height: 1.1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--on-signal); }
.pad button small { font-weight: 600; font-size: 12px; opacity: .85; letter-spacing: .04em; }
.pad .k-ball { background: var(--ball); }
.pad .k-strike { background: var(--strike); }
.pad .k-foul { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.pad .k-play { grid-column: span 2; background: var(--accent); color: var(--accent-ink); border-radius: 0; clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut)); outline-offset: -4px; font-size: 19px; }
.pad button:active { transform: translateY(1px); filter: brightness(.95); }
.tools { display: flex; gap: 8px; flex-wrap: wrap; }
.tools .btn { flex: 1 1 auto; }
.plays { display: flex; flex-direction: column; }
.play { padding: 10px 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 38px 1fr; gap: 10px; align-items: start; font-size: 15px; }
.play:last-child { border-bottom: 0; }
.play .tag { font-size: 12px; font-weight: 700; color: var(--ink-3); padding-top: 2px; }
.play .scr { display: block; margin-top: 2px; font-weight: 700; font-size: 14px; color: var(--accent); }
.inning-head { margin-top: 12px; padding: 6px 0; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; color: var(--ink-3); border-bottom: 2px solid var(--line); }
.follow-note { display: flex; gap: 10px; align-items: center; font-size: 15px; color: var(--ink-2); }

/* ---------- field / spray ---------- */
.field { width: 100%; max-width: 480px; display: block; margin: 0 auto; touch-action: manipulation; }
.field .foul-g { fill: var(--grass-2); }
.field .fair { fill: var(--grass); }
.field .dirt { fill: var(--dirt); }
.field .igrass { fill: var(--grass); }
.field .chalk { stroke: var(--chalk); stroke-width: .45; fill: none; }
.field .bag { fill: var(--chalk); }
.field .track { stroke: var(--dirt); stroke-width: 2.6; fill: none; opacity: .85; }
.field .dot-hit { fill: var(--hit); stroke: #FFFFFF; stroke-width: .5; }
.field .dot-out { fill: none; stroke: #FFFFFF; stroke-width: .7; }
.field .dot-reach { fill: #F2C94C; stroke: #FFFFFF; stroke-width: .5; }
.field .heat circle { fill: var(--heat); }
.field .marker { fill: #FFFFFF; stroke: var(--navy); stroke-width: .8; }
.field .marker-ring { fill: none; stroke: #FFFFFF; stroke-width: .5; opacity: .8; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; font-size: 13px; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
.legend .lh { background: var(--hit); }
.legend .lo { border: 1.5px solid var(--ink-2); }
.legend .lr { background: #F2C94C; }

.tend { display: grid; gap: 10px; }
.tend-row { display: grid; grid-template-columns: 92px 1fr; gap: 10px; align-items: center; font-size: 14px; }
.tend-row .lbl { color: var(--ink-2); font-weight: 600; }
.stackbar { display: flex; height: 22px; border-radius: 5px; overflow: hidden; background: var(--surface-2); }
.stackbar span { display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; min-width: 0; overflow: hidden; white-space: nowrap; }
.stackbar .s1 { background: var(--c1); color: var(--c1-ink); }
.stackbar .s2 { background: var(--c2); color: var(--c2-ink); }
.stackbar .s3 { background: var(--c3); color: var(--c3-ink); }
.stackbar .s4 { background: var(--c4); color: var(--c4-ink); }
.tip { border-left: 3px solid var(--accent); padding: 4px 0 4px 12px; display: flex; flex-direction: column; gap: 6px; font-size: 15px; }
.tip p { margin: 0; }
.ai-out { white-space: pre-wrap; font-size: 15px; background: var(--surface-2); border-radius: 8px; padding: 12px; }

.picker { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.picker button { flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 7px 14px; font-weight: 600; font-size: 15px; min-height: 38px; }
.picker button[aria-pressed="true"] { background: var(--navy); color: #FFFFFF; border-color: var(--navy); }
.hitters { display: flex; flex-direction: column; }
.hitter { display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; width: 100%; }
.hitter:last-child { border-bottom: 0; }
.hitter[aria-pressed="true"] { background: var(--accent-soft); }

/* ---------- roster ---------- */
.brand-card { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; padding: 16px; }

.brand-card img { height: 56px; width: auto; display: block; }

.roster { display: flex; flex-direction: column; }
.player { display: grid; grid-template-columns: 48px 1fr auto; gap: 12px; align-items: center; padding: 10px 14px; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; width: 100%; }
.player:last-child { border-bottom: 0; }
.player .no { font-family: var(--font-display); font-size: 22px; text-align: center; color: var(--accent); }
.player .nm { font-weight: 700; font-size: 17px; }
.player .meta { font-size: 14px; color: var(--ink-2); display: block; overflow-wrap: anywhere; }

/* ---------- bottom tabs ---------- */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs-in { max-width: 760px; margin: 0 auto; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; }
.tabs button { border: 0; background: none; padding: 8px 2px 9px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 12px; font-weight: 600; color: var(--ink-3); position: relative; min-height: 56px; }
.tabs button svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabs button[aria-current="page"] { color: var(--accent); }
.tabs button[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 28%; right: 28%; height: 3px; background: var(--accent); border-radius: 0 0 3px 3px; }
.tabs .dot { position: absolute; top: 8px; right: calc(50% - 18px); width: 9px; height: 9px; border-radius: 50%; background: var(--strike); border: 2px solid var(--surface); }

/* ---------- sheets ---------- */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 600px; max-height: 92vh; max-height: 92dvh; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; animation: rise .18s ease-out; }
@keyframes rise { from { transform: translateY(24px); opacity: .6; } }
@media (min-width: 700px) { .scrim { align-items: center; } .sheet { border-radius: 16px; max-height: 88vh; } }
.sheet > * { flex-shrink: 0; }
.sheet .seg { align-self: flex-start; }
.sheet-head { display: flex; align-items: center; gap: 10px; }
.sheet-head h3 { margin: 0; font-size: 20px; flex: 1; min-width: 0; }
.x { border: 0; background: var(--surface-2); width: 36px; height: 36px; border-radius: 50%; font-size: 20px; line-height: 1; color: var(--ink-2); flex: 0 0 auto; }
.field-lbl { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; color: var(--ink-3); margin-bottom: 4px; display: block; }
.input { width: 100%; border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 10px 12px; min-height: 44px; font-size: 16px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: 70px 1fr 74px; gap: 8px; align-items: center; }
.res-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.res-grid button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; min-height: 48px; padding: 6px 4px; font-weight: 700; font-size: 14px; line-height: 1.1; }
.res-grid button.hit { background: var(--accent-soft); border-color: transparent; color: var(--ink); }
.res-grid button:hover { border-color: var(--accent); }
.res-lbl { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; color: var(--ink-3); margin: 4px 0 -6px; }
.runner-row { display: grid; grid-template-columns: 1fr; gap: 6px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.runner-row:last-child { border-bottom: 0; }
.runner-row .who { font-weight: 700; }
.runner-row .who small { color: var(--ink-3); font-weight: 600; margin-left: 6px; }
.dest { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.dest button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 7px; min-height: 40px; font-weight: 700; font-size: 14px; }
.dest button[aria-pressed="true"] { background: var(--navy); color: #FFFFFF; border-color: var(--navy); }
.dest button.out[aria-pressed="true"] { background: var(--bad); border-color: var(--bad); }
.dest button:disabled { opacity: .3; }
.warn-text { color: var(--bad); font-size: 14px; font-weight: 600; }
.order { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.order-row { display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; align-items: center; padding: 6px 8px; border-bottom: 1px solid var(--line); background: var(--surface); }

.order-row .slot { font-family: var(--font-display); color: var(--ink-3); text-align: center; }
.order-row .acts { display: flex; gap: 4px; }
.icon-btn { border: 1px solid var(--line); background: var(--surface-2); width: 34px; height: 34px; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; font-size: 16px; color: var(--ink-2); }
.bench { display: flex; flex-wrap: wrap; gap: 6px; }
.bench button { border: 1px dashed var(--ink-3); background: transparent; border-radius: 99px; padding: 6px 12px; font-weight: 600; font-size: 14px; }
.opp-row { display: grid; grid-template-columns: 24px 64px 1fr 64px 34px; gap: 6px; align-items: center; }
.opp-row .slot { font-family: var(--font-display); color: var(--ink-3); text-align: center; }
.opp-row .input { padding: 8px; min-height: 40px; }

.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }
.scan-btn { position: relative; align-self: flex-start; }
.scan { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--accent-soft); font-size: 15px; }
.spin { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; flex: 0 0 auto; }
@keyframes spin { to { transform: rotate(360deg); } }
.ros-row { display: grid; grid-template-columns: 64px 1fr 64px 34px; gap: 6px; align-items: center; }
.ros-row .input { padding: 8px; min-height: 40px; }
body.gated .tabs { display: none; }
.gate { padding: 32px 18px; margin-top: 8vh; }
.gate .logo-tile { background: var(--navy); padding: 12px 14px; clip-path: polygon(var(--cut) 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, var(--cut) 100%, 0 calc(100% - var(--cut)), 0 var(--cut)); }
.gate .logo-tile img { height: 56px; width: auto; display: block; }
.gate p { max-width: 42ch; }
.video-dock { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 0; display: flex; flex-direction: column; gap: 8px; }
.video-box { position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; background: #000000; border-radius: 10px; overflow: hidden; }
.video-box iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.bug { position: absolute; left: 8px; top: 8px; display: flex; align-items: stretch; gap: 0; background: rgba(4, 18, 45, .88); color: #FFFFFF; font-size: 13px; font-weight: 700; line-height: 1.15; pointer-events: none; clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px); font-variant-numeric: tabular-nums; }
.bug > span { padding: 5px 8px; display: flex; align-items: center; gap: 4px; border-left: 1px solid rgba(255, 255, 255, .15); }

.bug-teams { flex-direction: column; align-items: flex-start !important; gap: 1px !important; }
.bug-teams b { color: #8FBDF0; margin-left: 4px; font-family: var(--font-display); font-weight: 400; }
.bug-outs i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255, 255, 255, .25); display: inline-block; }
.bug-outs i.on { background: #FF6B5B; }
.video-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.video-box video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000000; }
.dock-msg { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: #FFFFFF; background: rgba(0, 0, 0, .6); padding: 8px 12px; border-radius: 8px; font-size: 14px; white-space: nowrap; }
.unmute { position: absolute; right: 8px; bottom: 8px; border: 0; background: rgba(4, 18, 45, .88); color: #FFFFFF; font-weight: 700; font-size: 13px; padding: 7px 10px; border-radius: 8px; }

.cam { position: fixed; inset: 0; z-index: 60; background: #000000; color: #FFFFFF; }
.cam video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000000; }
.cam-top { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 10px); left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; z-index: 1; }

.bug { white-space: nowrap; }
.cam-status { background: rgba(0, 0, 0, .6); color: #FFFFFF; font-weight: 700; font-size: 13px; padding: 6px 10px; border-radius: 99px; white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.cam-status[data-s="live"] { background: #D9342B; }

.cam-msg { position: absolute; left: 12px; right: 12px; top: calc(env(safe-area-inset-top, 0px) + 66px); background: rgba(0, 0, 0, .72); color: #FFFFFF; padding: 10px 12px; border-radius: 10px; font-size: 14px; z-index: 1; max-width: 560px; }
.cam-bar { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 12px calc(env(safe-area-inset-bottom, 0px) + 14px); display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap; background: linear-gradient(rgba(0, 0, 0, 0), rgba(0, 0, 0, .8)); z-index: 1; }

.vrec-top { display: flex; flex-direction: column; gap: 2px; min-width: 0; }

.vrec-top .meta { font-size: 14px; color: var(--ink-2); }

.vrec-bar { display: block; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; margin-top: 4px; }
.vrec-bar i { display: block; height: 100%; background: var(--accent); }

.chat { display: flex; flex-direction: column; gap: 4px; }

.msg { display: flex; flex-direction: column; align-items: flex-start; max-width: 82%; gap: 3px; margin-top: 8px; }
.msg.grouped { margin-top: 0; }
.msg.me { align-self: flex-end; align-items: flex-end; }
.msg-meta { font-size: 12px; color: var(--ink-3); display: flex; gap: 6px; align-items: center; padding: 0 4px; }
.msg-meta b { color: var(--ink-2); }
.msg-meta .chip { height: 18px; font-size: 11px; padding: 0 5px; }
.bubble { background: var(--surface); border: 1px solid var(--line); color: var(--ink); padding: 8px 12px; border-radius: 16px 16px 16px 4px; font-size: 16px; line-height: 1.35; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.me .bubble { background: var(--accent); color: var(--accent-ink); border-color: transparent; border-radius: 16px 16px 4px 16px; }

.chat-bar { position: fixed; left: 0; right: 0; bottom: calc(57px + env(safe-area-inset-bottom, 0px)); z-index: 29; background: var(--surface); border-top: 1px solid var(--line); padding: 8px max(12px, calc((100% - 760px) / 2 + 12px)); display: flex; gap: 8px; align-items: flex-end; }
.chat-bar textarea { flex: 1; min-width: 0; resize: none; border: 1px solid var(--line); background: var(--surface-2); border-radius: 20px; padding: 10px 14px; font-size: 16px; line-height: 1.3; max-height: 120px; color: var(--ink); }
.chat-bar .btn { border-radius: 20px; clip-path: none; min-height: 42px; }
.toast { position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--ground); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 15px; z-index: 50; max-width: calc(100% - 32px); box-shadow: var(--shadow); }
.loading { padding: 60px 0; text-align: center; color: var(--ink-2); display: flex; flex-direction: column; align-items: center; gap: 14px; }
.loading img { height: 60px; width: auto; animation: pulse 1.4s infinite; }
.over-banner { background: var(--accent-soft); border-radius: var(--radius); padding: 12px 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.over-banner .grow { min-width: 180px; font-weight: 600; }

  .matchup { grid-template-columns: 100px 1fr; }

}

<script>/* GS Baseball scoring engine: replays a game's event log into game state and stats. */
(function (root) {
  'use strict';

  // Result catalogue. ab = counts as at-bat, bip = ball in play, bt = default batted-ball type.
  const RESULTS = {
    '1B': { n: 'Single', v: 'singled', hit: 1, tb: 1, ab: 1, bip: 1 },
    '2B': { n: 'Double', v: 'doubled', hit: 1, tb: 2, ab: 1, bip: 1 },
    '3B': { n: 'Triple', v: 'tripled', hit: 1, tb: 3, ab: 1, bip: 1 },
    'HR': { n: 'Home run', v: 'homered', hit: 1, tb: 4, ab: 1, bip: 1, bt: 'F' },
    'GO': { n: 'Ground out', v: 'grounded out', out: 1, ab: 1, bip: 1, bt: 'G' },
    'FO': { n: 'Fly out', v: 'flied out', out: 1, ab: 1, bip: 1, bt: 'F' },
    'LO': { n: 'Line out', v: 'lined out', out: 1, ab: 1, bip: 1, bt: 'L' },
    'PO': { n: 'Pop out', v: 'popped out', out: 1, ab: 1, bip: 1, bt: 'P' },
    'DP': { n: 'Double play', v: 'grounded into a double play', out: 1, ab: 1, bip: 1, bt: 'G', noRbi: 1 },
    'SF': { n: 'Sac fly', v: 'hit a sacrifice fly', out: 1, ab: 0, bip: 1, bt: 'F', sf: 1 },
    'SAC': { n: 'Sac bunt', v: 'laid down a sacrifice bunt', out: 1, ab: 0, bip: 1, bt: 'G', sh: 1 },
    'FC': { n: "Fielder's choice", v: "reached on a fielder's choice", ab: 1, bip: 1, bt: 'G' },
    'E': { n: 'Error', v: 'reached on an error', ab: 1, bip: 1, bt: 'G', noRbi: 1, err: 1 },
    'BB': { n: 'Walk', v: 'walked', ab: 0, walk: 1 },
    'IBB': { n: 'Intentional walk', v: 'was intentionally walked', ab: 0, walk: 1 },
    'HBP': { n: 'Hit by pitch', v: 'was hit by a pitch', ab: 0 },
    'K': { n: 'Strikeout', v: 'struck out swinging', ab: 1, k: 1, noRbi: 1 },
    'KL': { n: 'Strikeout looking', v: 'struck out looking', ab: 1, k: 1, noRbi: 1 }
  };

  // Field geometry, shared with the spray chart. 1 unit = 5 ft.
  const HOME = { x: 50, y: 76 };
  const FENCE = 66;

  const other = (side) => (side === 'away' ? 'home' : 'away');

  function emptyBat() {
    return { G: 0, PA: 0, AB: 0, H: 0, '1B': 0, '2B': 0, '3B': 0, HR: 0, RBI: 0, R: 0, BB: 0, HBP: 0, K: 0, SF: 0, SH: 0, SB: 0, CS: 0, TB: 0, ROE: 0 };
  }
  function emptyPit() {
    return { G: 0, PC: 0, ST: 0, B: 0, BF: 0, H: 0, BB: 0, HBP: 0, K: 0, R: 0, ER: 0, OUTS: 0, HR: 0 };
  }

  // Where runners go by default for a result, given who is on base.
  function defaultAdv(r, bases) {
    const on = (b) => !!bases[b];
    const adv = {};
    const stay = () => { for (const b of [1, 2, 3]) if (on(b)) adv[b] = b; };
    const move = (n) => { for (const b of [1, 2, 3]) if (on(b)) adv[b] = Math.min(4, b + n); };
    const forced = () => {
      stay();
      if (on(1)) { adv[1] = 2; if (on(2)) { adv[2] = 3; if (on(3)) adv[3] = 4; } }
    };
    const leadOut = () => {
      if (on(1)) adv[1] = 0; else if (on(2)) adv[2] = 0; else if (on(3)) adv[3] = 0;
    };
    switch (r) {
      case '1B': adv.B = 1; move(1); break;
      case '2B': adv.B = 2; move(2); break;
      case '3B': adv.B = 3; move(3); break;
      case 'HR': adv.B = 4; move(4); break;
      case 'BB': case 'IBB': case 'HBP': adv.B = 1; forced(); break;
      case 'E': adv.B = 1; move(1); break;
      case 'SAC': adv.B = 0; move(1); break;
      case 'SF': adv.B = 0; stay(); if (on(3)) adv[3] = 4; break;
      case 'FC': adv.B = 1; forced(); leadOut(); break;
      case 'DP': adv.B = 0; stay(); leadOut(); break;
      default: adv.B = 0; stay();
    }
    return adv;
  }

  function createState(game) {
    const us = game.home ? 'home' : 'away';
    const them = other(us);
    const lineups = {};
    lineups[us] = (game.lineup || []).slice();
    lineups[them] = (game.oppLineup || []).map((o) => o.id);
    const pitcher = {};
    pitcher[us] = game.ourPitcher || null;
    pitcher[them] = game.oppPitcher ? '~' + game.oppPitcher : '~Opponent pitcher';
    const s = {
      us, them, innings: game.innings || 7,
      inning: 1, half: 0, outs: 0, balls: 0, strikes: 0,
      bases: [null, null, null, null],
      runs: { away: [0], home: [] }, hits: { away: 0, home: 0 }, errs: { away: 0, home: 0 },
      lob: { away: 0, home: 0 },
      batIdx: { away: 0, home: 0 },
      lineups, pitcher,
      cur: { pitches: [] }, halfEvents: 0,
      pas: [], log: [], bat: {}, pit: {}, pitOrder: { away: [], home: [] }, batOrder: { away: [], home: [] }
    };
    for (const side of ['away', 'home']) {
      if (s.pitcher[side]) touchPitcher(s, side, s.pitcher[side]);
      s.lineups[side].forEach((ref) => touchBatter(s, side, ref));
    }
    return s;
  }

  function touchBatter(s, side, ref) {
    if (!ref) return null;
    if (!s.bat[ref]) { s.bat[ref] = emptyBat(); s.bat[ref].G = 1; s.batOrder[side].push(ref); }
    return s.bat[ref];
  }
  function touchPitcher(s, side, ref) {
    if (!ref) return null;
    if (!s.pit[ref]) { s.pit[ref] = emptyPit(); s.pit[ref].G = 1; s.pitOrder[side].push(ref); }
    return s.pit[ref];
  }

  const batSide = (s) => (s.half === 0 ? 'away' : 'home');
  const fieldSide = (s) => other(batSide(s));
  function currentBatter(s) {
    const side = batSide(s);
    const lu = s.lineups[side];
    if (!lu || !lu.length) return null;
    return lu[s.batIdx[side] % lu.length];
  }
  function currentSlot(s) {
    const side = batSide(s);
    const lu = s.lineups[side];
    return lu && lu.length ? s.batIdx[side] % lu.length : 0;
  }
  const currentPitcher = (s) => s.pitcher[fieldSide(s)];

  function moveRunners(s, adv, batter) {
    const nb = [null, null, null, null];
    const scored = [];
    const moves = [];
    let outs = 0;
    for (const b of [3, 2, 1]) {
      const rn = s.bases[b];
      if (!rn) continue;
      let d = adv[b];
      if (d == null) d = b;
      moves.push({ ref: rn.ref, from: b, to: d });
      if (d === 0) outs++;
      else if (d >= 4) scored.push(rn);
      else if (!nb[d]) nb[d] = rn;
      else { // collision: push the trailing runner back to the nearest open base behind
        let t = d - 1;
        while (t > 0 && nb[t]) t--;
        if (t > 0) nb[t] = rn;
      }
    }
    if (batter) {
      let d = adv.B;
      if (d == null) d = 0;
      moves.push({ ref: batter.ref, from: 0, to: d });
      if (d === 0) outs++;
      else if (d >= 4) scored.push(batter);
      else nb[d] = batter;
    }
    s.bases = nb;
    return { scored, outs, moves };
  }

  function scoreRuns(s, side, scored, unearnedPlay) {
    for (const rn of scored) {
      s.runs[side][s.inning - 1] = (s.runs[side][s.inning - 1] || 0) + 1;
      const b = touchBatter(s, side, rn.ref);
      if (b) b.R++;
      const p = s.pit[rn.pit];
      if (p) { p.R++; if (!rn.ue && !unearnedPlay) p.ER++; }
    }
  }

  function endHalf(s) {
    const side = batSide(s);
    s.lob[side] += s.bases.filter(Boolean).length;
    s.bases = [null, null, null, null];
    s.outs = 0; s.balls = 0; s.strikes = 0;
    s.cur = { pitches: [] };
    s.halfEvents = 0;
    s.half ^= 1;
    if (s.half === 0) s.inning++;
    const ns = batSide(s);
    if (s.runs[ns][s.inning - 1] == null) s.runs[ns][s.inning - 1] = 0;
    s.log.push({ k: 'half', inn: s.inning, half: s.half });
  }

  function endPA(s, ev) {
    const meta = RESULTS[ev.r];
    if (!meta) return;
    const side = batSide(s);
    const ref = currentBatter(s);
    const pref = currentPitcher(s);
    const ps = touchPitcher(s, fieldSide(s), pref);
    const bs = touchBatter(s, side, ref);
    const adv = ev.adv || defaultAdv(ev.r, s.bases);
    const pa = {
      side, ref, pit: pref, inn: s.inning, half: s.half, r: ev.r,
      loc: ev.loc || null, bt: meta.bip ? (ev.bt || meta.bt || null) : null,
      pitches: s.cur.pitches.slice(), outsBefore: s.outs, count: [s.balls, s.strikes],
      rbi: 0, runs: 0, moves: [], slot: currentSlot(s)
    };
    const res = moveRunners(s, adv, ref ? { ref, pit: pref, ue: !!meta.err } : null);
    pa.moves = res.moves;
    pa.runs = res.scored.length;
    pa.rbi = meta.noRbi ? 0 : res.scored.length;
    scoreRuns(s, side, res.scored, !!meta.err);
    s.outs += res.outs;
    pa.outsOnPlay = res.outs;
    if (ps) {
      ps.OUTS += res.outs; ps.BF++;
      if (meta.hit) ps.H++;
      if (ev.r === 'HR') ps.HR++;
      if (meta.walk) ps.BB++;
      if (ev.r === 'HBP') ps.HBP++;
      if (meta.k) ps.K++;
    }
    if (bs) {
      bs.PA++;
      if (meta.ab) bs.AB++;
      if (meta.hit) { bs.H++; bs[ev.r]++; bs.TB += meta.tb; }
      if (meta.walk) bs.BB++;
      if (ev.r === 'HBP') bs.HBP++;
      if (meta.k) bs.K++;
      if (meta.sf) bs.SF++;
      if (meta.sh) bs.SH++;
      if (meta.err) bs.ROE++;
      bs.RBI += pa.rbi;
    }
    if (meta.hit) s.hits[side]++;
    if (meta.err) s.errs[fieldSide(s)]++;
    s.batIdx[side]++;
    s.balls = 0; s.strikes = 0;
    s.cur = { pitches: [] };
    pa.i = s.pas.length;
    s.pas.push(pa);
    s.log.push({ k: 'pa', pa });
    if (s.outs >= 3) endHalf(s);
  }

  function pitch(s, code) {
    const ps = touchPitcher(s, fieldSide(s), currentPitcher(s));
    s.cur.pitches.push(code);
    if (ps) ps.PC++;
    if (code === 'B') {
      if (ps) ps.B++;
      s.balls++;
      if (s.balls >= 4) endPA(s, { r: 'BB' });
    } else {
      if (ps) ps.ST++;
      if (code === 'F') {
        if (s.strikes < 2) s.strikes++;
      } else {
        s.strikes++;
        if (s.strikes >= 3) endPA(s, { r: code === 'C' ? 'KL' : 'K' });
      }
    }
  }

  function runnerEvent(s, ev) {
    const side = batSide(s);
    const before = s.bases.slice();
    const res = moveRunners(s, ev.adv || {}, null);
    const unearned = ev.why === 'E' || ev.why === 'PB';
    scoreRuns(s, side, res.scored, unearned);
    s.outs += res.outs;
    const ps = s.pit[currentPitcher(s)];
    if (ps) ps.OUTS += res.outs;
    for (const m of res.moves) {
      const b = s.bat[m.ref];
      if (!b) continue;
      if (ev.why === 'SB' && m.to > m.from) b.SB++;
      if (ev.why === 'CS' && m.to === 0) b.CS++;
    }
    if (ev.why === 'E') s.errs[fieldSide(s)]++;
    s.log.push({ k: 'run', inn: s.inning, half: s.half, why: ev.why || 'ADV', moves: res.moves.filter((m) => m.to !== m.from), runs: res.scored.length, side, before });
    if (s.outs >= 3) endHalf(s);
  }

  function apply(s, ev) {
    if (ev.t === 'p' || ev.t === 'pa' || ev.t === 'run') s.halfEvents++;
    switch (ev.t) {
      case 'p': pitch(s, ev.r); break;
      case 'pa': {
        const meta = RESULTS[ev.r];
        if (!meta) break;
        if (meta.bip || ev.r === 'HBP') {
          const ps = touchPitcher(s, fieldSide(s), currentPitcher(s));
          s.cur.pitches.push(meta.bip ? 'X' : 'H');
          if (ps) { ps.PC++; if (meta.bip) ps.ST++; else ps.B++; }
        }
        endPA(s, ev);
        break;
      }
      case 'run': runnerEvent(s, ev); break;
      case 'pc': {
        const side = ev.side;
        s.pitcher[side] = ev.ref;
        touchPitcher(s, side, ev.ref);
        s.log.push({ k: 'pc', inn: s.inning, half: s.half, side, ref: ev.ref });
        break;
      }
      case 'sub': {
        const lu = s.lineups[ev.side];
        if (lu && ev.slot >= 0 && ev.slot < lu.length) {
          const prev = lu[ev.slot];
          lu[ev.slot] = ev.ref;
          touchBatter(s, ev.side, ev.ref);
          s.log.push({ k: 'sub', inn: s.inning, half: s.half, side: ev.side, ref: ev.ref, prev, slot: ev.slot });
        }
        break;
      }
      default: break;
    }
  }

  function replay(game, upTo) {
    const s = createState(game);
    const evs = game.events || [];
    const n = upTo == null ? evs.length : Math.min(upTo, evs.length);
    for (let i = 0; i < n; i++) apply(s, evs[i]);
    s.batSide = batSide(s);
    s.fieldSide = fieldSide(s);
    s.batter = currentBatter(s);
    s.slot = currentSlot(s);
    s.pitcherNow = currentPitcher(s);
    const sum = (a) => a.reduce((t, v) => t + (v || 0), 0);
    s.score = { away: sum(s.runs.away), home: sum(s.runs.home) };
    s.over = isOver(s);
    return s;
  }

  // Regulation finish: the home team leads once it is due to bat in the last inning or later,
  // or the score is untied after a full extra or final inning.
  function isOver(s) {
    const a = s.runs.away.reduce((t, v) => t + (v || 0), 0);
    const h = s.runs.home.reduce((t, v) => t + (v || 0), 0);
    if (s.inning >= s.innings && s.half === 1 && h > a) return true;
    if (s.inning > s.innings && s.half === 0 && s.outs === 0 && h !== a) return true;
    return false;
  }

  // ----- Spray geometry -----
  function geo(loc) {
    const dx = loc[0] - HOME.x;
    const dy = HOME.y - loc[1];
    const dist = Math.hypot(dx, dy);
    const ang = Math.atan2(dx, dy) * 180 / Math.PI; // -45 = left-field line, +45 = right-field line
    return { dist, ang, ft: Math.round(dist * 5), foul: Math.abs(ang) > 45 || dy < 0, infield: dist < 26 };
  }
  function zoneName(loc) {
    if (!loc) return '';
    const g = geo(loc);
    if (g.foul) return g.ang < 0 ? 'in foul territory down the left side' : 'in foul territory down the right side';
    if (g.infield) {
      if (g.dist < 7) return 'in front of the plate';
      if (g.dist < 16 && Math.abs(g.ang) < 12) return 'the pitcher';
      if (g.ang < -27) return 'third base';
      if (g.ang < -5) return 'shortstop';
      if (g.ang <= 5) return 'up the middle';
      if (g.ang < 27) return 'second base';
      return 'first base';
    }
    if (g.ang < -27) return 'left field';
    if (g.ang < -9) return 'left-center';
    if (g.ang <= 9) return 'center field';
    if (g.ang < 27) return 'right-center';
    return 'right field';
  }
  // Field third: L, C or R (from the catcher's view).
  function third(loc) {
    const g = geo(loc);
    return g.ang < -15 ? 'L' : g.ang > 15 ? 'R' : 'C';
  }

  const ORD = ['home', '1st', '2nd', '3rd', 'home'];
  function describe(pa, nm) {
    const meta = RESULTS[pa.r] || { v: pa.r };
    let t = nm(pa.ref) + ' ' + meta.v;
    if (pa.loc && meta.bip) {
      const z = zoneName(pa.loc);
      t += z === 'up the middle' || z.startsWith('in ') ? ' ' + z : ' to ' + z;
    }
    t += '.';
    const notes = [];
    for (const m of pa.moves || []) {
      if (m.ref === pa.ref) {
        const def = defaultAdv(pa.r, [null, null, null, null]).B;
        if (m.to !== def) notes.push(nm(m.ref) + (m.to === 0 ? ' out on the play' : m.to >= 4 ? ' scores' : ' to ' + ORD[m.to]));
        continue;
      }
      if (m.to === m.from) continue;
      notes.push(nm(m.ref) + (m.to === 0 ? ' out at ' + ORD[Math.min(m.from + 1, 4)] : m.to >= 4 ? ' scores' : ' to ' + ORD[m.to]));
    }
    if (notes.length) t += ' ' + notes.join(', ') + '.';
    return t;
  }
  const WHY = { SB: 'stole', WP: 'advanced on a wild pitch', PB: 'advanced on a passed ball', BK: 'advanced on a balk', E: 'advanced on an error', CS: 'caught stealing', PO: 'picked off', ADV: 'advanced', OUT: 'out on the bases' };
  function describeRun(ev, nm) {
    return ev.moves.map((m) => {
      if (m.to === 0) return nm(m.ref) + (ev.why === 'CS' ? ' caught stealing ' + ORD[Math.min(m.from + 1, 4)] : ev.why === 'PO' ? ' picked off ' + ORD[m.from] : ' out on the bases');
      const where = m.to >= 4 ? 'home' : ORD[m.to];
      if (ev.why === 'SB') return nm(m.ref) + ' stole ' + where;
      return nm(m.ref) + (m.to >= 4 ? ' scored' : ' to ' + where) + (WHY[ev.why] && ev.why !== 'ADV' ? ' (' + WHY[ev.why].replace('advanced ', '') + ')' : '');
    }).join(', ') + '.';
  }

  function fmtIP(outs) { return Math.floor(outs / 3) + '.' + (outs % 3); }
  function rate(n, d, digits) {
    if (!d) return '—';
    const v = n / d;
    const s = v.toFixed(digits == null ? 3 : digits);
    return digits == null && v < 1 ? s.replace(/^0/, '') : s;
  }

  function addInto(t, s) { for (const k in s) t[k] = (t[k] || 0) + s[k]; return t; }

  const api = { RESULTS, HOME, FENCE, defaultAdv, replay, createState, apply, describe, describeRun, zoneName, third, geo, fmtIP, rate, emptyBat, emptyPit, addInto, other };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.GSEngine = api;
})(typeof window !== 'undefined' ? window : globalThis);
</script>

  try { const t = localStorage.getItem('gs-baseball-tab'); if (t) UI.tab = t; } catch (e) { /* per-viewer convenience only */ }
  const hashTab = (location.hash || '').slice(1);
  if (['games', 'live', 'stats', 'scout', 'team', 'chat'].includes(hashTab)) UI.tab = hashTab;

  // ---------- storage backends ----------
  const LS_KEY = 'gs-baseball-v1';
  const Backend = {
    kind: 'local', db: null,
    loadLocal() {
      try {
        const raw = localStorage.getItem(LS_KEY);
        const d = raw ? JSON.parse(raw) : null;
        Data.team = normTeam(d && d.team);
        Data.games = {};
        if (d && d.games) for (const id in d.games) Data.games[id] = normGame(d.games[id]);
        Data.opponents = {};
        if (d && d.opponents) for (const k in d.opponents) Data.opponents[k] = normRoster(d.opponents[k]);
      } catch (e) { Data.team = defaultTeam(); Data.games = {}; Data.opponents = {}; }
      Data.loaded.team = Data.loaded.games = Data.loaded.opps = true;
    },
    persistLocal() {
      try { localStorage.setItem(LS_KEY, JSON.stringify({ team: Data.team, games: Data.games, opponents: Data.opponents })); return true; } catch (e) { return false; }
    },
    async write(path, data) {
      if (this.kind !== 'local') return this.db.doc(path).set(data);
      if (!this.persistLocal()) throw { code: 'local_failed', message: 'Browser storage is unavailable' };
    },
    async remove(path) {
      if (this.kind !== 'local') return this.db.doc(path).delete();
      this.persistLocal();
    }
  };

  // One write at a time per document; bursts of taps collapse into one save.
  const Saver = {
    q: new Map(), deleting: new Set(), err: null,
    busy(path) { return this.q.has(path); },
    put(path, data) {
      let e = this.q.get(path);
      if (!e) { e = { inflight: false, dirty: false, t: 0 }; this.q.set(path, e); }
      e.data = data; e.dirty = true;
      clearTimeout(e.t);
      e.t = setTimeout(() => this.flush(path), Backend.kind === 'db' ? 300 : 30);
      syncPill();
    },
    async flush(path) {
      const e = this.q.get(path);
      if (!e || e.inflight || !e.dirty) return;
      e.inflight = true; e.dirty = false;
      const body = clone(e.data);
      try { await Backend.write(path, body); this.err = null; } catch (err) { await this.fail(err, path, body); }
      e.inflight = false;
      if (e.dirty) return this.flush(path);
      this.q.delete(path);
      syncPill();
    },
    async fail(err, path, body) {
      if (err && err.code === 'unavailable') {
        await sleep(400 + Math.random() * 700);
        try { await Backend.write(path, body); return; } catch (e2) { err = e2; }
      }
      this.err = err;
      const code = err && err.code;
      if (code === 'permission_denied') {
        if (Access.isAdmin) toast('The database refused the save. Check that the security rules are published in Firebase.');
        else { UI.readOnly = true; toast('Only coaches can make changes.'); render(); }
      } else if (code === 'invalid_argument' && UI.canWrite !== true) {
        UI.readOnly = true;
        toast('This page is view-only for you. The team owner records games.');
        render();
      } else if (code === 'quota_exceeded') toast('Storage is full. Delete old games to make room.');
      else if (code === 'local_failed') toast('This browser blocked saving. Export a backup from the Team tab.');
      else if (code === 'revoked') toast('Access to this team changed. Reload to continue.');
      else toast('Could not save. Check your connection and try again.');
    }
  };
  const saveTeam = () => Saver.put('team/main', Data.team);
  function saveGame(g) { g.updatedAt = Date.now(); Saver.put('games/' + g.id, g); }
  async function removePath(path, what) {
    const e = Saver.q.get(path);
    if (e) clearTimeout(e.t);
    Saver.q.delete(path);
    Saver.deleting.add(path);
    try { await Backend.remove(path); } catch (err) { toast('Could not delete that ' + what + '.'); }
    Saver.deleting.delete(path);
    syncPill();
  }
  function removeGame(id) { delete Data.games[id]; return removePath('games/' + id, 'game'); }
  function removeRoster(key) { delete Data.opponents[key]; return removePath('opponents/' + key, 'roster'); }
  function saveRoster(doc) { doc.updatedAt = Date.now(); const k = oppKey(doc.name); Data.opponents[k] = doc; Saver.put('opponents/' + k, doc); }

  // ---------- derived ----------
  const RC = new Map();
  function st(g) {
    const key = [g.events.length, g.updatedAt || 0, g.lineup.join(','), g.oppLineup.length, g.ourPitcher || '', g.oppPitcher || '', g.innings, g.home ? 1 : 0].join('|');
    const c = RC.get(g.id);
    if (c && c.key === key) return c.s;
    const s = E.replay(g);
    RC.set(g.id, { key, s });
    return s;
  }
  const gamesList = () => Object.values(Data.games).sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || '')));
  const playerById = (id) => Data.team.players.find((p) => p.id === id);
  const sortedRoster = () => Data.team.players.slice().sort((a, b) => (parseInt(a.num, 10) || 999) - (parseInt(b.num, 10) || 999) || a.name.localeCompare(b.name));
  const oppEntry = (g, ref) => g.oppLineup.find((o) => o.id === ref) || g.oppSubs.find((o) => o.id === ref);
  function oppLabel(g, o) {
    const parts = [];
    if (o.num) parts.push('#' + o.num);
    if (o.name) parts.push(o.name);
    if (parts.length) return parts.join(' ');
    const i = g.oppLineup.indexOf(o);
    return i >= 0 ? 'Batter ' + (i + 1) : 'Sub batter';
  }
  function shortName(n) { const p = String(n || '').trim().split(/\s+/); return p.length > 1 ? p[0][0] + '. ' + p.slice(1).join(' ') : n || 'Player'; }
  function refName(g, ref, full) {
    if (!ref) return '—';
    if (ref[0] === '~') return ref.slice(1) || 'Opponent pitcher';
    const p = playerById(ref);
    if (p) return full ? p.name : shortName(p.name);
    const o = oppEntry(g, ref);
    if (o) return oppLabel(g, o);
    return 'Unknown player';
  }
  function refNum(ref) { const p = playerById(ref); return p && p.num ? '#' + p.num : ''; }
  function batsOf(g, ref) { const p = playerById(ref); if (p) return p.bats || ''; const o = oppEntry(g, ref); return o ? o.bats || '' : ''; }
  const sideNames = (g) => (g.home ? { away: g.opponent, home: Data.team.name } : { away: Data.team.name, home: g.opponent });
  function result(g) {
    const s = st(g);
    const us = s.score[s.us], them = s.score[s.them];
    return { us, them, chip: us > them ? 'w' : us < them ? 'l' : '', letter: us > them ? 'W' : us < them ? 'L' : 'T' };
  }
  function liveGame() {
    const g = UI.liveId && Data.games[UI.liveId];
    if (g && g.status === 'live') return g;
    const live = gamesList().filter((x) => x.status === 'live');
    return live.length ? live[live.length - 1] : null;
  }
  const canEdit = () => !UI.readOnly;
  const hasSample = () => Data.team.players.some((p) => p.sample) || Object.values(Data.games).some((g) => g.sample);
  const innLabel = (s) => (s.half === 0 ? 'Top ' : 'Bottom ') + ORDN(s.inning);

  // ---------- small UI helpers ----------
  let toastT = 0;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastT);
    toastT = setTimeout(() => { t.hidden = true; }, 2600);
  }
  function syncPill() {
    const el = $('#sync');
    if (!UI.ready) { el.hidden = true; return; }
    el.hidden = false;
    let s, t;
    if (UI.readOnly) { s = 'follow'; t = 'Following'; }
    else if (Saver.q.size || Saver.deleting.size) { s = 'saving'; t = 'Saving…'; }
    else if (Saver.err) { s = 'error'; t = 'Not saved'; }
    else if (Backend.kind === 'local') { s = 'local'; t = 'This device'; }
    else { s = 'saved'; t = 'Synced'; }
    el.dataset.s = s;
    el.textContent = t;
  }
  let rafId = 0;
  function scheduleRender() { if (!rafId) rafId = requestAnimationFrame(() => { rafId = 0; render(); }); }

  // ---------- field drawing ----------
  let svgN = 0;
  function fieldSVG(opts) {
    const o = opts || {};
    const n = ++svgN;
    const H = E.HOME, R = E.FENCE, a = Math.PI / 4;
    const lx = +(H.x - R * Math.sin(a)).toFixed(2), py = +(H.y - R * Math.cos(a)).toFixed(2), rx = +(H.x + R * Math.sin(a)).toFixed(2);
    const wedge = `M${H.x},${H.y} L${lx},${py} A${R},${R} 0 0,1 ${rx},${py} Z`;
    const tr = R - 1.4;
    const tlx = +(H.x - tr * Math.sin(a)).toFixed(2), tpy = +(H.y - tr * Math.cos(a)).toFixed(2), trx = +(H.x + tr * Math.sin(a)).toFixed(2);
    const b = 12.73;
    const B1 = [H.x + b, H.y - b], B2 = [H.x, H.y - 2 * b], B3 = [H.x - b, H.y - b];
    const cx = H.x, cy = H.y - b;
    const ig = [[H.x, H.y], B1, B2, B3].map(([x, y]) => [cx + (x - cx) * 0.74, cy + (y - cy) * 0.74].map((v) => v.toFixed(2)).join(',')).join(' ');
    const bag = ([x, y]) => `<rect class="bag" x="${x - 0.85}" y="${y - 0.85}" width="1.7" height="1.7" transform="rotate(45 ${x} ${y})"/>`;
    let marks = '';
    if (o.heat && o.points && o.points.length) {
      marks += `<g class="heat" filter="url(#blur${n})" clip-path="url(#all${n})">` + o.points.map((p) => `<circle cx="${p.loc[0]}" cy="${p.loc[1]}" r="6" opacity="${Math.min(0.5, 0.18 + 1.2 / o.points.length)}"/>`).join('') + '</g>';
    } else if (o.points) {
      for (const p of o.points) {
        const m = E.RESULTS[p.r] || {};
        const cls = m.hit ? 'dot-hit' : p.r === 'E' || p.r === 'FC' ? 'dot-reach' : 'dot-out';
        marks += `<circle class="${cls}" cx="${p.loc[0]}" cy="${p.loc[1]}" r="${m.hit ? 1.7 : 1.45}"><title>${esc((m.n || p.r) + (p.label ? ' · ' + p.label : ''))}</title></circle>`;
      }
    }
    if (o.marker) marks += `<circle class="marker-ring" cx="${o.marker[0]}" cy="${o.marker[1]}" r="3.4"/><circle class="marker" cx="${o.marker[0]}" cy="${o.marker[1]}" r="1.9"/>`;
    return `<svg class="field" viewBox="0 6 100 78" role="img" aria-label="${esc(o.label || 'Baseball field spray chart')}" ${o.tap ? 'data-act="fieldTap"' : ''}>
      <defs><clipPath id="fair${n}"><path d="${wedge}"/></clipPath><clipPath id="all${n}"><rect x="0" y="6" width="100" height="78"/></clipPath>
      <filter id="blur${n}" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.4"/></filter></defs>
      <rect class="foul-g" x="0" y="6" width="100" height="78"/>
      <path class="fair" d="${wedge}"/>
      <path class="track" d="M${tlx},${tpy} A${tr},${tr} 0 0,1 ${trx},${tpy}"/>
      <g clip-path="url(#fair${n})"><circle class="dirt" cx="${H.x}" cy="${(H.y - 12.1).toFixed(2)}" r="19.5"/></g>
      <polygon class="igrass" points="${ig}"/>
      <circle class="dirt" cx="${H.x}" cy="${H.y}" r="4.2"/>
      <circle class="dirt" cx="${H.x}" cy="${(H.y - 12.1).toFixed(2)}" r="1.9"/>
      <path class="chalk" d="M${H.x},${H.y} L${lx},${py} M${H.x},${H.y} L${rx},${py}"/>
      ${bag(B1)}${bag(B2)}${bag(B3)}
      <path class="bag" d="M${H.x - 0.8},${H.y - 0.6} h1.6 v0.8 l-0.8,0.8 l-0.8,-0.8z"/>
      ${marks}
    </svg>`;
  }
  const legend = () => '<div class="legend"><span><i class="lh"></i>Hit</span><span><i class="lo"></i>Out</span><span><i class="lr"></i>Error / fielder\'s choice</span></div>';

  function diamondSVG(s, g) {
    const pos = { 1: [98, 54], 2: [60, 16], 3: [22, 54] };
    let h = `<svg class="diamond" viewBox="0 0 120 104" aria-label="Runners on base"><path class="path" d="M60 92 L98 54 L60 16 L22 54 Z"/>`;
    for (const b of [1, 2, 3]) {
      const [x, y] = pos[b];
      const rn = s.bases[b];
      h += `<rect class="base${rn ? ' on' : ''}" x="${x - 8}" y="${y - 8}" width="16" height="16" transform="rotate(45 ${x} ${y})"/>`;
      if (rn) {
        const lbl = refNum(rn.ref) || refName(g, rn.ref).split(' ')[0];
        h += `<text x="${x}" y="${b === 2 ? y + 22 : y + 24}">${esc(lbl.slice(0, 7))}</text>`;
      }
    }
    h += `<path class="base" d="M53 86 h14 v6 l-7 7 l-7 -7z"/></svg>`;
    return h;
  }

  // ---------- tendencies ----------
  function tendencies(pas, bats) {
    const fair = pas.filter((p) => p.loc && !E.geo(p.loc).foul);
    const t = { n: fair.length, all: pas.length, L: 0, C: 0, R: 0, G: 0, Ln: 0, F: 0, P: 0, of: 0, ofFt: 0 };
    for (const p of fair) {
      t[E.third(p.loc)]++;
      const bt = p.bt || 'G';
      if (bt === 'G') t.G++; else if (bt === 'L') t.Ln++; else if (bt === 'F') t.F++; else t.P++;
      const gg = E.geo(p.loc);
      if (!gg.infield) { t.of++; t.ofFt += gg.ft; }
    }
    t.bats = bats;
    t.pullSide = bats === 'R' ? 'L' : bats === 'L' ? 'R' : null;
    return t;
  }
  function tipsFor(t) {
    const tips = [];
    if (t.n < 4) { tips.push(`Only ${t.n} charted ball${t.n === 1 ? '' : 's'} in play so far. Play straight up and keep charting.`); return tips; }
    const side = { L: 'left', R: 'right' };
    const pullSide = t.pullSide || (t.L >= t.R ? 'L' : 'R');
    const oppSide = pullSide === 'L' ? 'R' : 'L';
    const pullP = pct(t[pullSide], t.n), oppP = pct(t[oppSide], t.n);
    const inf = pullSide === 'L' ? 'toward third base' : 'toward first base';
    if (pullP >= 55) tips.push(`${t.pullSide ? 'Pull hitter' : 'Favors the ' + side[pullSide] + ' side'}: ${pullP}% of balls go to the ${side[pullSide]} side. Shade the infield ${inf} and swing the outfield toward ${side[pullSide]} field.`);
    else if (oppP >= 40) tips.push(`Uses the ${t.pullSide ? 'opposite field' : side[oppSide] + ' side'}: ${oppP}% go to ${side[oppSide]}. Play the outfield straight away or shade toward ${side[oppSide]}.`);
    else tips.push(`Sprays the ball around (${pct(t.L, t.n)}% left, ${pct(t.C, t.n)}% center, ${pct(t.R, t.n)}% right). Play straight up.`);
    const gb = pct(t.G, t.n), air = pct(t.Ln + t.F, t.n);
    if (gb >= 55) tips.push(`Ground-ball hitter (${gb}%). Keep the middle infielders at double-play depth with a runner on first.`);
    else if (air >= 60) tips.push(`Gets the ball in the air (${air}% liners and flies). Play the outfield a few steps deeper.`);
    if (t.of >= 3) {
      const avg = Math.round(t.ofFt / t.of);
      if (avg < 210) tips.push(`Outfield balls average about ${avg} ft. The outfield can play shallow.`);
      else if (avg > 270) tips.push(`Outfield balls average about ${avg} ft. Respect the gaps and the fence.`);
    }
    return tips;
  }
  function stackbar(parts) {
    const total = parts.reduce((s, p) => s + p[1], 0);
    if (!total) return '<div class="stackbar"></div>';
    return '<div class="stackbar">' + parts.map((p, i) => {
      const w = (p[1] * 100) / total;
      return w > 0 ? `<span class="s${i + 1}" style="width:${w.toFixed(1)}%" title="${esc(p[0])} ${Math.round(w)}%">${w >= 14 ? esc(p[0]) + ' ' + Math.round(w) + '%' : ''}</span>` : '';
    }).join('') + '</div>';
  }
  function tendHTML(t) {
    return `<div class="tend">
      <div class="tend-row"><span class="lbl">Direction</span>${stackbar([['L', t.L], ['C', t.C], ['R', t.R]])}</div>
      <div class="tend-row"><span class="lbl">Contact</span>${stackbar([['GB', t.G], ['LD', t.Ln], ['FB', t.F], ['PU', t.P]])}</div>
      <div class="small muted">${t.n} charted ball${t.n === 1 ? '' : 's'} in play${t.bats ? ' · bats ' + esc(t.bats) : ''}. L/C/R from the catcher's view.</div>
    </div>`;
  }

  // ---------- renders ----------
  function render() {
    $('#team-name').textContent = Data.team.name || 'GS Baseball';
    syncPill();
    for (const b of document.querySelectorAll('#tabs button')) {
      if (b.dataset.tab === UI.tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    }
    $('#live-dot').hidden = !Object.values(Data.games).some((g) => g.status === 'live');
    if (UI.tab === 'chat' && Backend.kind !== 'fb' && UI.ready) UI.tab = 'games';
    $('#chat-tab').hidden = !chatAllowed();
    $('#chat-dot').hidden = !(UI.tab !== 'chat' && chatUnread());
    const chatOn = UI.tab === 'chat' && chatAllowed();
    $('#chat-bar').hidden = !chatOn;
    document.body.classList.toggle('chat-on', chatOn);
    const nearBottom = chatOn && (Chat.forceBottom || window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 140);
    const v = $('#view');
    const gated = Backend.kind === 'fb' && Access.evaluated && !Access.canView;
    document.body.classList.toggle('gated', gated);
