    if (!UI.ready) { v.innerHTML = `<div class="loading"><img src="${LOGO}" alt=""><div>Loading your team…</div></div>`; return; }
    let h = '';
    try {
      if (UI.tab === 'games') h = renderGames();
      else if (UI.tab === 'live') h = renderLive();
      else if (UI.tab === 'stats') h = renderStats();
      else if (UI.tab === 'scout') h = renderScout();
      else if (UI.tab === 'chat') h = renderChat();
      else h = renderTeam();
    } catch (err) {
      console.error(err);
      h = `<div class="card empty"><h3>Something went wrong showing this screen</h3><p>${esc(err && err.message)}</p></div>`;
    }
    v.innerHTML = h;
    if (chatOn) {
      if (nearBottom && Chat.loaded) { Chat.forceBottom = false; window.scrollTo(0, document.documentElement.scrollHeight); }
      chatMarkSeen();
    }
    try { renderDock(); } catch (err) { console.error(err); }
    if (Cam.open) camBug();
  }

  function sampleBanner() {
    if (!hasSample() || !canEdit()) return '';
    return `<div class="banner"><span class="grow">You're looking at <b>sample games and players</b> so you can see how everything works. Clear them when you're ready to add your own team.</span><button class="btn sm" data-act="clearSample">Clear sample data</button></div>`;
  }

  function gameRow(g, startBtn) {
    const d = parseDate(g.date);
    const opp = (g.home ? 'vs ' : '@ ') + g.opponent;
    let res = '';
    if (g.status === 'final') { const r = result(g); res = `<span class="chip ${r.chip}">${r.letter}</span><span class="num">${r.us}–${r.them}</span>`; }
    else if (g.status === 'live') { const s = st(g); const r = result(g); res = `<span class="chip live">LIVE</span><span class="num">${r.us}–${r.them}</span><span class="small muted">${s.half ? '▼' : '▲'}${s.inning}</span>`; }
    else res = `<span class="small muted">${esc(fmtTime(g.time) || 'TBD')}</span>`;
    const meta = [fmtTime(g.time), g.location].filter(Boolean).join(' · ') || (g.home ? 'Home' : 'Away');
    if (startBtn) res = `<button class="btn sm primary" data-act="lineup" data-id="${esc(g.id)}" data-start="1">Start</button>`;
    return `<${startBtn ? 'div' : 'button'} class="game-row" ${startBtn ? 'style="cursor:default"' : `data-act="openGame" data-id="${esc(g.id)}"`}>
      <span class="gr-date"><span>${d.toLocaleDateString(undefined, { weekday: 'short' }).toUpperCase()}</span><span class="d">${d.getDate()}</span><span>${d.toLocaleDateString(undefined, { month: 'short' }).toUpperCase()}</span></span>
      <span style="min-width:0"><span class="gr-opp" style="display:block">${esc(opp)} ${g.sample ? '<span class="chip sample">Sample</span>' : ''}</span><span class="gr-meta" style="display:block">${esc(meta)}</span></span>
      <span class="gr-res">${res}</span></${startBtn ? 'div' : 'button'}>`;
  }

  function renderGames() {
    if (UI.gameId && Data.games[UI.gameId]) return renderGameDetail(Data.games[UI.gameId]);
    UI.gameId = null;
    const games = gamesList();
    const live = games.filter((g) => g.status === 'live');
    const upcoming = games.filter((g) => g.status === 'scheduled');
    const finals = games.filter((g) => g.status === 'final').reverse();
    let w = 0, l = 0, t = 0, rf = 0, ra = 0;
    for (const g of finals) { const r = result(g); rf += r.us; ra += r.them; if (r.us > r.them) w++; else if (r.us < r.them) l++; else t++; }
    let h = sampleBanner();
    const next = upcoming[0];
    h += `<section class="board season"><span class="lbl">Season record</span>
      <span class="rec num">${w}<small>–</small>${l}${t ? '<small>–</small>' + t : ''}</span>
      <span class="facts"><span>Runs <b class="num">${rf}</b> for · <b class="num">${ra}</b> against</span>${next ? `<span>Next: <b>${esc(longDate(next.date))}</b> ${next.home ? 'vs' : '@'} <b>${esc(next.opponent)}</b></span>` : `<span>${finals.length} game${finals.length === 1 ? '' : 's'} played</span>`}</span></section>`;
    if (canEdit()) h += `<button class="btn primary block" data-act="newGame">+ New game</button>`;
    if (!games.length) {
      h += `<div class="card empty"><img src="${LOGO}" alt=""><h3>No games yet</h3><p>Add your first game, set the lineup, and score it pitch by pitch. Stats, spray charts and scouting fill in as you go.</p></div>`;
      return h;
    }
    if (live.length) h += `<h2 class="sec">Live now</h2><div class="list">${live.map(gameRow).join('')}</div>`;
    if (upcoming.length) h += `<h2 class="sec">Upcoming</h2><div class="list">${upcoming.map(gameRow).join('')}</div>`;
    if (finals.length) h += `<h2 class="sec">Results</h2><div class="list">${finals.map(gameRow).join('')}</div>`;
    return h;
  }

  function lineScore(g, s) {
    const names = sideNames(g);
    let cols = Math.max(g.innings, s.runs.away.length, s.runs.home.length);
    const fresh = s.halfEvents === 0 && s.outs === 0;
    if (g.status === 'final' && fresh && s.half === 0 && s.inning > g.innings) cols = Math.max(g.innings, s.inning - 1);
    const homeX = g.status === 'final' && fresh && s.half === 1;
    let head = '<th></th>';
    for (let i = 1; i <= cols; i++) head += `<th>${i}</th>`;
    head += '<th class="tot">R</th><th>H</th><th>E</th>';
    const row = (side) => {
      let r = `<td class="tm">${esc(names[side])}</td>`;
      for (let i = 0; i < cols; i++) {
        let v = s.runs[side][i];
        if (side === 'home' && homeX && i === s.inning - 1) { r += '<td class="x">X</td>'; continue; }
        r += `<td>${v == null || g.status === 'scheduled' ? '' : v}</td>`;
      }
      r += `<td class="tot r">${g.status === 'scheduled' ? '' : s.score[side]}</td><td>${g.status === 'scheduled' ? '' : s.hits[side]}</td><td>${g.status === 'scheduled' ? '' : s.errs[side]}</td>`;
      return `<tr>${r}</tr>`;
    };
    return `<div class="linescore-wrap"><table class="linescore num"><thead><tr>${head}</tr></thead><tbody>${row('away')}${row('home')}</tbody></table></div>`;
  }

  function batRows(g, s, side) {
    const t = E.emptyBat();
    const rows = s.batOrder[side].filter((ref) => s.bat[ref] && s.bat[ref].PA > 0).map((ref) => {
      const b = s.bat[ref];
      E.addInto(t, b);
      const nm = playerById(ref) ? `<span class="pnum">${esc(refNum(ref))}</span>${esc(refName(g, ref))}` : esc(refName(g, ref));
      return `<tr><td>${nm}</td><td>${b.AB}</td><td>${b.R}</td><td>${b.H}</td><td>${b.RBI}</td><td>${b.BB}</td><td>${b.K}</td></tr>`;
    });
    if (!rows.length) return '<p class="muted small">No plate appearances yet.</p>';
    return `<div class="tbl-wrap"><table class="st"><thead><tr><th>Batter</th><th>AB</th><th>R</th><th>H</th><th>RBI</th><th>BB</th><th>K</th></tr></thead><tbody>${rows.join('')}<tr class="tot"><td>Totals</td><td>${t.AB}</td><td>${t.R}</td><td>${t.H}</td><td>${t.RBI}</td><td>${t.BB}</td><td>${t.K}</td></tr></tbody></table></div>`;
  }
  function pitRows(g, s) {
    const names = sideNames(g);
    const rows = [];
    for (const side of [s.us, s.them]) {
      for (const ref of s.pitOrder[side]) {
        const p = s.pit[ref];
        if (!p || (!p.PC && !p.BF)) continue;
        rows.push(`<tr><td>${esc(refName(g, ref))} <span class="pnum">${esc(side === s.us ? '' : names[side])}</span></td><td>${E.fmtIP(p.OUTS)}</td><td>${p.H}</td><td>${p.R}</td><td>${p.ER}</td><td>${p.BB}</td><td>${p.K}</td><td>${p.PC}</td></tr>`);
      }
    }
    if (!rows.length) return '<p class="muted small">No pitches recorded yet.</p>';
    return `<div class="tbl-wrap"><table class="st"><thead><tr><th>Pitcher</th><th>IP</th><th>H</th><th>R</th><th>ER</th><th>BB</th><th>K</th><th>PC</th></tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
  }

  function playItems(g, s) {
    const names = sideNames(g);
    const groups = [];
    let cur = { inn: 1, half: 0, items: [] };
    groups.push(cur);
    const sc = { away: 0, home: 0 };
    const nm = (r) => refName(g, r);
    for (const L of s.log) {
      if (L.k === 'half') { cur = { inn: L.inn, half: L.half, items: [] }; groups.push(cur); continue; }
      let tag = '', text = '', runs = 0, side = null;
      if (L.k === 'pa') { tag = L.pa.r; text = E.describe(L.pa, nm); runs = L.pa.runs; side = L.pa.side; }
      else if (L.k === 'run') { tag = L.why === 'ADV' ? 'RUN' : L.why; text = L.moves.length ? E.describeRun(L, nm) : 'Runners held.'; runs = L.runs; side = L.side; }
      else if (L.k === 'pc') { tag = 'PC'; text = `Pitching change: ${refName(g, L.ref)} now pitching for ${names[L.side]}.`; }
      else if (L.k === 'sub') { tag = 'SUB'; text = `${refName(g, L.ref)} bats in the ${ORDN(L.slot + 1)} spot for ${refName(g, L.prev)}.`; }
      if (runs && side) sc[side] += runs;
      cur.items.push({ tag, text, score: runs ? `${names.away.slice(0, 12)} ${sc.away}, ${names.home.slice(0, 12)} ${sc.home}` : '' , inn: cur.inn, half: cur.half });
    }
    return groups;
  }

  function renderPlays(g, s) {
    const names = sideNames(g);
    const groups = playItems(g, s).filter((x) => x.items.length);
    if (!groups.length) return '<p class="muted small">No plays yet.</p>';
    return groups.map((gr) => `<div class="inning-head">${gr.half ? 'Bottom' : 'Top'} ${ORDN(gr.inn)} · ${esc(names[gr.half ? 'home' : 'away'])} batting</div><div class="plays">` +
      gr.items.map((it) => `<div class="play"><span class="tag">${esc(it.tag)}</span><span>${esc(it.text)}${it.score ? `<span class="scr">${esc(it.score)}</span>` : ''}</span></div>`).join('') + '</div>').join('');
  }

  function renderGameDetail(g) {
    const s = st(g);
    let status = g.status === 'final' ? 'Final' : g.status === 'live' ? 'Live · ' + innLabel(s) : 'Scheduled' + (g.time ? ' · ' + fmtTime(g.time) : '');
    let h = `<div class="row"><button class="btn ghost" data-act="back">‹ All games</button><span class="grow"></span>${g.sample ? '<span class="chip sample">Sample</span>' : ''}</div>`;
    h += `<section class="board stack"><span class="lbl">${esc(status)} · ${esc(longDate(g.date))}${g.location ? ' · ' + esc(g.location) : ''}</span>${lineScore(g, s)}</section>`;
    if (canEdit()) {
      const a = [];
      if (g.status === 'scheduled') a.push(`<button class="btn primary" data-act="lineup" data-id="${g.id}" data-start="1">Set lineup &amp; start</button>`);
      if (g.status === 'live') a.push(`<button class="btn primary" data-act="resume" data-id="${g.id}">Resume scoring</button>`, `<button class="btn" data-act="lineup" data-id="${g.id}">Lineups</button>`, `<button class="btn" data-act="finish" data-id="${g.id}">Finish game</button>`);
      if (g.status === 'final') a.push(`<button class="btn" data-act="reopen" data-id="${g.id}">Reopen scoring</button>`, `<button class="btn" data-act="lineup" data-id="${g.id}">Lineups</button>`);
      a.push(`<button class="btn" data-act="editGame" data-id="${g.id}">Edit details</button>`, `<button class="btn danger" data-act="deleteGame" data-id="${g.id}">Delete</button>`);
      h += `<div class="row">${a.join('')}</div>`;
    }
    if (g.status === 'scheduled' && !g.events.length) {
      h += `<div class="card empty"><h3>${esc(g.home ? 'vs ' : '@ ')}${esc(g.opponent)}</h3><p>${esc(longDate(g.date))}${g.time ? ' at ' + esc(fmtTime(g.time)) : ''}. Set both lineups, then score the game from the Live tab.</p></div>`;
      return h;
    }
    const tabs = [['box', 'Box score'], ['plays', 'Plays'], ['spray', 'Spray chart']];
    h += `<div><div class="seg" role="group">${tabs.map(([k, l]) => `<button data-act="gameTab" data-k="${k}" aria-pressed="${UI.gameTab === k}">${l}</button>`).join('')}</div></div>`;
    const names = sideNames(g);
    if (UI.gameTab === 'plays') h += `<div class="card" style="padding:4px 14px 12px">${renderPlays(g, s)}</div>`;
    else if (UI.gameTab === 'spray') {
      const side = UI.sprayWho === 'us' ? s.us : s.them;
      const pts = s.pas.filter((p) => p.side === side && p.loc).map((p) => ({ loc: p.loc, r: p.r, label: refName(g, p.ref) }));
      h += `<div class="card stack" style="padding:14px"><div class="seg">${[['us', Data.team.name], ['them', g.opponent]].map(([k, l]) => `<button data-act="sprayWho" data-k="${k}" aria-pressed="${UI.sprayWho === k}">${esc(l)}</button>`).join('')}</div>
        ${fieldSVG({ points: pts, label: 'Spray chart for ' + (UI.sprayWho === 'us' ? Data.team.name : g.opponent) })}${legend()}
        <p class="small muted" style="margin:0">${pts.length} charted ball${pts.length === 1 ? '' : 's'} in play. Each dot marks where a ball was fielded or landed.</p></div>`;
    } else {
      h += `<h2 class="sec">${esc(names.away)} batting</h2>${batRows(g, s, 'away')}<h2 class="sec">${esc(names.home)} batting</h2>${batRows(g, s, 'home')}<h2 class="sec">Pitching</h2>${pitRows(g, s)}`;
    }
    return h;
  }

  // ----- live -----
  function lamps(n, total, cls) { let h = ''; for (let i = 0; i < total; i++) h += `<span class="lamp ${cls}${i < n ? ' on' : ''}"></span>`; return h; }
  function todayLine(b) {
    if (!b || !b.PA) return 'First trip to the plate today';
    const extra = [];
    if (b.HR) extra.push(b.HR > 1 ? b.HR + ' HR' : 'HR');
    if (b['2B']) extra.push(b['2B'] > 1 ? b['2B'] + ' 2B' : '2B');
    if (b.BB) extra.push(b.BB > 1 ? b.BB + ' BB' : 'BB');
    if (b.RBI) extra.push(b.RBI + ' RBI');
    if (b.K) extra.push(b.K > 1 ? b.K + ' K' : 'K');
    return `${b.H}-for-${b.AB} today${extra.length ? ', ' + extra.join(', ') : ''}`;
  }
  // ----- live video -----
  function videoEmbed(raw) {
    const t = String(raw || '').trim();
    if (!t) return null;
    const yt = (id) => ({ kind: 'yt', src: 'https://www.youtube.com/embed/' + id + '?autoplay=1&mute=1&playsinline=1&rel=0', watch: 'https://www.youtube.com/watch?v=' + id });
    const ch = (id) => ({ kind: 'yt', channel: true, src: 'https://www.youtube.com/embed/live_stream?channel=' + id + '&autoplay=1&mute=1&playsinline=1', watch: 'https://www.youtube.com/channel/' + id + '/live' });
    let m = t.match(/^(UC[\w-]{22})$/);
    if (m) return ch(m[1]);
    let u;
    try { u = new URL(/^https?:\/\//i.test(t) ? t : 'https://' + t); } catch (e) { return null; }
    const host = u.hostname.replace(/^(www\.|m\.)/, '');
    if (host === 'youtu.be') { const id = u.pathname.slice(1, 12); return /^[\w-]{11}$/.test(id) ? yt(id) : null; }
    if (host === 'youtube.com' || host === 'youtube-nocookie.com') {
      const v = u.searchParams.get('v');
      if (v && /^[\w-]{11}$/.test(v)) return yt(v);
      if ((m = u.pathname.match(/^\/(?:live|embed|shorts)\/([\w-]{11})(?:[/?]|$)/))) return yt(m[1]);
      if ((m = u.pathname.match(/^\/channel\/(UC[\w-]{22})/))) return ch(m[1]);
      const cid = u.searchParams.get('channel');
      if (u.pathname.startsWith('/embed/live_stream') && cid && /^UC[\w-]{22}$/.test(cid)) return ch(cid);
      if (u.pathname.startsWith('/@')) return { kind: 'handle' };
      return null;
    }
    if (u.protocol === 'https:') return { kind: 'other', src: u.href, watch: u.href };
    return null;
  }
  const VIDEO_PREF = 'gs-baseball-video';
  function videoPrefs() { try { return Object.assign({ delay: 0, coachShow: false }, JSON.parse(localStorage.getItem(VIDEO_PREF) || '{}')); } catch (e) { return { delay: 0, coachShow: false }; } }
  function setVideoPrefs(p) { try { localStorage.setItem(VIDEO_PREF, JSON.stringify(Object.assign(videoPrefs(), p))); } catch (e) { /* per-viewer convenience only */ } }
  function gameVideo(g) {
    const st2 = Data.stream;
    if (g && st2 && st2.live && st2.gid === g.id && st2.whep && UI.standalone) return { kind: 'cf', src: 'cf:' + st2.whep, whep: st2.whep };
    const e = videoEmbed(g && g.video) || videoEmbed(Data.team.video);
    return e && e.kind !== 'handle' ? e : null;
  }
  // Families can hold the scoreboard back to match the video's delay.
  const DC = { id: null, n: -1, s: null };
  function delayedCount(g, delay) {
    const cutoff = Date.now() - delay * 1000;
    const ev = g.events;
    let n = ev.length;
    while (n > 0 && ev[n - 1].ts && ev[n - 1].ts > cutoff) n--;
    return n;
  }
  function viewState(g) {
    const delay = UI.readOnly ? videoPrefs().delay : 0;
    const gv = delay ? gameVideo(g) : null;
    if (!delay || !gv || gv.kind === 'cf') return st(g);
    const n = delayedCount(g, delay);
    if (n === g.events.length) return st(g);
    if (DC.id !== g.id || DC.n !== n || DC.v !== g.updatedAt) { DC.id = g.id; DC.n = n; DC.v = g.updatedAt; DC.s = E.replay(g, n); }
    return DC.s;
  }
  let dockSrc = null;
  function renderDock() {
    const dock = $('#video-dock');
    const g = UI.ready && UI.tab === 'live' ? liveGame() : null;
    const vid = g ? gameVideo(g) : null;
    const prefs = videoPrefs();
    const show = !!vid && (UI.readOnly || prefs.coachShow);
    if (!show) { if (!dock.hidden) { dock.hidden = true; dock.innerHTML = ''; dockSrc = null; } playerStop(); return; }
    const s = viewState(g);
    const names = sideNames(g);
    const short = (n) => esc(String(n || '').split(/\s+/)[0].slice(0, 10).toUpperCase());
    const outs = [0, 1].map((i) => `<i class="${i < s.outs ? 'on' : ''}"></i>`).join('');
    const bug = `<span class="bug-teams"><span>${short(names.away)} <b>${s.score.away}</b></span><span>${short(names.home)} <b>${s.score.home}</b></span></span><span class="bug-inn">${s.half ? '▼' : '▲'}${s.inning}</span><span class="bug-count">${s.balls}-${s.strikes}</span><span class="bug-outs" aria-label="${s.outs} outs">${outs}</span>`;
    if (!UI.standalone) {
      dock.hidden = false;
      dock.innerHTML = `<div class="card stack" style="padding:12px 14px"><div class="row"><span class="grow">This game is streaming on YouTube.</span><a class="btn sm primary" href="${esc(vid.watch)}" target="_blank" rel="noopener">Watch</a></div></div>`;
      dockSrc = null;
      return;
    }
    if (dockSrc !== vid.src) {
      dock.hidden = false;
      playerStop();
      if (vid.kind === 'cf') {
        dock.innerHTML = `<div class="video-box"><video id="dock-video" playsinline autoplay muted></video><div class="bug" id="video-bug"></div><div class="dock-msg" id="dock-msg">Connecting to the live video…</div><button class="unmute" id="dock-unmute" data-act="dockUnmute">Tap for sound</button></div><div class="video-tools" id="video-tools"></div>`;
        playerStart(vid.whep, $('#dock-video'));
      } else {
        dock.innerHTML = `<div class="video-box"><iframe src="${esc(vid.src)}" title="Live video" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe><div class="bug" id="video-bug"></div></div><div class="video-tools" id="video-tools"></div>`;
      }
      dockSrc = vid.src;
    }
    $('#video-bug').innerHTML = bug;
    if (vid.kind === 'cf') {
      $('#video-tools').innerHTML = '<span class="small muted grow">Live from the field, less than a second behind.</span>';
      return;
    }
    const delays = [[0, 'Live'], [10, '10s'], [20, '20s'], [30, '30s']];
    $('#video-tools').innerHTML = (UI.readOnly
      ? `<span class="small muted">Score delay</span><div class="seg">${delays.map(([v, l]) => `<button data-act="videoDelay" data-v="${v}" aria-pressed="${prefs.delay === v}">${l}</button>`).join('')}</div>`
      : '<span class="small muted grow">You see the live score; families can match it to the video delay.</span>')
      + `<a class="btn ghost sm" href="${esc(vid.watch)}" target="_blank" rel="noopener">Open in YouTube</a>`;
  }
  let delayTick = 0;
  setInterval(() => {
    if (UI.tab !== 'live' || !UI.readOnly || !videoPrefs().delay) return;
    const g = liveGame();
    if (!g || !gameVideo(g)) return;
    const n = delayedCount(g, videoPrefs().delay);
    if (n !== delayTick) { delayTick = n; render(); }
  }, 1000);

  function renderLive() {
    const g = liveGame();
    if (!g) {
      const up = gamesList().filter((x) => x.status === 'scheduled');
      let h = `<div class="card empty"><img src="${LOGO}" alt=""><h3>No game in progress</h3><p>${canEdit() ? 'Pick a scheduled game to set lineups and start scoring, or add a new one.' : 'When a game starts, the live score shows up here.'}</p>${canEdit() ? '<button class="btn primary" data-act="newGame">+ New game</button>' : ''}</div>`;
      if (up.length && canEdit()) h += `<h2 class="sec">Ready to start</h2><div class="list">${up.map((x) => gameRow(x, true)).join('')}</div>`;
      return h;
    }
    UI.liveId = g.id;
    const s = viewState(g);
    const names = sideNames(g);
    const arrow = s.half === 0 ? '<svg viewBox="0 0 10 10"><path d="M5 1 9 8H1z"/></svg>' : '<svg viewBox="0 0 10 10"><path d="M5 9 1 2h8z"/></svg>';
    let h = `<section class="board live-board">
      <div class="lb-teams">
        <span class="bat">${s.half === 0 ? '▶' : ''}</span><span class="nm">${esc(names.away)}</span><span class="sc num">${s.score.away}</span>
        <span class="bat">${s.half === 1 ? '▶' : ''}</span><span class="nm">${esc(names.home)}</span><span class="sc num">${s.score.home}</span>
      </div>
      <div class="lb-side"><span class="lbl">Inning</span><span class="lb-inn">${arrow}${s.inning}</span></div>
      <div class="lights"><span class="light-set"><span class="lbl">B</span>${lamps(s.balls, 3, 'b')}</span><span class="light-set"><span class="lbl">S</span>${lamps(s.strikes, 2, 's')}</span><span class="light-set"><span class="lbl">O</span>${lamps(s.outs, 2, 'o')}</span></div>
    </section>`;
    if (s.over && canEdit()) {
      const r = result(g);
      h += `<div class="over-banner"><span class="grow">That's the game by regulation: ${esc(Data.team.name)} ${r.us}, ${esc(g.opponent)} ${r.them}.</span><button class="btn primary sm" data-act="finish" data-id="${g.id}">Finish game</button></div>`;
    }
    const batRef = s.batter, pitRef = s.pitcherNow;
    const batIsOpp = batRef && !playerById(batRef);
    const bats = batsOf(g, batRef);
    const ps = s.pit[pitRef] || E.emptyPit();
    const ours = s.fieldSide === s.us;
    const limit = Data.team.pitchLimit || 0;
    let bar = '';
    if (ours && limit) {
      const f = ps.PC / limit;
      bar = `<div class="pc-bar" title="${ps.PC} of ${limit}"><i class="${f >= 1 ? 'over' : f >= 0.85 ? 'warn' : ''}" style="width:${Math.min(100, f * 100).toFixed(0)}%"></i></div><div class="mu-sub">${ps.PC >= limit ? 'At the ' + limit + '-pitch limit' : limit - ps.PC + ' pitches to the ' + limit + ' limit'}</div>`;
    }
    const batName = batRef ? refName(g, batRef, true) : 'Set a lineup';
    h += `<section class="matchup">
      <button class="diamond-btn" data-act="runners" aria-label="Move runners" ${canEdit() ? '' : 'disabled'}>${diamondSVG(s, g)}</button>
      <div class="mu">
        <div class="mu-row"><div class="lbl">At bat · ${esc(names[s.batSide])}</div>
          <div class="mu-name">${batIsOpp && canEdit() ? `<button data-act="editOpp" data-ref="${esc(batRef)}">${esc(batName)}</button>` : `<span>${playerById(batRef) ? '<span class="pnum">' + esc(refNum(batRef)) + '</span>' : ''}${esc(batName)}</span>`}</div>
          <div class="mu-sub">${bats ? 'Bats ' + esc(bats) + ' · ' : ''}${esc(todayLine(s.bat[batRef]))}</div></div>
        <div class="mu-row"><div class="lbl">Pitching · ${esc(names[s.fieldSide])}</div>
          <div class="mu-name"><span>${esc(refName(g, pitRef, true))}</span></div>
          <div class="mu-sub num">${ps.PC} pitch${ps.PC === 1 ? '' : 'es'} · ${ps.ST} strikes${ps.PC ? ' (' + pct(ps.ST, ps.PC) + '%)' : ''}</div>${bar}</div>
      </div>
    </section>`;
    if (canEdit()) {
      h += `<section class="pad" aria-label="Record a pitch">
        <button class="k-ball" data-act="pitch" data-r="B">Ball</button>
        <button class="k-strike" data-act="pitch" data-r="C">Strike<small>LOOKING</small></button>
        <button class="k-strike" data-act="pitch" data-r="S">Strike<small>SWINGING</small></button>
        <button class="k-foul" data-act="pitch" data-r="F">Foul</button>
        <button class="k-play" data-act="inPlay">Ball in play</button>
      </section>
      <div class="tools">
        <button class="btn sm" data-act="undo" ${g.events.length ? '' : 'disabled'}>↶ Undo</button>
        <button class="btn sm" data-act="runners" ${s.bases.some(Boolean) ? '' : 'disabled'}>Runners</button>
        <button class="btn sm" data-act="quickPA" data-r="HBP">Hit by pitch</button>
        <button class="btn sm" data-act="quickPA" data-r="IBB">Int. walk</button>
        <button class="btn sm" data-act="pitcher">Pitcher</button>
        <button class="btn sm" data-act="sub">Sub</button>
        ${gameVideo(g) && UI.standalone ? `<button class="btn sm" data-act="coachVideo">${videoPrefs().coachShow ? 'Hide video' : 'Show video'}</button>` : ''}
        ${UI.standalone && Backend.kind === 'fb' ? `<button class="btn sm" data-act="camOpen">${Data.stream && Data.stream.live && Data.stream.gid === g.id ? 'Camera (live)' : 'Stream video'}</button>` : ''}
      </div>`;
    } else {
      h += `<div class="follow-note card" style="padding:12px 14px"><span class="pill" data-s="follow" style="background:var(--accent-soft);color:var(--ink)">Live</span><span>Updates as the scorer records each pitch.</span></div>`;
      if (Access.isCamera && UI.standalone && Backend.kind === 'fb') h += `<button class="btn primary block" data-act="camOpen">${Data.stream && Data.stream.live && Data.stream.gid === g.id ? 'Camera (live)' : 'Stream video'}</button>`;
    }
    const groups = playItems(g, s);
    const recent = [];
    for (let i = groups.length - 1; i >= 0 && recent.length < 5; i--) for (let j = groups[i].items.length - 1; j >= 0 && recent.length < 5; j--) recent.push(groups[i].items[j]);
    h += `<h2 class="sec">Recent plays <button class="btn ghost sm" data-act="openGame" data-id="${g.id}">Box score ›</button></h2>`;
    h += `<div class="card" style="padding:2px 14px">${recent.length ? '<div class="plays">' + recent.map((it) => `<div class="play"><span class="tag">${it.half ? '▼' : '▲'}${it.inn}</span><span>${esc(it.text)}${it.score ? `<span class="scr">${esc(it.score)}</span>` : ''}</span></div>`).join('') + '</div>' : '<p class="muted small">First pitch is up to you.</p>'}</div>`;
    return h;
  }

  // ----- stats -----
  function seasonStats() {
    const bat = {}, pit = {};
    let games = 0;
    for (const g of gamesList()) {
      if (!g.events.length) continue;
      games++;
      const s = st(g);
      for (const ref of s.batOrder[s.us]) {
        const b = s.bat[ref];
        if (!b || !b.PA) continue;
        const c = Object.assign({}, b, { G: 1 });
        bat[ref] = E.addInto(bat[ref] || E.emptyBat(), c);
      }
      for (const ref of s.pitOrder[s.us]) {
        const p = s.pit[ref];
        if (!p || (!p.PC && !p.BF)) continue;
        pit[ref] = E.addInto(pit[ref] || E.emptyPit(), Object.assign({}, p, { G: 1 }));
      }
    }
    return { bat, pit, games };
  }
  const num = (n, d, k) => (d ? n / d : -1) * (k || 1);
  const BAT_COLS = [
    ['G', (b) => b.G], ['PA', (b) => b.PA], ['AB', (b) => b.AB], ['H', (b) => b.H], ['2B', (b) => b['2B']], ['3B', (b) => b['3B']], ['HR', (b) => b.HR], ['RBI', (b) => b.RBI], ['R', (b) => b.R], ['BB', (b) => b.BB], ['K', (b) => b.K], ['SB', (b) => b.SB],
    ['AVG', (b) => num(b.H, b.AB), (b) => E.rate(b.H, b.AB)],
    ['OBP', (b) => num(b.H + b.BB + b.HBP, b.AB + b.BB + b.HBP + b.SF), (b) => E.rate(b.H + b.BB + b.HBP, b.AB + b.BB + b.HBP + b.SF)],
    ['SLG', (b) => num(b.TB, b.AB), (b) => E.rate(b.TB, b.AB)],
    ['OPS', (b) => (b.AB ? b.TB / b.AB : 0) + (b.AB + b.BB + b.HBP + b.SF ? (b.H + b.BB + b.HBP) / (b.AB + b.BB + b.HBP + b.SF) : 0), (b) => (b.AB ? (b.TB / b.AB + (b.H + b.BB + b.HBP) / (b.AB + b.BB + b.HBP + b.SF)).toFixed(3).replace(/^0/, '') : '—')]
  ];
  const PIT_COLS = () => {
    const inn = Data.team.innings || 7;
    return [
      ['G', (p) => p.G], ['IP', (p) => p.OUTS, (p) => E.fmtIP(p.OUTS), 'OUTS'], ['PC', (p) => p.PC], ['BF', (p) => p.BF], ['H', (p) => p.H], ['R', (p) => p.R], ['ER', (p) => p.ER], ['BB', (p) => p.BB], ['K', (p) => p.K],
      ['ERA', (p) => (p.OUTS ? (p.ER * inn * 3) / p.OUTS : p.ER ? 999 : -1), (p) => (p.OUTS ? ((p.ER * inn * 3) / p.OUTS).toFixed(2) : p.ER ? '∞' : '—')],
      ['WHIP', (p) => (p.OUTS ? ((p.BB + p.H) * 3) / p.OUTS : -1), (p) => (p.OUTS ? (((p.BB + p.H) * 3) / p.OUTS).toFixed(2) : '—')],
      ['STR%', (p) => num(p.ST, p.PC), (p) => (p.PC ? pct(p.ST, p.PC) + '%' : '—')]
    ];
  };
  function statTable(rows, cols, mode, total) {
    const sortKey = UI.sort[mode];
    const col = cols.find((c) => (c[3] || c[0]) === sortKey) || cols[1];
    rows.sort((a, b) => col[1](b.s) - col[1](a.s) || a.name.localeCompare(b.name));
    const head = `<th>${mode === 'bat' ? 'Batter' : 'Pitcher'}</th>` + cols.map((c) => `<th class="${(c[3] || c[0]) === sortKey ? 'on' : ''}"><button data-act="sort" data-mode="${mode}" data-k="${c[3] || c[0]}" aria-label="Sort by ${c[0]}">${c[0]}${(c[3] || c[0]) === sortKey ? ' ▾' : ''}</button></th>`).join('');
    const body = rows.map((r) => `<tr data-act="playerCard" data-id="${esc(r.id)}"><td><span class="pnum">${esc(r.num)}</span>${esc(r.name)}</td>` + cols.map((c) => `<td>${c[2] ? c[2](r.s) : c[1](r.s)}</td>`).join('') + '</tr>').join('');
    const tot = total ? `<tr class="tot"><td>Team</td>` + cols.map((c) => `<td>${c[0] === 'G' ? '' : c[2] ? c[2](total) : c[1](total)}</td>`).join('') + '</tr>' : '';
    return `<div class="tbl-wrap"><table class="st"><thead><tr>${head}</tr></thead><tbody>${body}${tot}</tbody></table></div>`;
  }
  function renderStats() {
    const ss = seasonStats();
    const mode = UI.statsMode;
    let h = `<div class="row"><div class="seg">${[['bat', 'Batting'], ['pit', 'Pitching']].map(([k, l]) => `<button data-act="statsMode" data-k="${k}" aria-pressed="${mode === k}">${l}</button>`).join('')}</div><span class="grow"></span><span class="small muted">Through ${ss.games} game${ss.games === 1 ? '' : 's'}</span></div>`;
    const src = mode === 'bat' ? ss.bat : ss.pit;
    const ids = Object.keys(src);
    if (!ids.length) {
      h += `<div class="card empty"><h3>No ${mode === 'bat' ? 'batting' : 'pitching'} stats yet</h3><p>Stats build automatically from every game you score.</p></div>`;
      return h;
    }
    const rows = ids.map((id) => { const p = playerById(id); return { id, name: p ? p.name : 'Former player', num: p && p.num ? '#' + p.num : '', s: src[id] }; });
    const total = ids.reduce((t, id) => E.addInto(t, src[id]), mode === 'bat' ? E.emptyBat() : E.emptyPit());
    h += statTable(rows, mode === 'bat' ? BAT_COLS : PIT_COLS(), mode, total);
    h += `<p class="small muted" style="margin:0">Tap a column to sort, or a player for their spray chart and game log.${mode === 'pit' ? ' ERA is per ' + (Data.team.innings || 7) + ' innings.' : ''}</p>`;
    return h;
  }

  // ----- scouting -----
  function scoutData() {
    const opps = new Map();
    for (const g of gamesList()) {
      if (!g.events.length) continue;
      const s = st(g);
      const oname = (g.opponent || 'Opponent').trim();
      const okey = oname.toLowerCase();
      if (!opps.has(okey)) opps.set(okey, { key: okey, name: oname, hitters: new Map(), games: 0, last: g.date });
      const O = opps.get(okey);
      const R = rosterFor(oname);
      O.games++;
      O.last = g.date;
      for (const pa of s.pas) {
        if (pa.side !== s.them) continue;
        const o = oppEntry(g, pa.ref) || { id: pa.ref };
        const hk = o.num ? '#' + String(o.num).trim() : o.name ? o.name.trim().toLowerCase() : 'slot' + (pa.slot + 1);
        if (!O.hitters.has(hk)) O.hitters.set(hk, { key: hk, num: o.num || '', name: o.name || '', bats: o.bats || '', pas: [], slot: pa.slot });
        const H = O.hitters.get(hk);
        if (o.name) H.name = o.name;
        if (o.bats) H.bats = o.bats;
        if (R && H.num && (!H.name || !H.bats)) {
          const rp = R.players.find((x) => String(x.num || '').trim() === String(H.num).trim());
          if (rp) { if (!H.name && rp.name) H.name = rp.name; if (!H.bats && rp.bats) H.bats = rp.bats; }
        }
        H.pas.push(Object.assign({ date: g.date }, pa));
      }
    }
    return opps;
  }
  const hitterLabel = (H) => [H.num ? '#' + H.num : '', H.name].filter(Boolean).join(' ') || 'Batter ' + (H.slot + 1);
  function lineFor(pas) {
    const b = { PA: pas.length, AB: 0, H: 0, BB: 0, K: 0, XBH: 0 };
    for (const p of pas) { const m = E.RESULTS[p.r] || {}; if (m.ab) b.AB++; if (m.hit) b.H++; if (m.walk || p.r === 'HBP') b.BB++; if (m.k) b.K++; if (m.hit && p.r !== '1B') b.XBH++; }
    return b;
  }
  function renderScout() {
    const opps = scoutData();
    if (!opps.size) return `<div class="card empty"><img src="${LOGO}" alt=""><h3>Scouting fills in as you score</h3><p>Every ball in play you chart for an opponent hitter lands here, with spray charts, tendencies and where to position your defense.</p></div>`;
    const list = [...opps.values()].sort((a, b) => b.last.localeCompare(a.last));
    if (!UI.scoutOpp || !opps.has(UI.scoutOpp)) { UI.scoutOpp = list[0].key; UI.scoutKey = '*'; }
    const O = opps.get(UI.scoutOpp);
    const hitters = [...O.hitters.values()].sort((a, b) => b.pas.length - a.pas.length || a.slot - b.slot);
    if (UI.scoutKey !== '*' && !O.hitters.has(UI.scoutKey)) UI.scoutKey = '*';
    let h = `<h2 class="sec">Opponent</h2><div class="picker" role="group">${list.map((o) => `<button data-act="scoutOpp" data-k="${esc(o.key)}" aria-pressed="${o.key === UI.scoutOpp}">${esc(o.name)}</button>`).join('')}</div>`;
    const allPas = hitters.flatMap((x) => x.pas);
    const sel = UI.scoutKey === '*' ? null : O.hitters.get(UI.scoutKey);
    const pas = sel ? sel.pas : allPas;
    const t = tendencies(pas, sel ? sel.bats : '');
    const line = lineFor(pas);
    const title = sel ? hitterLabel(sel) : O.name + ' lineup';
    const pts = pas.filter((p) => p.loc).map((p) => ({ loc: p.loc, r: p.r }));
    h += `<section class="card stack" style="padding:14px">
      <div class="row"><div class="grow"><div class="mu-name" style="font-size:21px">${esc(title)}</div><div class="mu-sub">${line.H}-for-${line.AB}${line.XBH ? ', ' + line.XBH + ' XBH' : ''} · ${line.BB} BB/HBP · ${line.K} K · ${O.games} game${O.games === 1 ? '' : 's'}</div></div>
      <div class="seg">${[['dots', 'Dots'], ['heat', 'Heat']].map(([k, l]) => `<button data-act="sprayMode" data-k="${k}" aria-pressed="${UI.sprayMode === k}">${l}</button>`).join('')}</div></div>
      ${fieldSVG({ points: pts, heat: UI.sprayMode === 'heat', label: 'Spray chart for ' + title })}
      ${UI.sprayMode === 'heat' ? '<div class="legend"><span>Darker = more balls hit there</span></div>' : legend()}
      ${tendHTML(t)}
      <div class="tip">${tipsFor(t).map((x) => `<p>${esc(x)}</p>`).join('')}</div>
      ${aiBlock(sel, O, pas, t)}
    </section>`;
    h += `<h2 class="sec">Hitters</h2><div class="card hitters">
      <button class="hitter" data-act="scoutKey" data-k="*" aria-pressed="${UI.scoutKey === '*'}"><span class="no">ALL</span><span><b>Whole lineup</b><span class="meta">${allPas.length} plate appearances</span></span><span class="meta"></span></button>
      ${hitters.map((x) => { const tt = tendencies(x.pas, x.bats); const dom = ['L', 'C', 'R'].reduce((m, k) => (tt[k] > tt[m] ? k : m), 'C'); const domName = { L: 'Left', C: 'Center', R: 'Right' }[dom]; return `<button class="hitter" data-act="scoutKey" data-k="${esc(x.key)}" aria-pressed="${UI.scoutKey === x.key}"><span class="no">${esc(x.num || x.slot + 1)}</span><span style="min-width:0"><b>${esc(x.name || 'Bats ' + ORDN(x.slot + 1) + ' in the order')}</b><span class="meta">${x.pas.length} PA · ${tt.n} in play${x.bats ? ' · bats ' + esc(x.bats) : ''}</span></span><span class="meta">${tt.n >= 3 ? domName + ' ' + pct(tt[dom], tt.n) + '%' : ''}</span></button>`; }).join('')}
    </div>`;
    return h;
  }
  function aiBlock(sel, O, pas, t) {
    if (!Caps.sample || !pas.length) return '';
    const key = O.key + '|' + (sel ? sel.key : '*');
    const st2 = UI.ai[key] || {};
    let h = '<div class="stack">';
    if (st2.text || st2.busy) h += `<div class="ai-out" id="ai-out">${esc(st2.text || 'Thinking…')}</div>`;
    if (st2.err) h += `<div class="warn-text">${esc(st2.err)}</div>`;
    if (st2.busy) h += `<button class="btn sm" data-act="aiStop">Stop</button>`;
    else h += `<button class="btn" data-act="aiScout" data-key="${esc(key)}">${st2.text ? 'Ask Claude again' : 'Ask Claude for a scouting report'}</button>`;
    return h + '</div>';
  }

  // ----- team -----

  // ---------- sheets ----------
  function openSheet(sh) { UI.sheet = sh; renderSheet(); }

  function renderSheet() {

  const inp = (bind, val, attrs) => `<input class="input" data-bind="${bind}" value="${esc(val)}" ${attrs || ''}>`;
  const sel = (bind, val, opts, attrs) => `<select class="input" data-bind="${bind}" ${attrs || ''}>${opts.map(([v, l]) => `<option value="${esc(v)}"${String(v) === String(val) ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
  const segB = (act, val, opts) => `<div class="seg">${opts.map(([v, l]) => `<button data-act="${act}" data-v="${esc(v)}" aria-pressed="${String(v) === String(val)}">${esc(l)}</button>`).join('')}</div>`;
  const BATS = [['', '—'], ['R', 'R'], ['L', 'L'], ['S', 'S']];

  function setPath(obj, path, val) {
    const ks = path.split('.');
    let o = obj;
    for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]];
    o[ks[ks.length - 1]] = val;
  }

  const SHEETS = {
    confirm(sh) {
      return head(esc(sh.title)) + `<p style="margin:0">${esc(sh.text)}</p><div class="row"><button class="btn ${sh.danger ? 'danger' : 'primary'}" data-act="confirmYes">${esc(sh.yes || 'Confirm')}</button><button class="btn" data-act="close">Cancel</button></div>`;
    },
    game(sh) {

      return head(sh.id ? 'Edit game' : 'New game') + `
        <label><span class="field-lbl">Opponent</span>${inp('f.opponent', sh.f.opponent, 'list="opp-list" autocomplete="off" placeholder="Team name"')}<datalist id="opp-list">${opps.map((o) => `<option value="${esc(o)}">`).join('')}</datalist></label>

        <label><span class="field-lbl">Video link for this game (optional)</span>${inp('f.video', sh.f.video || '', 'type="url" inputmode="url" autocapitalize="off" spellcheck="false" placeholder="YouTube link to this game\u2019s stream"')}<span class="small muted" style="display:block;margin-top:4px">Leave empty to use the team\u2019s channel. Use this for Unlisted streams or the replay.</span></label>
        ${sh.err ? `<div class="warn-text">${esc(sh.err)}</div>` : ''}
        <div class="row"><button class="btn primary" data-act="saveGame">${sh.id ? 'Save' : 'Add game'}</button>${sh.id ? '' : '<button class="btn" data-act="saveGame" data-then="lineup">Add &amp; set lineup</button>'}</div>`;
    },
    lineup(sh) {

        <div><span class="field-lbl">${esc(Data.team.name)} batting order</span>

        <label><span class="field-lbl">Starting pitcher</span>${sel('ourPitcher', sh.ourPitcher, [['', 'Choose a pitcher']].concat(pitchers.map((p) => [p.id, (p.num ? '#' + p.num + ' ' : '') + p.name])), sh.locked ? 'disabled' : '')}</label>
        <div><span class="field-lbl">${esc(sh.oppName)} batting order</span>${lineupRosterTools(sh)}<div class="stack" style="gap:6px">${opp}</div>
        ${sh.locked ? '' : '<button class="btn ghost sm" data-act="oppAdd">+ Add batter</button>'}
        <p class="small muted" style="margin:4px 0 0">Jersey numbers are enough. Scouting tracks each hitter by number across games.</p></div>
        <label><span class="field-lbl">${esc(sh.oppName)} starting pitcher</span>${inp('oppPitcher', sh.oppPitcher, `placeholder="#19 or a name" ${sh.locked ? 'disabled' : ''}`)}</label>

        <div class="row"><button class="btn primary" data-act="saveLineup">${sh.start ? 'Start game' : 'Save lineups'}</button><button class="btn" data-act="close">Cancel</button></div>`;
    },
    play(sh) {
      const g = liveGame();
      const s = st(g);
      if (sh.step === 2) return runnersStep(sh, g, s);
      const groups = [
        ['Hits', [['1B', 'Single'], ['2B', 'Double'], ['3B', 'Triple'], ['HR', 'Home run']], 'hit'],
        ['Outs', [['GO', 'Ground out'], ['FO', 'Fly out'], ['LO', 'Line out'], ['PO', 'Pop out'], ['DP', 'Double play'], ['SF', 'Sac fly'], ['SAC', 'Sac bunt']], ''],
        ['Reached', [['E', 'Error'], ['FC', "Fielder's choice"]], '']

      return head('Ball in play') + `<div class="mu-sub" style="margin-top:-8px">${esc(refName(g, s.batter, true))} · ${s.balls}-${s.strikes} count · ${s.outs} out${s.outs === 1 ? '' : 's'}</div>

    runners(sh) {

    auth(sh) {
      const titles = { signin: 'Sign in', signup: 'Request access', setup: 'Create the admin account', reset: 'Reset your password' };
      let f = '';
      if (sh.mode === 'signup' || sh.mode === 'setup') f += `<label><span class="field-lbl">Your name</span>${inp('name', sh.name, 'autocomplete="name" placeholder="First and last name"')}</label>`;
      f += `<label><span class="field-lbl">Email</span>${inp('email', sh.email, 'type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false"')}</label>`;
      if (sh.mode !== 'reset') f += `<label><span class="field-lbl">Password</span>${inp('password', sh.password, `type="password" autocomplete="${sh.mode === 'signin' ? 'current-password' : 'new-password'}" ${sh.mode === 'signin' ? '' : 'placeholder="At least 6 characters"'}`)}</label>`;
      if (sh.mode === 'signup') f += `<label><span class="field-lbl">Your player</span>${inp('note', sh.note, 'placeholder="e.g. Wyatt Kell #7 (helps the coach approve you)"')}</label>`;
      const intro = { signin: '', signup: '<p class="small muted" style="margin:0">A coach approves new accounts before they can see games.</p>', setup: '<p class="small muted" style="margin:0">This account gets admin rights: scoring, rosters and approving families.</p>', reset: '<p class="small muted" style="margin:0">We’ll email you a link to choose a new password.</p>' }[sh.mode];
      const links = sh.mode === 'signin' ? '<div class="row"><button class="btn ghost sm" data-act="authMode" data-mode="reset">Forgot password?</button><button class="btn ghost sm" data-act="authMode" data-mode="signup">New family? Request access</button></div>'
        : sh.mode === 'reset' || sh.mode === 'signup' ? '<div class="row"><button class="btn ghost sm" data-act="authMode" data-mode="signin">Back to sign in</button></div>' : '';
      const btn = { signin: 'Sign in', signup: 'Request access', setup: 'Create admin account', reset: 'Send reset email' }[sh.mode];
      return head(titles[sh.mode]) + intro + f
        + (sh.msg ? `<div class="small" style="color:var(--good);font-weight:600">${esc(sh.msg)}</div>` : '')
        + (sh.err ? `<div class="warn-text">${esc(sh.err)}</div>` : '')

    member(sh) {
      const m = Access.members.find((x) => x.uid === sh.uid);
      if (!m) return head('Account') + '<p class="muted">This account was removed.</p>';
      const own = m.uid === Access.owner;
      const me = Access.user && m.uid === Access.user.uid;
      let acts = '';
      if (own) acts = '<p class="small muted" style="margin:0">The team owner always has admin rights.</p>';
      else {
        if (m.status !== 'approved') acts += `<button class="btn primary" data-act="memberSet" data-uid="${esc(m.uid)}" data-status="approved">Approve as family</button>`;
        if (m.role !== 'admin' || m.status !== 'approved') acts += `<button class="btn" data-act="memberRole" data-uid="${esc(m.uid)}" data-role="admin">Make a coach (admin)</button>`;
        if (m.role !== 'camera' || m.status !== 'approved') acts += `<button class="btn" data-act="memberRole" data-uid="${esc(m.uid)}" data-role="camera">Make a camera operator (streams games, can\u2019t score)</button>`;

      return head(esc(memberLabel(m))) + `<div class="small muted" style="margin-top:-8px">${esc(m.email || '')}${m.note ? ' · ' + esc(m.note) : ''}</div><div class="stack">${acts}</div>`;

        <label><span class="field-lbl">Worker address</span>${inp('url', sh.url, 'type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://gs-scorebook-ai.yourname.workers.dev"')}</label>
        <label><span class="field-lbl">Access code</span>${inp('code', sh.code, 'autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="The ACCESS_CODE you set in the Worker"')}</label>

    },
    video(sh) {

        <div class="row"><button class="btn primary" data-act="videoSave">Save</button>${Data.team.video ? '<button class="btn danger" data-act="videoClear">Remove</button>' : '<button class="btn" data-act="close">Cancel</button>'}</div>`;

    yt(sh) {

        <label><span class="field-lbl">Google OAuth client ID</span>${inp('clientId', sh.clientId, 'autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="1234-abc.apps.googleusercontent.com"')}</label>

        <div class="row"><button class="btn primary" data-act="ytSave">Save</button>${Data.team.yt ? '<button class="btn danger" data-act="ytClear">Turn off</button>' : '<button class="btn" data-act="close">Cancel</button>'}</div>`;
    },
    teamEdit(sh) {

        <p class="small muted" style="margin:0">The live screen warns as your pitcher nears the limit. Set it to 0 to turn the warning off.</p>
        <div class="row"><button class="btn primary" data-act="saveTeamEdit">Save</button><button class="btn" data-act="close">Cancel</button></div>`;

    playerCard(sh) {
      const p = playerById(sh.id);
      const pas = [];
      const log = [];
      const tot = E.emptyBat();
      const ptot = E.emptyPit();
      for (const g of gamesList()) {
        if (!g.events.length) continue;
        const s = st(g);
        const mine = s.pas.filter((x) => x.ref === sh.id && x.side === s.us);
        if (s.bat[sh.id] && s.bat[sh.id].PA) E.addInto(tot, s.bat[sh.id]);
        if (s.pit[sh.id] && s.pit[sh.id].PC) E.addInto(ptot, s.pit[sh.id]);
        if (mine.length || (s.pit[sh.id] && s.pit[sh.id].PC)) {
          pas.push(...mine);
          log.push({ g, b: s.bat[sh.id], p: s.pit[sh.id], res: mine.map((x) => x.r) });
        }
      }
      const t = tendencies(pas, p ? p.bats : '');
      const pts = pas.filter((x) => x.loc).map((x) => ({ loc: x.loc, r: x.r }));
      const obp = E.rate(tot.H + tot.BB + tot.HBP, tot.AB + tot.BB + tot.HBP + tot.SF);
      return head(esc(p ? (p.num ? '#' + p.num + ' ' : '') + p.name : 'Player')) + `
        <div class="mu-sub" style="margin-top:-8px">${esc(p ? (p.pos || '') + ' · B/T ' + (p.bats || '?') + '/' + (p.throws || '?') : '')}</div>
        ${tot.PA ? `<div class="board"><span class="lbl">Season batting</span><div class="row" style="gap:18px;margin-top:6px;font-size:16px"><span><b class="num" style="font-family:var(--font-display);font-size:24px;color:var(--carolina)">${E.rate(tot.H, tot.AB)}</b> AVG</span><span class="num">${obp} OBP</span><span class="num">${tot.H}-${tot.AB}</span><span class="num">${tot.HR} HR · ${tot.RBI} RBI</span></div></div>` : ''}
        ${ptot.PC ? `<div class="small"><b>Pitching:</b> ${E.fmtIP(ptot.OUTS)} IP · ${ptot.K} K · ${ptot.BB} BB · ${ptot.H} H · ${ptot.R} R · ${ptot.PC} pitches</div>` : ''}

      const sel = UI.scoutKey === '*' ? null : O.hitters.get(UI.scoutKey);

      const t = tendencies(pas, sel ? sel.bats : '');
      const line = lineFor(pas);
      const bip = pas.filter((p) => p.loc).slice(-40).map((p) => `- ${E.zoneName(p.loc)}, ${{ G: 'ground ball', L: 'line drive', F: 'fly ball', P: 'pop up' }[p.bt] || 'contact'}, ${(E.RESULTS[p.r] || {}).n || p.r}, about ${E.geo(p.loc).ft} ft`).join('\n');
      const other = pas.filter((p) => !p.loc).map((p) => (E.RESULTS[p.r] || {}).n || p.r).join(', ');
      const prompt = `You are a baseball scouting assistant helping a high school coach. Using only the data below, write a short scouting report on ${sel ? 'this opposing hitter' : 'this opposing lineup as a whole'}: where to position the infield and the outfield, and one pitching note if the data supports it. Use 3 to 5 bullet points that start with "- ". Plain text, no headings, no preamble. If the sample is small, say so in the first bullet.\n\nOpponent: ${O.name}\n${sel ? 'Hitter: ' + hitterLabel(sel) + (sel.bats ? ', bats ' + sel.bats : '') : 'Whole lineup'}\nPlate appearances: ${line.PA}; ${line.H} hits in ${line.AB} at-bats; ${line.BB} walks or HBP; ${line.K} strikeouts.\nBalls in play (field zone from the catcher's view, contact type, result, distance):\n${bip || '(none charted)'}\n${other ? 'Plate appearances without a charted location: ' + other + '\n' : ''}Direction split: left ${pct(t.L, t.n)}%, center ${pct(t.C, t.n)}%, right ${pct(t.R, t.n)}% of ${t.n} charted balls.`;
      const ctl = new AbortController();
      UI.ai[key] = { busy: true, text: '', ctl };
      render();
      try {
        const res = await Caps.sample(prompt, { signal: ctl.signal, onText: ({ text }) => { UI.ai[key].text = text; const out = document.getElementById('ai-out'); if (out) out.textContent = text; } });
        UI.ai[key] = { text: res.text, err: res.truncated ? 'The report was cut short.' : '' };

        const keep = (e && e.text) || '';
        if (HIDE_CODES.includes(code) && Caps.sample && !Caps.sample.worker) { Caps.sample = null; UI.ai[key] = {}; }
        else if (code === 'cancelled') UI.ai[key] = { text: keep };
        else UI.ai[key] = { text: code === 'refused' ? '' : keep, err: aiErrorText(e, 'report') };
      }
      render();
    },

  };

  // ---------- in-app streaming: camera phone (WHIP) and family player (WHEP) ----------
  const ICE = [{ urls: 'stun:stun.cloudflare.com:3478' }];
  function iceDone(pc, ms) {
    return new Promise((res) => {
      if (pc.iceGatheringState === 'complete') return res();
      const t = setTimeout(res, ms);
      pc.addEventListener('icegatheringstatechange', () => { if (pc.iceGatheringState === 'complete') { clearTimeout(t); res(); } });
    });
  }
  async function sdpExchange(pc, url) {
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await iceDone(pc, 2500);
    const r = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/sdp' }, body: pc.localDescription.sdp });
    if (!r.ok) throw { code: 'whip', status: r.status };
    const loc = r.headers.get('Location');
    const answer = await r.text();
    await pc.setRemoteDescription({ type: 'answer', sdp: answer });
    return loc ? new URL(loc, url).href : null;
  }
  function endSession(url) { if (url) fetch(url, { method: 'DELETE' }).catch(() => {}); }

  // Family player
  const Player = { pc: null, session: null, url: null, video: null, retry: 0 };
  function playerStop() {
    clearTimeout(Player.retry);
    if (Player.pc) { try { Player.pc.close(); } catch (e) { /* closed */ } }
    endSession(Player.session);
    Player.pc = null; Player.session = null; Player.url = null; Player.video = null;
  }
  function playerMsg(t) { const m = $('#dock-msg'); if (m) { m.textContent = t; m.hidden = !t; } }
  async function playerStart(url, video) {
    playerStop();
    Player.url = url; Player.video = video;
    const pc = new RTCPeerConnection({ iceServers: ICE, bundlePolicy: 'max-bundle' });
    Player.pc = pc;
    pc.addTransceiver('video', { direction: 'recvonly' });
    pc.addTransceiver('audio', { direction: 'recvonly' });
    const ms = new MediaStream();
    video.srcObject = ms;
    pc.ontrack = (e) => { ms.addTrack(e.track); video.play().catch(() => {}); };
    pc.onconnectionstatechange = () => {
      if (Player.pc !== pc) return;
      if (pc.connectionState === 'connected') playerMsg('');
      else if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') { playerMsg('Reconnecting to the camera…'); playerRetry(url, video, 3000); }
    };
    try { Player.session = await sdpExchange(pc, url); }
    catch (e) { if (Player.pc === pc) { playerMsg('Waiting for the camera to start…'); playerRetry(url, video, 5000); } }
  }
  function playerRetry(url, video, ms) {
    clearTimeout(Player.retry);
    Player.retry = setTimeout(() => { if (Player.url === url && document.body.contains(video)) playerStart(url, video); }, ms);
  }

  // Recordings on this phone (IndexedDB, saved in 10-second pieces)
  const RecDB = {
    db: null,
    open() {
      if (this.db) return Promise.resolve(this.db);
      return new Promise((res, rej) => {
        const q = indexedDB.open('gs-recordings', 1);
        q.onupgradeneeded = () => { const d = q.result; d.createObjectStore('meta', { keyPath: 'rid' }); d.createObjectStore('chunks', { keyPath: ['rid', 'seq'] }); };
        q.onsuccess = () => { this.db = q.result; res(this.db); };
        q.onerror = () => rej(q.error);
      });
    },
    async tx(stores, mode, fn) {
      const d = await this.open();
      return new Promise((res, rej) => { const t = d.transaction(stores, mode); const out = fn(t); t.oncomplete = () => res(out && out.result !== undefined ? out.result : out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); });
    },
    putMeta(m) { return this.tx(['meta'], 'readwrite', (t) => t.objectStore('meta').put(m)); },
    putChunk(rid, seq, blob) { return this.tx(['chunks'], 'readwrite', (t) => t.objectStore('chunks').put({ rid, seq, blob })); },
    listMeta() { return this.tx(['meta'], 'readonly', (t) => t.objectStore('meta').getAll()); },
    chunks(rid) { return this.tx(['chunks'], 'readonly', (t) => t.objectStore('chunks').getAll(IDBKeyRange.bound([rid, 0], [rid, Infinity]))); },
    remove(rid) { return this.tx(['meta', 'chunks'], 'readwrite', (t) => { t.objectStore('meta').delete(rid); t.objectStore('chunks').delete(IDBKeyRange.bound([rid, 0], [rid, Infinity])); }); }
  };
  const Recs = { list: null, files: {}, busy: {} };
  async function loadRecs() { try { Recs.list = (await RecDB.listMeta()).sort((a, b) => b.startedAt - a.startedAt); } catch (e) { Recs.list = []; } scheduleRender(); if (Cam.open) camRender(); }
  const mb = (n) => (n >= 1e9 ? (n / 1e9).toFixed(2) + ' GB' : Math.max(0.1, n / 1e6).toFixed(n >= 1e8 ? 0 : 1) + ' MB');
  const dur = (ms) => { const m = Math.max(0, Math.round(ms / 60000)); return m >= 60 ? Math.floor(m / 60) + 'h ' + (m % 60) + 'm' : m + ' min'; };
  function recRowHTML(r) {
    const rid = esc(r.rid);
    const live = Cam.rec && Cam.rec.rid === r.rid;
    const file = Recs.files[r.rid];
    const job = YT.jobs[r.rid] || {};
    const uploading = job.state === 'uploading';
    let status = '';

      const g = liveGame();
      if (!g) { toast('Start the game first, then stream it.'); return; }
      if (!loadAiCfg()) { toast('Connect your Cloudflare Worker first, under Team.'); return; }
      Cam.open = true; Cam.gid = g.id; Cam.err = ''; Cam.confirmEnd = false;
      if (ytCfg()) ytLoad().catch(() => {});
      if (!Cam.wantLive) Cam.state = 'starting';
      camEl().hidden = false;
      document.body.classList.add('cam-on');
      camRender();
      if (Cam.wantLive) return;
      try { await camMedia(); Cam.state = 'preview'; }
      catch (e) { Cam.state = 'preview'; Cam.err = aiErrorText({ code: 'camera' }); }
      if (Recs.list === null) loadRecs();
      camRender();
    },
    camClose() {
      if (Cam.wantLive) return;
      if (Cam.stream) Cam.stream.getTracks().forEach((t) => t.stop());
      Cam.stream = null; Cam.open = false; Cam.state = 'off';
      const el = $('#cam'); if (el) { el.hidden = true; $('#cam-bar').innerHTML = ''; }
      document.body.classList.remove('cam-on');
      render();
    },
    camMic() { Cam.mic = !Cam.mic; if (Cam.stream) Cam.stream.getAudioTracks().forEach((t) => { t.enabled = Cam.mic; }); camRender(); },
    async camFlip() {
      Cam.facing = Cam.facing === 'environment' ? 'user' : 'environment';
      try { await camMedia(); } catch (e) { Cam.err = aiErrorText({ code: 'camera' }); }
      camRender();
    },
    async camGo() {
      const cfg = loadAiCfg();
      const g = Data.games[Cam.gid];
      if (!cfg || !g || !Cam.stream) return;
      Cam.err = ''; Cam.state = 'connecting'; Cam.wantLive = true; camRender();
      if (!Cam.startedAt) Cam.sessionRids = [];
      try {
        const saved = camSaved();
        if (saved && saved.gid === g.id && Data.stream && Data.stream.live && Data.stream.uid === saved.uid) {
          Object.assign(Cam, { uid: saved.uid, whip: saved.whip, whep: saved.whep });
        } else {
          const d = await workerCall(cfg, 'live-start', { name: Data.team.name + ' ' + camGameName(g) });
          Object.assign(Cam, { uid: d.uid, whip: d.whip, whep: d.whep });
          camSave({ gid: g.id, uid: d.uid, whip: d.whip, whep: d.whep });
        }
        await publish();
        Cam.startedAt = Cam.startedAt || Date.now();
        Data.stream = { gid: g.id, uid: Cam.uid, whep: Cam.whep, live: true, startedAt: Cam.startedAt };
        Saver.put('team/stream', Data.stream);
        camWake(true);
        await recStart();
        clearInterval(Cam.timer);
        Cam.timer = setInterval(camRender, 1000);
      } catch (e) {
        Cam.wantLive = false; Cam.state = 'preview';
        Cam.err = aiErrorText(e, 'stream') || 'Could not start the stream.';
      }
      camRender();
    },
    async camResume() {
      Cam.err = '';
      try { await camMedia(); } catch (e) { Cam.err = aiErrorText({ code: 'camera' }); camRender(); return; }
      Cam.state = 'reconnecting'; camRender();
      camWake(true);
      try { await publish(); } catch (e) { camRetry(4000); }
      await recStart();
    },
    async camEnd() {
      if (!Cam.confirmEnd) { Cam.confirmEnd = true; camRender(); setTimeout(() => { Cam.confirmEnd = false; camRender(); }, 4000); return; }
      // Ask Google for upload permission inside this tap, so the upload can start by itself.
      const y = ytCfg();
      const tokP = y && y.auto !== false ? ytToken().then(() => null, (e) => e) : null;
      Cam.confirmEnd = false; Cam.wantLive = false;
      clearTimeout(Cam.retry); clearInterval(Cam.timer);
      if (Cam.pc) { try { Cam.pc.close(); } catch (e) { /* closed */ } }
      endSession(Cam.session); Cam.pc = null; Cam.session = null;
      const recDone = recStop();
      const cfg = loadAiCfg();
      if (cfg && Cam.uid) workerCall(cfg, 'live-end', { uid: Cam.uid }).catch(() => {});
      if (Data.stream && Data.stream.uid === Cam.uid) { Data.stream = Object.assign({}, Data.stream, { live: false, endedAt: Date.now() }); Saver.put('team/stream', Data.stream); }
      camSave(null);
      Cam.uid = null; Cam.whip = null; Cam.whep = null; Cam.startedAt = 0;
      camWake(false);
      if (Cam.stream) Cam.stream.getTracks().forEach((t) => t.stop());
      Cam.stream = null;
      Cam.state = 'ended';
      camRender();
      const rids = (Cam.sessionRids || []).slice();
      Cam.sessionRids = [];
      await recDone;
      await loadRecs();
      if (tokP) {
        const err = await tokP;
        if (err) { const t = ytErrText(err); if (t) toast(t); return; }
        for (const rid of rids) await ytUpload(rid);
      }
    },
    async recPrepare(d) {
      const r = Recs.list && Recs.list.find((x) => x.rid === d.rid);
      if (!r) return;
      Recs.busy[r.rid] = true; render(); camRender();
      try {
        const parts = await RecDB.chunks(r.rid);
        const blob = new Blob(parts.map((c) => c.blob), { type: r.type || 'video/mp4' });
        const ext = /webm/.test(r.type || '') ? 'webm' : 'mp4';
        Recs.files[r.rid] = new File([blob], ('GS ' + (r.title || 'game')).replace(/[^\w .@-]+/g, '').trim() + '.' + ext, { type: r.type || 'video/mp4' });
      } catch (e) { toast('Could not open that recording.'); }
      delete Recs.busy[r.rid];
      render(); camRender();
    },
    async recSave(d) {
      const f = Recs.files[d.rid];
      if (!f) return;
      if (navigator.canShare && navigator.canShare({ files: [f] })) {
        try { await navigator.share({ files: [f], title: f.name }); } catch (e) { /* the viewer closed the share sheet */ }
        return;
      }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(f); a.download = f.name;
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 5000);
    },
    recDelete(d) {
      confirmSheet('Delete this video from the phone?', 'Only delete it after you’ve saved it to Photos or uploaded it. This can’t be undone.', 'Delete video', async () => {
        try { await RecDB.remove(d.rid); } catch (e) { toast('Could not delete it.'); }
        delete Recs.files[d.rid];
        await loadRecs();
        toast('Video deleted from this phone');
      }, true);
    },
    ytStart(d) {
      const p = ytToken();
      p.then(() => ytUpload(d.rid), (e) => { const t = ytErrText(e); if (t) toast(t); });
    },
    async ytReplay(d) {
      const r = Recs.list && Recs.list.find((x) => x.rid === d.rid);
      if (r && r.yt && r.gid) { await ytSetReplay(r.gid, r.yt.id); render(); if (Cam.open) camRender(); }
    },
    ytSetup() { const y = Data.team.yt || {}; openSheet({ type: 'yt', clientId: y.clientId || '', auto: y.auto !== false, attach: !!y.attach }); },
    ytAuto(d) { UI.sheet.auto = d.v === 'on'; renderSheet(); },
    ytAttach(d) { UI.sheet.attach = d.v === 'on'; renderSheet(); },
    ytSave() {
      const sh = UI.sheet;
      const id = String(sh.clientId || '').trim();
      if (!/^[\w.-]+\.apps\.googleusercontent\.com$/.test(id)) { sh.err = 'Paste the OAuth client ID from Google Cloud. It ends in .apps.googleusercontent.com.'; return renderSheet(); }
      Data.team.yt = { clientId: id, auto: !!sh.auto, attach: !!sh.attach };
      saveTeam();
      YT.client = null;
      ytLoad().catch(() => {});
      closeSheet(); render(); toast('YouTube uploads saved');
    },
    ytClear() { delete Data.team.yt; saveTeam(); YT.client = null; YT.token = null; closeSheet(); render(); toast('YouTube uploads turned off'); },
    dockUnmute() { const v = $('#dock-video'); if (v) { v.muted = false; v.play().catch(() => {}); } const b = $('#dock-unmute'); if (b) b.hidden = true; }
  });

  function doImport(file) {
    const reader = new FileReader();
    reader.onload = () => {
      let d;
      try { d = JSON.parse(reader.result); } catch (e) { toast("That file isn't a GS Baseball backup."); return; }
      if (!d || d.app !== 'gs-baseball' || !Array.isArray(d.games)) { toast("That file isn't a GS Baseball backup."); return; }
      confirmSheet('Import this backup?', `It has ${d.games.length} game${d.games.length === 1 ? '' : 's'} and ${(d.team && d.team.players || []).length} players. Games with the same ID are replaced, and the roster is replaced by the one in the backup.`, 'Import', () => {
        Data.team = normTeam(d.team);
        saveTeam();
        for (const g of d.games) { if (!g || !g.id) continue; Data.games[g.id] = normGame(g); saveGame(Data.games[g.id]); }
        for (const o of d.opponents || []) { if (o && o.name) saveRoster(normRoster(o)); }
        render();
        toast('Backup imported');
      });
    };
    reader.readAsText(file);
  }

  // ---------- events ----------
  document.addEventListener('click', (ev) => {
    const el = ev.target.closest('[data-act]');
    if (!el) return;
    if (el.disabled) return;
    const fn = A[el.dataset.act];
    if (!fn) return;
    if (el.tagName === 'A') ev.preventDefault();
    fn(el.dataset, el, ev);
  });
  document.addEventListener('input', (ev) => {
    const el = ev.target;
    if (el.dataset && el.dataset.bind && UI.sheet) setPath(UI.sheet, el.dataset.bind, el.value);
  });
  document.addEventListener('change', (ev) => {
    const el = ev.target;
    if (el.id === 'import-file' && el.files && el.files[0]) { doImport(el.files[0]); el.value = ''; return; }
    if (el.dataset && el.dataset.scan && el.files && el.files.length) { const files = Array.from(el.files); el.value = ''; runScan(files); return; }
    if (el.dataset && el.dataset.bind && UI.sheet) setPath(UI.sheet, el.dataset.bind, el.value);
  });
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape' && UI.sheet) closeSheet();
    if (ev.key === 'Enter' && !ev.shiftKey && ev.target && ev.target.id === 'chat-input' && !('ontouchstart' in window)) { ev.preventDefault(); chatSend(); }
  });
  document.addEventListener('submit', (ev) => { if (ev.target && ev.target.id === 'chat-bar') { ev.preventDefault(); chatSend(); } });
  document.addEventListener('input', (ev) => { if (ev.target && ev.target.id === 'chat-input') chatGrow(); });

  // ---------- boot ----------
  function subscribe(db) {
    const subs = [];
    subs.push(db.doc('team/stream').onSnapshot((snap) => {
      if (!Saver.busy('team/stream')) Data.stream = snap.exists ? clone(snap.data()) : null;
      scheduleRender();
    }, () => {}));
    subs.push(db.doc('team/main').onSnapshot((snap) => {
      if (!Saver.busy('team/main')) Data.team = normTeam(snap.exists ? clone(snap.data()) : null);
      Data.loaded.team = true;
      maybeReady();
    }, onDbError));
    subs.push(db.collection('games').onSnapshot((snap) => {
      const next = {};
      for (const doc of snap.docs) if (doc.exists) next[doc.id] = normGame(clone(doc.data()));
      for (const id in Data.games) if (Saver.busy('games/' + id)) next[id] = Data.games[id];
      for (const id of Object.keys(next)) if (Saver.deleting.has('games/' + id)) delete next[id];
      Data.games = next;
      Data.loaded.games = true;
      maybeReady();
    }, onDbError));
    subs.push(db.collection('opponents').onSnapshot((snap) => {
      const next = {};
      for (const doc of snap.docs) if (doc.exists && !Saver.deleting.has('opponents/' + doc.id)) next[doc.id] = normRoster(clone(doc.data()));
      for (const k in Data.opponents) if (Saver.busy('opponents/' + k)) next[k] = Data.opponents[k];
      Data.opponents = next;
      Data.loaded.opps = true;
      maybeReady();
    }, onDbError));
    return subs;
  }
  function onDbError(err) {
    if (err && err.code === 'permission_denied') {
      if (Backend.kind === 'fb' && Access.canView) toast("Games couldn't load. Check that the security rules are published in Firebase.");
    } else if (err && err.code === 'revoked') toast('Access to this team changed. Reload to continue.');
    else toast('Live updates paused. Reload the page to reconnect.');
  }
  function maybeReady() {
    if (Data.loaded.team && Data.loaded.games && Data.loaded.opps) UI.ready = true;
    scheduleRender();
    if (UI.sheet && UI.sheet.type === 'playerCard') renderSheet();
  }
  async function boot() {
    render();
    const C = window.claude;
    if (!C || typeof C.use !== 'function') {
      UI.standalone = true;
      const cfg = loadAiCfg();
      if (cfg) Caps.sample = makeWorkerAI(cfg);
      const fbCfg = window.GS_FIREBASE;
      if (fbCfg && fbCfg.apiKey && fbCfg.projectId) { await bootFirebase(fbCfg); return; }
      Backend.loadLocal();
      UI.ready = true;
      render();
      return;
    }
    let db = null;
    try { db = await C.use('db'); } catch (e) { db = null; }
    if (!db) {
      Backend.loadLocal();
      UI.ready = true;
      render();
    } else {
      Backend.kind = 'db';
      Backend.db = db;
      // Decide who scores before the first frame: the owner always can, anyone else only
      // when the platform says they may write. Everyone else follows along read-only.
      try {
        const user = await C.use('user');
        if (user) {
          const [owner, can] = await Promise.all([user.isOwner(), user.can('data.write')]);
          UI.canWrite = can;
          UI.readOnly = !(owner || can === true);
        }
      } catch (e) { /* keep editing; a refused write decides */ }
      subscribe(db);
    }
    C.use('sample').then((s) => { Caps.sample = s; scheduleRender(); }).catch(() => {});
    C.use('downloads').then((d) => { Caps.downloads = d; }).catch(() => {});
  }
  boot();
})();
</script>
